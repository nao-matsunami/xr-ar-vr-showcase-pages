<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marker Reveal Consent Board</title><style>:root{color-scheme:dark;--bg:#0a0f19;--card:#142033;--line:#38516c;--text:#edf6ff;--muted:#aec0d2;--cyan:#74dcff;--mint:#82edbc;--amber:#ffd077;--red:#ff8ba0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#243b65,transparent 36%),var(--bg);font:15px system-ui;color:var(--text)}main{max-width:1000px;margin:auto;padding:26px 16px 48px}h1{margin:0;font-size:clamp(27px,5vw,42px)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stage{height:320px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(130deg,#183653,#09111e)}.poster{position:absolute;inset:43px 20%;border:2px solid #87dfff;background:linear-gradient(145deg,#78dfff33,#1c277144);display:grid;place-items:center;text-align:center;font-size:27px;font-weight:700;letter-spacing:.08em}.reveal{position:absolute;inset:0;background:linear-gradient(90deg,#06101de8 0 46%,transparent 46% 54%,#06101de8 54%);transition:.35s}.reveal.balanced{background:linear-gradient(90deg,#06101dcc 0 28%,transparent 28% 72%,#06101dcc 72%)}.reveal.full{background:transparent}.badge{position:absolute;right:16px;top:15px;padding:8px;border:1px solid var(--amber);border-radius:9px;background:#0b1422d9;color:var(--amber);font:12px ui-monospace}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--text);background:#193d58;border:1px solid #4882a2;border-radius:9px;padding:9px 10px;cursor:pointer}button:hover{border-color:var(--cyan)}.row{margin:9px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace}.ok{color:var(--mint);font-weight:700}.warn{color:var(--amber);font-weight:700}.no{color:var(--red);font-weight:700}pre{min-height:132px;white-space:pre-wrap;color:#d3efff;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}.poster{inset:54px 11%}}</style><main><h1>Marker Reveal <span style="color:var(--cyan)">Consent</span> Board</h1><p>派生試作。参照画像の認識結果を、ただちに詳細コンテンツの解放と結びつけず、公開範囲と同意を分けて扱います。</p><div class="grid"><section class="card"><div class="stage"><div class="poster">ARCHIVE<br>OBJECT</div><div id="veil" class="reveal"></div><div id="badge" class="badge">coarse preview</div></div><div class="buttons"><button data-m="coarse">粗い手がかり</button><button data-m="balanced">説明を読む</button><button data-m="full">詳細を解放</button><button id="consent">detail consent: off</button></div><p id="meaning">詳細は明示同意なしには解放されません。</p></section><aside class="card"><b>reveal receipt</b><div class="row">tracking use: <span id="use">—</span></div><div class="row">content detail: <span id="detail">—</span></div><div class="row">consent: <span id="agree">off</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre><p>画像の存在や内容が機微になり得る場面では、認識精度だけでなく、表示粒度・保持期間・同意を別に設計します。</p></aside></div></main><script>const $=s=>document.querySelector(s);let mode='coarse',consent=false,log=[];const rules={coarse:{use:'match → generic cue',detail:'silhouette only',cls:'ok',text:'認識は一般的な手がかりだけに変換します。固有の内容を自動表示しません。'},balanced:{use:'match → exhibit context',detail:'title + short note',cls:'warn',text:'コンテキストを読める粒度。現地説明や案内に向くが、詳細の自動展開はしません。'},full:{use:'match → detailed asset',detail:'full record',cls:'no',text:'詳細を開くには利用者の明示同意が必要です。'}};function note(x){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+x);$('#log').textContent=log.join('\n')}function render(){let r=rules[mode],allowed=mode!=='full'||consent;$('#veil').className='reveal '+(allowed?mode:'coarse');$('#badge').textContent=allowed?r.detail:'consent required';for(const[id,v]of Object.entries({use:r.use,detail:allowed?r.detail:'blocked'})){let e=$('#'+id);e.textContent=v;e.className=r.cls}$('#agree').textContent=consent?'on':'off';$('#agree').className=consent?'ok':'warn';$('#meaning').textContent=allowed?r.text:'詳細は同意待ちです。追跡結果だけで開かず、明示操作を待ちます。';note(mode+' → '+(allowed?r.detail:'blocked'))}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});$('#consent').onclick=()=>{consent=!consent;$('#consent').textContent='detail consent: '+(consent?'on':'off');render()};$('#copy').onclick=async()=>{let r=rules[mode],x=JSON.stringify({trackingUse:r.use,requestedDetail:r.detail,consent,delivered:mode!=='full'||consent?r.detail:'blocked'},null,2);try{await navigator.clipboard.writeText(x);note('receipt copied')}catch{note(x)}};$('#reset').onclick=()=>{mode='coarse';consent=false;log=[];$('#consent').textContent='detail consent: off';render()};$('#reset').click()</script></html>
