<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hit Anchor Commit Ledger</title>
<style>
:root{color-scheme:dark;--ink:#e9efff;--muted:#9eabc8;--bg:#07101c;--panel:#101d31;--line:#29425f;--cyan:#5ee8ee;--amber:#ffc45c;--green:#89ecae;--red:#ff8a9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16365c,transparent 35%),var(--bg);font:15px system-ui,sans-serif;color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px 18px 48px}h1{font-size:clamp(25px,5vw,43px);margin:0}p{line-height:1.65;color:var(--muted)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:16px}.scene{height:280px;position:relative;overflow:hidden;background:linear-gradient(145deg,#102d48,#07101c 65%);border-radius:13px;border:1px solid var(--line)}.floor{position:absolute;width:160%;height:70%;bottom:-35%;left:-30%;border:1px solid #426786;transform:perspective(430px) rotateX(66deg);background:repeating-linear-gradient(90deg,transparent 0 49px,#24425c 50px),repeating-linear-gradient(0deg,transparent 0 49px,#24425c 50px)}.reticle{position:absolute;left:48%;top:42%;width:43px;height:43px;border:3px solid var(--cyan);border-radius:50%;box-shadow:0 0 28px #38cbd880}.reticle:after{content:"";position:absolute;inset:10px;border:2px solid var(--cyan);border-radius:50%}.anchor{position:absolute;left:52%;top:54%;width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--amber);transform:rotate(-45deg);box-shadow:0 0 28px #ffc45c88;opacity:.3}.anchor.commit{background:var(--green);box-shadow:0 0 32px #89ecae99;opacity:1}.anchor.hold{background:var(--amber);opacity:.8;animation:pulse 1s infinite}@keyframes pulse{50%{transform:rotate(-45deg) scale(.75)}}button,select{background:#183655;color:var(--ink);border:1px solid #3e668d;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--cyan)}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.state{font-weight:700;color:var(--cyan)}ol{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px;border-radius:9px;border:1px solid #223c58;color:var(--muted)}.row.active{border-color:var(--cyan);background:#123b55;color:var(--ink)}.row.done{border-color:#2f7652;color:var(--green)}.tag{font-size:12px;padding:3px 7px;border-radius:12px;background:#1c3049}.log{min-height:172px;max-height:270px;overflow:auto;font:12px ui-monospace,monospace;color:#c5d5ef;white-space:pre-wrap}.hint{border-left:3px solid var(--amber);padding-left:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style><main>
<h1>Hit → Anchor <span style="color:var(--cyan)">Commit Ledger</span></h1><p>自作の最小試作。WebXR の hit-test 由来 anchor を、結果取得・create 要求・Promise 解決・次 frame の tracked 観測に分けて扱います。実機がなくても合成フローを操作でき、対応環境では API probe も行います。</p>
<div class="grid"><section class="card"><div class="scene"><div class="floor"></div><div class="reticle"></div><div id="anchor" class="anchor"></div></div><div class="controls"><button id="hit">1. Hit を取得</button><button id="create">2. createAnchor 要求</button><button id="resolve">3. Promise を解決</button><button id="track">4. 次 frame で追跡</button><button id="lose">Tracking loss</button></div><p class="hint">確定 marker は <b>tracked + pose</b> の後だけ緑になります。Promise 解決だけでは preview のままです。</p></section><aside class="card"><div>現在: <span id="state" class="state">待機中</span></div><ol id="steps"></ol><div class="controls"><button id="save">台帳を保存</button><button id="export">JSON を書き出す</button></div></aside></div>
<section class="card" style="margin-top:16px"><b>Receipt log</b><div id="log" class="log"></div></section>
<script>
const stages=[['hit','Hit result','XRFrame.getHitTestResults() の先頭を preview に使う'],['request','Create request','XRHitTestResult.createAnchor() を active frame で呼ぶ'],['resolved','Promise resolved','anchor object はあるが、まだ placement を確定しない'],['tracked','Tracked + pose','trackedAnchors と getPose(anchorSpace) を確認して commit'],['lost','Tracking loss','pose null / tracked から消失。新しい確定値は作らない']];
let at=-1, receipts=[];const $=s=>document.querySelector(s), stamp=()=>new Date().toLocaleTimeString('ja-JP',{hour12:false});
function draw(){ $('#steps').innerHTML=stages.map((s,i)=>`<li class="row ${i===at?'active':''} ${i<at&&at!==4?'done':''}"><b>${i+1}</b><span>${s[1]}<small style="display:block">${s[2]}</small></span><span class="tag">${i===at?'now':i<at?'ok':'wait'}</span></li>`).join('');let mode=at===3?'commit':at===4?'hold':'';$('#anchor').className='anchor '+mode;let names=['待機中','Hit preview','作成要求中','Promise resolved: preview','Tracked: commit','Tracking loss: hold'];$('#state').textContent=names[at+1]||names[0]}
function add(kind,detail){const row={time:new Date().toISOString(),kind,detail,route:kind==='tracked'?'commit':kind==='lost'?'hold':'preview'};receipts.push(row);$('#log').textContent=`[${stamp()}] ${kind.padEnd(16)} ${detail}\n`+$('#log').textContent;draw()}
function go(n,detail){at=n;add(stages[n].id,detail)}
$('#hit').onclick=()=>go(0,'synthetic hit pose: local-floor (0.18, 0.00, -0.72)');
$('#create').onclick=()=>{if(at<0)return add('guard','先に hit result を取得してください');go(1,'active XRFrame 内で createAnchor() を要求');};
$('#resolve').onclick=()=>{if(at<1)return add('guard','create request が必要です');go(2,'Promise<XRAnchor> resolved; attributes are not committed');};
$('#track').onclick=()=>{if(at<2)return add('guard','Promise resolve 後に観測してください');go(3,'next frame: trackedAnchors has anchor; getPose() returned pose');};
$('#lose').onclick=()=>{if(at<2)return add('guard','anchor がまだありません');go(4,'getPose(anchorSpace) returned null; retain visual hold, do not create duplicate');};
$('#save').onclick=()=>{localStorage.setItem('xr-hit-anchor-ledger',JSON.stringify({savedAt:new Date().toISOString(),receipts}));add('saved','localStorage: xr-hit-anchor-ledger')};
$('#export').onclick=()=>{let b=new Blob([JSON.stringify({receipts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hit-anchor-ledger.json';a.click();URL.revokeObjectURL(a.href);add('exported','JSON download created')};
(async()=>{let xr=!!navigator.xr, ar=xr?await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false):false;add('probe',`navigator.xr=${xr}; immersive-ar=${ar}; real session is optional`);draw()})();
</script></main></html>
