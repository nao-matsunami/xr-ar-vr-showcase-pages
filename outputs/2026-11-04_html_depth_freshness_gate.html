<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Freshness Gate</title><style>:root{color-scheme:dark;--b:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#174e60,transparent 35%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.scene{height:300px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#1d5367,#08131b 72%)}.world{position:absolute;inset:17% 11%;border:2px solid #72d7f355;border-radius:14px}.marker{position:absolute;left:48%;top:43%;width:52px;height:52px;border:2px solid var(--g);border-radius:50%;background:#92f3bd33;box-shadow:0 0 24px #92f3bd77;transition:.35s}.marker.preview{border-color:var(--a);background:#ffd5792c;box-shadow:0 0 24px #ffd57955}.marker.stop{border-color:var(--r);background:#ff8ba22b;box-shadow:0 0 24px #ff8ba255;opacity:.45}.scan{position:absolute;left:0;right:0;top:46%;border-top:2px dashed var(--c);transition:.35s}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.meter{height:12px;margin-top:7px;border-radius:999px;border:1px solid var(--l);background:#061018;overflow:hidden}.meter i{display:block;height:100%;width:86%;background:var(--g);transition:.35s}pre{min-height:130px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Depth Freshness <span style="color:var(--c)">Gate</span></h1><p>派生の自作試作。深度の値があっても capture 時刻と現在の表示時刻が離れれば、配置の確定を preview / block に落とします。</p><div class="grid"><section class="card"><div class="scene"><div class="world"></div><div id="scan" class="scan"></div><div id="marker" class="marker"></div></div><div class="buttons"><button data-age="18">fresh 18 ms</button><button data-age="86">aging 86 ms</button><button data-age="244">stale 244 ms</button><button id="commit">commit placement</button></div><p id="meaning">fresh depth を選び、配置許可を確認します。</p></section><aside class="card"><b>freshness contract</b><div class="row">depth age: <span id="age">18</span> ms<div class="meter"><i id="bar"></i></div></div><div class="row">allowed action: <span id="action" class="good">place + commit</span></div><div class="row">placement receipt: <span id="receipt">not committed</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let age=18,committed=false,log=[];function policy(){return age<50?['place + commit','good','depth and display are near enough to commit']:age<140?['preview + confirm','warn','depth is aging; preview it and require confirmation']:['block placement','bad','depth is stale; obtain a newer receipt first']}function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let[a,k,m]=policy();$('#age').textContent=age;$('#bar').style.width=Math.max(8,100-age/3)+'%';$('#bar').style.background=k==='good'?'var(--g)':k==='warn'?'var(--a)':'var(--r)';let x=$('#action');x.textContent=a;x.className=k;$('#marker').className='marker '+(k==='warn'?'preview':k==='bad'?'stop':'');$('#scan').style.top=(33+Math.min(45,age/7))+'%';$('#meaning').textContent=m;$('#receipt').textContent=committed?'committed at '+age+' ms':'not committed'}document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{age=+b.dataset.age;committed=false;note('depth age → '+age+' ms; '+policy()[0]);draw()});$('#commit').onclick=()=>{if(policy()[1]==='bad'){note('blocked: stale depth cannot commit');return}committed=true;note('placement committed with '+age+' ms depth age');draw()};$('#copy').onclick=async()=>{let r={depthAgeMs:age,action:policy()[0],committed};try{await navigator.clipboard.writeText(JSON.stringify(r,null,2));note('receipt copied')}catch{note(JSON.stringify(r))}};$('#reset').onclick=()=>{age=18;committed=false;log=[];note('ready: freshness gate set to 18 ms');draw()};$('#reset').click()</script></html>
