<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layer Receipt Device Comparator</title>
<style>body{margin:0;background:#0c0d18;color:#f2efff;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}.card{background:#18172a;border:1px solid #393459;border-radius:14px;padding:16px;margin:14px 0}button,select,textarea{background:#252241;color:#f2efff;border:1px solid #625b91;border-radius:8px;padding:8px;margin:4px}textarea{width:100%;min-height:120px;box-sizing:border-box;font:12px ui-monospace,monospace}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.metric{padding:12px;border-radius:10px;background:#24213d}.big{font-size:25px;color:#aee7e2}.good{color:#8ee9c1}.caution{color:#ffd675}.block{color:#ff9aad}canvas{width:100%;height:170px;background:#100f20;border-radius:10px}</style>
<main><h1>Layer Receipt Device Comparator</h1><p>本命が保存した receipt を読み、端末プロファイル別に presentation lag、可読性、thermal risk を比較します。ここでの端末値は合成データであり、実機の XR frame・GPU completion・主観評価を入れるための派生試作です。</p>
<div class="card"><button id="load">Load latest receipt</button><select id="device"><option value="stable">Stable headset</option><option value="warm">Warm mobile XR</option><option value="busy">Busy GPU scene</option></select><button id="run">Compare 8 frames</button><textarea id="json" aria-label="receipt JSON"></textarea></div>
<div class="grid" id="metrics"></div><div class="card"><canvas id="chart" width="850" height="170"></canvas><p id="next"></p></div></main>
<script>
const $=id=>document.getElementById(id), profiles={stable:{lag:15,jitter:3,thermal:12},warm:{lag:28,jitter:9,thermal:58},busy:{lag:41,jitter:17,thermal:79}};
function seed(){return {kind:'layer-timing-receipt',role:'HUD',quality:'text-optimized',opacity:78,presentationLag:24,observed:true}}function val(){try{return JSON.parse($('json').value)}catch{return seed()}}
function render(){let r=val(),p=profiles[$('device').value],data=Array.from({length:8},(_,i)=>Math.round(r.presentationLag+p.lag/2+Math.sin(i*1.7)*p.jitter+i*(p.thermal>70?2:0))),mean=Math.round(data.reduce((a,b)=>a+b)/8),read=Math.max(30,100-Math.round(mean*.8)-Math.round(p.thermal*.25)),route=read>70?'keep quality':read>48?'hold + reduce refresh':'fallback / lower layer cost';$('metrics').innerHTML=[['Mean lag',mean+' ms'],['Readability',read+'/100'],['Thermal risk',p.thermal+'/100'],['Route',route]].map(([a,b])=>`<div class="metric"><small>${a}</small><div class="big">${b}</div></div>`).join('');let c=$('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#514a78';for(let y=30;y<160;y+=40){x.beginPath();x.moveTo(30,y);x.lineTo(830,y);x.stroke()}x.strokeStyle=read>70?'#8ee9c1':read>48?'#ffd675':'#ff9aad';x.lineWidth=3;x.beginPath();data.forEach((v,i)=>{let px=45+i*108,py=150-v*2.2;i?x.lineTo(px,py):x.moveTo(px,py);x.fillText('f'+(i+1)+' '+v+'ms',px-20,165)});x.stroke();$('next').className=read>70?'good':read>48?'caution':'block';$('next').textContent='Next: '+(read>70?'log a real compositor observation beside this frame sequence.':read>48?'sample GPU completion and reduce nonessential updates before the next receipt.':'disable expensive quality hints, preserve core UI, and capture the recovery boundary.');}
$('load').onclick=()=>{$('json').value=localStorage.getItem('xr-layer-timing-receipt')||JSON.stringify(seed(),null,2);render()};$('run').onclick=render;$('json').value=localStorage.getItem('xr-layer-timing-receipt')||JSON.stringify(seed(),null,2);render();
</script>
