<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Margin Occlusion Lab</title><style>:root{color-scheme:dark;--b:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#124a63,transparent 37%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:1000px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.scene{height:312px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(150deg,#215369,#08131b 73%)}.wall{position:absolute;inset:12% 11%;border:2px solid #8ee9ff88;border-radius:15px;background:repeating-linear-gradient(45deg,#ffffff08 0 17px,transparent 18px 35px)}.depth{position:absolute;left:10%;right:10%;top:56%;height:18%;border-top:2px dashed var(--a);background:#ffd57918;transition:.35s}.cube{position:absolute;width:84px;height:84px;left:calc(50% - 42px);top:31%;border:2px solid var(--g);background:#92f3bd2b;box-shadow:0 0 28px #92f3bd66;transform:perspective(280px) rotateY(-22deg) rotateX(9deg);transition:.35s}.cube.hide{opacity:.13;filter:grayscale(1);transform:perspective(280px) rotateY(22deg) translateY(35px)}.cube.warn{border-color:var(--a);background:#ffd57930;box-shadow:0 0 28px #ffd57955}.cube.bad{border-color:var(--r);background:#ff8ba230;box-shadow:0 0 28px #ff8ba255}.tag{position:absolute;left:12px;bottom:11px;padding:6px 8px;border:1px solid var(--l);border-radius:8px;font:12px ui-monospace;background:#07111cbb}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.meter{height:12px;margin-top:7px;border-radius:999px;border:1px solid var(--l);background:#061018;overflow:hidden}.meter i{display:block;height:100%;width:72%;background:var(--g);transition:.35s}pre{min-height:128px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Depth Margin <span style="color:var(--c)">Occlusion Lab</span></h1><p>自作の最小試作。深度を「物体より手前か」だけで決めず、測定値・仮想物までの距離・安全マージンを receipt として分離し、境界でのちらつきを保留にします。</p><div class="grid"><section class="card"><div class="scene"><div class="wall"></div><div id="depth" class="depth"></div><div id="cube" class="cube"></div><div id="tag" class="tag">awaiting depth receipt</div></div><div class="buttons"><button data-mode="front">現実面を手前へ</button><button data-mode="edge">境界 + margin</button><button data-mode="back">現実面を奥へ</button><button id="probe">WebXR probe</button></div><p id="meaning">仮想キューブは深度 receipt を待っています。</p></section><aside class="card"><b>occlusion contract</b><div class="row">environment depth: <span id="real">—</span> m</div><div class="row">virtual depth: 1.60 m / margin: 0.12 m<div class="meter"><i id="bar"></i></div></div><div class="row">decision: <span id="decision">awaiting</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let mode='none',log=[];const cfg={front:[1.22,'occlude','good','現実面は安全マージンより十分手前です。仮想物を隠します。'],edge:[1.53,'hold','warn','境界は margin 内です。古い深度で断定せず、フェード／保留にします。'],back:[1.91,'show','good','現実面は十分奥です。仮想物を表示します。']};function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let c=cfg[mode];if(!c){$('#real').textContent='—';$('#decision').textContent='awaiting';$('#meaning').textContent='仮想キューブは深度 receipt を待っています。';return}let[d,action,klass,text]=c;$('#real').textContent=d.toFixed(2);$('#decision').textContent=action;$('#decision').className=klass;$('#meaning').textContent=text;$('#cube').className='cube '+(action==='occlude'?'hide':action==='hold'?'warn':'');$('#depth').style.top=(32+d*17)+'%';$('#bar').style.width=Math.max(12,Math.min(96,(d/2.2)*100))+'%';$('#bar').style.background=action==='hold'?'var(--a)':'var(--g)';$('#tag').textContent='depth '+d.toFixed(2)+'m → '+action}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;note('depth receipt '+cfg[mode][0].toFixed(2)+'m → '+cfg[mode][1]);draw()});$('#probe').onclick=async()=>{let out='WebXR unavailable';try{out=window.navigator.xr?'immersive-ar: '+await navigator.xr.isSessionSupported('immersive-ar'):'WebXR unavailable'}catch(e){out='probe error: '+e.name}note(out)};$('#copy').onclick=async()=>{let x=mode?{environmentDepth:cfg[mode][0],virtualDepth:1.6,margin:0.12,decision:cfg[mode][1]}:{decision:'awaiting'};try{await navigator.clipboard.writeText(JSON.stringify(x,null,2));note('receipt copied')}catch{note(JSON.stringify(x))}};$('#reset').onclick=()=>{mode='none';log=[];note('ready: choose a simulated depth receipt');draw()};$('#reset').click()</script></html>
