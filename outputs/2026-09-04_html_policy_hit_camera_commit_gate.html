<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy Hit Camera Commit Gate</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #66717f;
      --line: #d7dde4;
      --panel: #ffffff;
      --bg: #f4f7f8;
      --cyan: #1e88a8;
      --green: #2d8a57;
      --amber: #b27016;
      --red: #bd3b35;
      --violet: #6b5fb7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f7faf9 0%, #eef3f5 100%);
      color: var(--ink);
    }
    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    header {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.55rem, 4vw, 3rem);
      letter-spacing: 0;
      line-height: 1.04;
    }
    p { color: var(--muted); line-height: 1.65; margin: 0; }
    .status {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(34, 52, 67, .08);
    }
    .route {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .route.commit { color: var(--green); }
    .route.patch { color: var(--cyan); }
    .route.hold { color: var(--amber); }
    .route.block { color: var(--red); }
    .grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: .86rem;
      color: #344152;
      font-weight: 700;
    }
    select, input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }
    .switch {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-height: 34px;
    }
    .switch input { transform: scale(1.15); accent-color: var(--cyan); }
    .meter {
      height: 12px;
      background: #e8edf0;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #d8e0e5;
    }
    .meter span {
      display: block;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
    }
    .stage {
      min-height: 490px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: #2d3b49;
      background: #f8fafb;
      font-size: .82rem;
      font-weight: 750;
    }
    .chip.ok { border-color: rgba(45, 138, 87, .38); background: #eaf6ef; color: var(--green); }
    .chip.warn { border-color: rgba(178, 112, 22, .38); background: #fff4df; color: var(--amber); }
    .chip.bad { border-color: rgba(189, 59, 53, .38); background: #ffecea; color: var(--red); }
    .viz {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 330px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(30, 136, 168, .12) 1px, transparent 1px),
        linear-gradient(0deg, rgba(45, 138, 87, .12) 1px, transparent 1px),
        radial-gradient(circle at 50% 62%, #ffffff 0 16%, #e8f1f3 17% 100%);
      background-size: 34px 34px, 34px 34px, 100% 100%;
    }
    .phone {
      position: relative;
      width: min(380px, 82%);
      aspect-ratio: 10 / 16;
      border-radius: 28px;
      border: 10px solid #222b35;
      background: #dbe8ec;
      box-shadow: 0 18px 50px rgba(31, 42, 55, .2);
      overflow: hidden;
    }
    .camera {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(138deg, rgba(30,136,168,.24), rgba(45,138,87,.1)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 16px, rgba(255,255,255,.24) 16px 32px);
      opacity: .85;
    }
    .reticle {
      position: absolute;
      left: 50%;
      top: 56%;
      width: 72px;
      height: 72px;
      border: 3px solid var(--green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 999px rgba(255,255,255,.14);
    }
    .reticle::before, .reticle::after {
      content: "";
      position: absolute;
      background: currentColor;
      color: inherit;
    }
    .reticle::before { width: 2px; height: 88px; left: 50%; top: -8px; }
    .reticle::after { height: 2px; width: 88px; left: -8px; top: 50%; }
    .privacy {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      font-size: .76rem;
      font-weight: 800;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(45,138,87,.16);
    }
    .timeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .step {
      min-height: 92px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      font-size: .78rem;
    }
    .step strong {
      display: block;
      margin-bottom: 6px;
      color: #1d2a35;
      font-size: .84rem;
    }
    .step.ok { border-color: rgba(45,138,87,.42); }
    .step.warn { border-color: rgba(178,112,22,.42); }
    .step.bad { border-color: rgba(189,59,53,.42); }
    .log {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      font-size: .84rem;
    }
    .row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      border-bottom: 1px solid #edf1f3;
      padding-bottom: 8px;
    }
    .row span:first-child { color: var(--muted); }
    @media (max-width: 820px) {
      header, .grid { grid-template-columns: 1fr; }
      .timeline { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Policy Hit Camera Commit Gate</h1>
        <p>WebXR の `xr-spatial-tracking`、Raw Camera Access、Hit Test を同じ commit window に置き、取得してよい状態か、配置してよい状態かを分けて可視化する最小サンプルです。</p>
      </div>
      <aside class="status">
        <div id="route" class="route">判定中</div>
        <p id="summary">入力値から camera texture / hit-test commit / fallback の経路を計算します。</p>
      </aside>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label>Session mode
          <select id="mode">
            <option value="immersive-ar">immersive-ar</option>
            <option value="inline">inline</option>
            <option value="immersive-vr">immersive-vr</option>
          </select>
        </label>
        <label>Camera feature request
          <select id="cameraFeature">
            <option value="optional">optionalFeatures: camera-access</option>
            <option value="required">requiredFeatures: camera-access</option>
            <option value="none">camera-access なし</option>
          </select>
        </label>
        <label class="switch">xr-spatial-tracking policy
          <input id="spatialPolicy" type="checkbox" checked>
        </label>
        <label class="switch">camera policy
          <input id="cameraPolicy" type="checkbox" checked>
        </label>
        <label class="switch">hit-test enabled feature
          <input id="hitFeature" type="checkbox" checked>
        </label>
        <label>Consent level <output id="consentOut">88</output>
          <input id="consent" type="range" min="0" max="100" value="88">
        </label>
        <label>Camera frame age ms <output id="frameOut">34</output>
          <input id="frameAge" type="range" min="8" max="280" value="34">
        </label>
        <label>Hit results per frame <output id="hitOut">2</output>
          <input id="hitResults" type="range" min="0" max="5" value="2">
        </label>
        <label>Hit pose age ms <output id="poseOut">22</output>
          <input id="poseAge" type="range" min="4" max="180" value="22">
        </label>
        <label>View alignment <output id="alignOut">91</output>
          <input id="alignment" type="range" min="0" max="100" value="91">
        </label>
      </aside>

      <section class="panel stage">
        <div class="chips" id="chips"></div>
        <div class="viz">
          <div class="phone">
            <div class="camera"></div>
            <div id="reticle" class="reticle"></div>
            <div class="privacy"><span id="privacyDot" class="dot"></span><span id="privacyText">camera guarded</span></div>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
    </section>

    <section class="panel log" id="log"></section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const controls = ["mode", "cameraFeature", "spatialPolicy", "cameraPolicy", "hitFeature", "consent", "frameAge", "hitResults", "poseAge", "alignment"];
    const outputs = {
      consent: $("consentOut"),
      frameAge: $("frameOut"),
      hitResults: $("hitOut"),
      poseAge: $("poseOut"),
      alignment: $("alignOut")
    };

    function readPolicyFeature(name) {
      const policy = document.permissionsPolicy || document.featurePolicy;
      if (!policy || typeof policy.allowsFeature !== "function") return "unknown";
      try {
        return policy.allowsFeature(name);
      } catch {
        return "unsupported";
      }
    }

    function classifyStep(ok, warn) {
      if (ok) return "ok";
      if (warn) return "warn";
      return "bad";
    }

    function chip(label, state) {
      return `<span class="chip ${state}">${label}</span>`;
    }

    function step(title, body, state) {
      return `<div class="step ${state}"><strong>${title}</strong>${body}</div>`;
    }

    function update() {
      Object.keys(outputs).forEach((id) => outputs[id].textContent = $(id).value);

      const mode = $("mode").value;
      const feature = $("cameraFeature").value;
      const spatialPolicy = $("spatialPolicy").checked;
      const cameraPolicy = $("cameraPolicy").checked;
      const hitFeature = $("hitFeature").checked;
      const consent = Number($("consent").value);
      const frameAge = Number($("frameAge").value);
      const hitResults = Number($("hitResults").value);
      const poseAge = Number($("poseAge").value);
      const alignment = Number($("alignment").value);

      const liveSpatial = readPolicyFeature("xr-spatial-tracking");
      const liveCamera = readPolicyFeature("camera");
      const immersive = mode === "immersive-ar";
      const cameraRequested = feature !== "none";
      const cameraRequired = feature === "required";
      const spatialOk = spatialPolicy && mode !== "inline";
      const cameraOk = !cameraRequested || (cameraPolicy && consent >= 70 && immersive);
      const frameFresh = frameAge <= 70;
      const aligned = alignment >= 72;
      const hitOk = hitFeature && hitResults > 0 && poseAge <= 70 && immersive;

      let route = "BLOCK SESSION";
      let routeClass = "block";
      let summary = "必須 gate が欠けているため session または commit を止めます。";
      if (!immersive && cameraRequired) {
        route = "BLOCK CAMERA FEATURE";
        summary = "Raw camera は immersive-ar 前提なので required にすると開始を止めます。";
      } else if (!spatialOk && mode !== "inline") {
        route = "BLOCK SPATIAL POLICY";
        summary = "xr-spatial-tracking が通らないため immersive session を始めません。";
      } else if (cameraRequired && !cameraOk) {
        route = "BLOCK CAMERA CONSENT";
        summary = "requiredFeatures の camera-access は同意・policy 不足で session block にします。";
      } else if (cameraRequested && (!cameraOk || !frameFresh || !aligned)) {
        route = "PATCH WITH FALLBACK";
        routeClass = "patch";
        summary = "camera texture は保留し、hit-test reticle と projection fallback だけを使います。";
      } else if (!hitOk) {
        route = "HOLD PLACEMENT";
        routeClass = "hold";
        summary = "camera gate は通っていますが hit-test pose が弱いため配置 commit を保留します。";
      } else {
        route = "COMMIT CAMERA HIT";
        routeClass = "commit";
        summary = "camera texture と hit-test pose が同じ window で通ったので配置できます。";
      }

      $("route").textContent = route;
      $("route").className = `route ${routeClass}`;
      $("summary").textContent = summary;
      $("reticle").style.borderColor = hitOk ? "var(--green)" : hitResults ? "var(--amber)" : "var(--red)";
      $("reticle").style.opacity = hitResults ? "1" : ".28";
      $("privacyDot").style.background = cameraOk ? "var(--green)" : cameraRequested ? "var(--amber)" : "var(--red)";
      $("privacyText").textContent = cameraRequested ? (cameraOk ? "camera allowed" : "camera fallback") : "no camera";

      const score = Math.round([
        spatialOk || mode === "inline",
        cameraOk,
        frameFresh,
        aligned,
        hitOk
      ].filter(Boolean).length / 5 * 100);
      $("chips").innerHTML = [
        chip(`live xr policy: ${liveSpatial}`, liveSpatial === true ? "ok" : liveSpatial === false ? "bad" : "warn"),
        chip(`live camera policy: ${liveCamera}`, liveCamera === true ? "ok" : liveCamera === false ? "bad" : "warn"),
        chip(`commit score ${score}`, score >= 80 ? "ok" : score >= 50 ? "warn" : "bad"),
        chip(`route ${route.toLowerCase()}`, routeClass === "commit" ? "ok" : routeClass === "block" ? "bad" : "warn")
      ].join("");
      $("timeline").innerHTML = [
        step("1. policy", `spatial ${spatialPolicy ? "allow" : "deny"} / camera ${cameraPolicy ? "allow" : "deny"}`, classifyStep(spatialOk || mode === "inline", spatialPolicy)),
        step("2. consent", `level ${consent}; camera feature ${feature}`, classifyStep(cameraOk, consent >= 50 || !cameraRequested)),
        step("3. camera frame", `${frameAge}ms / alignment ${alignment}`, classifyStep(frameFresh && aligned, frameFresh || aligned)),
        step("4. hit-test", `${hitResults} results / pose ${poseAge}ms`, classifyStep(hitOk, hitResults > 0)),
        step("5. commit", route.toLowerCase(), routeClass === "commit" ? "ok" : routeClass === "block" ? "bad" : "warn")
      ].join("");
      $("log").innerHTML = [
        ["camera route", cameraRequested ? (cameraOk && frameFresh && aligned ? "camera texture" : "projection fallback") : "no camera feature"],
        ["hit route", hitOk ? "place anchor candidate" : hitResults ? "visual reticle only" : "hide reticle"],
        ["next addition", "actual XRSession request + exported gate ledger"],
        ["policy note", "document.permissionsPolicy is read when the browser exposes it"]
      ].map(([key, value]) => `<div class="row"><span>${key}</span><strong>${value}</strong></div>`).join("");
    }

    controls.forEach((id) => $(id).addEventListener("input", update));
    update();
  </script>
</body>
</html>
