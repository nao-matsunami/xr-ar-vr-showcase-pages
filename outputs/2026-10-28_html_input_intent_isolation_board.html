<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Intent Isolation Board</title>
<style>:root{color-scheme:dark;--bg:#07101b;--card:#102033;--line:#2a506c;--ink:#eaf5ff;--muted:#a8b9ca;--cyan:#63e5ed;--amber:#ffca64;--green:#83edaf;--red:#ff8198}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#1b4564,transparent 35%),var(--bg);font:15px system-ui;color:var(--ink)}main{max-width:1040px;margin:auto;padding:28px 18px 50px}h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:var(--muted);line-height:1.65}.card{background:#102033dc;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.route{border:1px solid var(--line);border-radius:13px;padding:13px;min-height:205px}.route h2{font-size:16px;margin:0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cyan);margin-right:6px}.step{margin-top:10px;border-radius:8px;padding:8px;background:#0b1827;border-left:3px solid #395d76;font:12px ui-monospace;color:#cce1f5}.step.on{border-left-color:var(--green);color:var(--green)}.step.block{border-left-color:var(--red);color:var(--red)}button{font:inherit;color:var(--ink);background:#183d5c;border:1px solid #42749c;border-radius:9px;padding:9px 11px;cursor:pointer;margin:4px 5px 0 0}button:hover{border-color:var(--cyan)}#log{min-height:130px;max-height:260px;overflow:auto;margin:0;white-space:pre-wrap;font:12px ui-monospace;color:#cbe0f5}@media(max-width:720px){.routes{grid-template-columns:1fr}}</style>
<main><h1>Input Intent <span style="color:var(--cyan)">Isolation Board</span></h1><p>派生の自作試作。touch・gaze・controller の「いまの intent」を混ぜず、hit receipt がある source だけを placement 候補にします。ボタンでフレームを進め、誤った source の確定が block される様子を確認できます。</p><section class="card"><div class="routes" id="routes"></div><div style="margin-top:12px"><button data-x="touch">touch route</button><button data-x="gaze">gaze route</button><button data-x="controller">controller route</button><button id="mix">source を混ぜて確定</button><button id="clear">clear</button></div></section><section class="card"><b>decision log</b><pre id="log"></pre></section></main>
<script>
const $=s=>document.querySelector(s),names={touch:'screen / generic-touchscreen',gaze:'transient-pointer',controller:'tracked-pointer'};let state={touch:0,gaze:0,controller:0},last='',lines=[];function add(s){lines.unshift(`[${new Date().toLocaleTimeString('ja-JP',{hour12:false})}] ${s}`);$('#log').textContent=lines.join('\n')}function draw(){$('#routes').innerHTML=Object.keys(state).map(k=>{let n=state[k],st=[`input: ${names[k]}`,'hit: frame receipt','select: same source','placement: commit'];return `<article class="route"><h2><span class="dot"></span>${k}</h2>${st.map((x,i)=>`<div class="step ${i<n?'on':''}">${i<n?'✓ ':'○ '}${x}</div>`).join('')}</article>`}).join('')}document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{let k=b.dataset.x;state[k]=Math.min(4,state[k]+1);last=k;add(`${k}: ${['input','hit receipt','select','placement'][state[k]-1]} を受領`);draw()});$('#mix').onclick=()=>{let candidates=Object.entries(state).filter(([,n])=>n>=3).map(([k])=>k);if(!last||state[last]<3){add('BLOCK: 最新 source に同一 source の select receipt がない');return}if(candidates.length>1)add(`BLOCK: ${candidates.join(' + ')} は混在。最新 ${last} だけの receipt を再確認`);else{state[last]=4;add(`COMMIT: ${last} の hit + select だけで placement を確定`)}draw()};$('#clear').onclick=()=>{state={touch:0,gaze:0,controller:0};last='';add('clear: 全ての短命 intent を破棄');draw()};draw();add('ready: 各 route は独立した receipt を持つ');
</script></html>
