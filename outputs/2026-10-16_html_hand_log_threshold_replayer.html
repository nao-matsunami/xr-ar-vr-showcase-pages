<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Log Threshold Replayer</title><style>
:root{color-scheme:dark;--bg:#0d1318;--p:#17242c;--p2:#223640;--l:#54717c;--t:#f3f1e9;--m:#bdcad0;--c:#78dfd2;--g:#a9e690;--y:#f2ca70;--r:#f08079}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#49351b,transparent 35%),var(--bg);color:var(--t);font:15px system-ui,sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 42px}.top,.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;margin-bottom:14px}.box{background:#17242ceb;border:1px solid var(--l);border-radius:11px;padding:17px;box-shadow:0 14px 30px #0005}h1{font-size:clamp(29px,5vw,49px);line-height:1;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}p{margin:0;color:var(--m);line-height:1.65}.tools,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tools{margin:14px 0}button,select,input,textarea{min-height:42px;border:1px solid var(--l);border-radius:8px;background:var(--p2);color:var(--t);padding:0 10px;font:inherit}button{background:#5b4620;border-color:var(--y);cursor:pointer}.stat,.frame{border:1px solid var(--l);border-radius:8px;background:#0912169c;padding:10px}.stat small{display:block;color:var(--m)}.stat b{font-size:18px}textarea{width:100%;height:260px;padding:10px;resize:vertical;line-height:1.45}.frames{display:grid;gap:8px}.good{border-color:var(--g)}.bad{border-color:var(--r)}.warn{border-color:var(--y)}@media(max-width:800px){.top,.grid,.tools,.stats{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><section class="box"><h1>Hand Log Threshold Replayer</h1><p>本命 sample の観測 row を貼り、端末別の tip gap と安定性しきい値で短い commit window を再生する派生試作です。1回のピンチで select candidate を何度も出さない duplicate guard も見えます。</p></section><section class="box"><div class="stats"><div class="stat"><small>device preset</small><b id="device">—</b></div><div class="stat"><small>commit frame</small><b id="commit">—</b></div><div class="stat"><small>route</small><b id="route">—</b></div><div class="stat"><small>duplicate guard</small><b id="guard">—</b></div></div></section></div><div class="tools"><select id="profile"><option value="quest">Quest-like / 18mm</option><option value="noisy">noisy camera / 15mm</option><option value="relaxed">relaxed / 22mm</option></select><select id="pattern"><option value="clean">clean close</option><option value="bounce">bounce</option><option value="loss">joint loss</option><option value="reserved">reserved gesture</option></select><button id="load">本命の最新 row を読む</button><button id="run">8 frame 再生</button></div><div class="grid"><section class="box"><h2>Input row</h2><textarea id="input" spellcheck="false"></textarea></section><section class="box"><h2>Replay ledger</h2><div id="frames" class="frames"></div></section></div></main><script>
const $=s=>document.querySelector(s),profiles={quest:{gap:18,stable:70},noisy:{gap:15,stable:82},relaxed:{gap:22,stable:58}},patterns={clean:[[31,50],[23,65],[17,76],[14,86],[13,91],[13,92],[19,78],[27,70]],bounce:[[27,70],[16,83],[23,62],[15,84],[25,60],[14,88],[16,84],[27,70]],loss:[[26,73],[18,80],[null,0],[null,0],[16,78],[14,84],[14,85],[25,70]],reserved:[[15,92],[14,92],[13,93],[12,94],[12,94],[15,91],[20,82],[28,70]]};
function seed(){return {date:'2026-10-16',sample:'hand-joint-event-logbook',source:'synthetic',event:'select-candidate',tipGapMm:13,jointTracking:96,stability:92,systemReserved:false,confidence:93}}function render(){let base;try{base=JSON.parse($('#input').value)}catch{base=seed()}const p=profiles[$('#profile').value],pat=patterns[$('#pattern').value],reserved=base.systemReserved||$('#pattern').value==='reserved';let good=0,committed=false,commit='—';const fs=pat.map(([gap,stable],i)=>{const ok=!reserved&&gap!=null&&gap<=p.gap&&stable>=p.stable;good=ok?good+1:0;let route=ok?'window-building':'hold';if(reserved)route='block-system';else if(gap==null)route='reacquire';if(good>=2&&!committed){committed=true;commit='F'+(i+1);route='commit-once'}else if(committed&&ok)route='duplicate-suppressed';return {i,gap,stable,route,ok}});$('#device').textContent=$('#profile').selectedOptions[0].text.split(' / ')[0];$('#commit').textContent=commit;$('#route').textContent=committed?'commit then guard':reserved?'block':'no commit';$('#guard').textContent=committed?'armed':'idle';$('#frames').innerHTML=fs.map(f=>`<div class="frame ${f.route==='commit-once'?'good':f.route.includes('block')||f.route==='reacquire'?'bad':f.route==='window-building'||f.route==='duplicate-suppressed'?'warn':''}"><b>F${f.i+1} · ${f.route}</b><br><small>gap ${f.gap??'missing'} mm · stability ${f.stable}% · threshold ${p.gap}mm / ${p.stable}%</small></div>`).join('')}
$('#load').onclick=()=>{$('#input').value=localStorage.getItem('xr-hand-latest')||JSON.stringify(seed(),null,2);render()};$('#run').onclick=render;$('#profile').onchange=render;$('#pattern').onchange=render;$('#input').value=JSON.stringify(seed(),null,2);render();
</script></body></html>
