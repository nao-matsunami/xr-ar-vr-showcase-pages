<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layer Presentation State Replayer</title><style>
:root{color-scheme:dark;--bg:#07101c;--card:#0d2033;--line:#315b78;--ink:#e9f6ff;--mut:#9db8c9;--cyan:#66e4e4;--lime:#c7ed8b;--amber:#ffd271;--red:#ff9098}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#15566d,transparent 38%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 52px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.card{background:#0d2033eF;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 14px 35px #0008}h1{font-size:clamp(30px,5.2vw,49px);line-height:.98;margin:0 0 12px}h2{font-size:17px;margin:0 0 9px}p,.mut{color:var(--mut);line-height:1.62;margin:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}button,select,textarea{min-height:42px;border:1px solid var(--line);border-radius:8px;background:#143449;color:var(--ink);font:inherit;padding:9px 10px}button{cursor:pointer;background:#11555e;border-color:var(--cyan)}textarea{width:100%;min-height:130px;resize:vertical}.items{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#091825}.item b{display:block}.ok{border-color:var(--lime)}.warn{border-color:var(--amber)}.bad{border-color:var(--red)}.frame{font-size:27px;color:var(--cyan);margin:9px 0}.pill{font-size:12px;color:var(--cyan)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><div class="grid"><section class="card"><h1>Presentation State<br>Replayer</h1><p>本命が保存した property commit row を読み、アプリの書込み、XR frame 終端の commit、compositor presentation のどこで見た目が切り替わるかを8 frame で再生する派生試作です。</p><div class="controls"><select id="pattern"><option value="clean">clean presentation</option><option value="late">late application frame</option><option value="flip">rapid property flip</option></select><button id="load">保存済み row を読む</button><button id="play">再生</button></div></section><section class="card"><h2>現在 frame</h2><div id="frame" class="frame">frame 0 / 8</div><p id="reason" class="mut">replay を開始してください。</p><div id="state" class="items" style="margin-top:13px"></div></section></div><div class="grid"><section class="card"><h2>8-frame timeline</h2><div id="timeline" class="items"></div></section><section class="card"><h2>row を貼り付けて試す</h2><textarea id="paste" placeholder="本命の JSON を貼り付け"></textarea><div class="controls"><button id="apply">貼り付けを適用</button></div><p class="mut" style="margin-top:12px">次に足すなら、実 XR frame timestamp と layer の実値を保存して、端末別の present 遅延を並べます。</p></section></div></main><script>
const $=s=>document.querySelector(s);let row={requested:{quality:'text-optimized',presentation:'stereo',opacity:.92}},n=0,timer;function event(i){const p=$('#pattern').value;if(p==='late'&&[2,5].includes(i))return['app late','previous presented state'];if(p==='flip'&&[2,3,4].includes(i))return['new write','commit delayed by one frame'];if(i%3===0)return['write','pending commit'];if(i%3===1)return['commit','waiting for compositor'];return['present','new values visible']};function draw(){const [stage,note]=event(n);$('#frame').textContent=`frame ${n} / 8 — ${stage}`;$('#reason').textContent=`${note}。quality ${row.requested.quality} / ${row.requested.presentation} / opacity ${Math.round(row.requested.opacity*100)}%`;$('#state').innerHTML=`<div class="item ${stage==='present'?'ok':stage==='app late'?'bad':'warn'}"><b>${stage} <span class="pill">${note}</span></b>表示値は presentation の時だけ更新。commit は次の提示を予約します。</div>`;$('#timeline').innerHTML=Array.from({length:8},(_,i)=>{const [s,x]=event(i);return `<div class="item ${i===n?'ok':''}"><b>frame ${i+1}: ${s}</b><span class="mut">${x}</span></div>`}).join('')}function load(){try{row=JSON.parse(localStorage.getItem('xr-layer-property-commit'))||row;$('#paste').value=JSON.stringify(row,null,2)}catch{}draw()}$('#load').onclick=load;$('#pattern').onchange=()=>{n=0;draw()};$('#apply').onclick=()=>{try{row=JSON.parse($('#paste').value);n=0;draw()}catch{alert('JSON を確認してください')}};$('#play').onclick=()=>{clearInterval(timer);n=0;draw();timer=setInterval(()=>{n++;if(n>7){clearInterval(timer);return}draw()},650)};load();
</script>
