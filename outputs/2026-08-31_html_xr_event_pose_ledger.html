<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XR Event Pose Ledger</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101312;
      --panel: rgba(19, 24, 23, 0.94);
      --panel2: rgba(30, 37, 35, 0.88);
      --line: rgba(124, 214, 185, 0.28);
      --text: #f0fff9;
      --muted: #a8bbb4;
      --mint: #7cd6b9;
      --blue: #8fb8ff;
      --amber: #f5c965;
      --red: #ff8c8c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(124, 214, 185, 0.16), transparent 34%),
        linear-gradient(235deg, rgba(143, 184, 255, 0.12), transparent 36%),
        linear-gradient(180deg, #101312, #16201e 62%, #090c0b);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 860px;
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }

    .badge, .panel, .metric, .lane, .row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
    }

    .badge { min-width: 230px; padding: 12px 14px; }
    small, label span, .metric span, .row small {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge strong, .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 1.15rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 14px;
    }

    .panel { padding: 14px; }
    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-weight: 700;
      font-size: 0.88rem;
    }

    select, input[type="range"], button {
      width: 100%;
    }

    select {
      border: 1px solid rgba(240, 255, 249, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    button {
      border: 1px solid rgba(124, 214, 185, 0.48);
      border-radius: 8px;
      background: rgba(124, 214, 185, 0.15);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      border-color: rgba(143, 184, 255, 0.4);
      background: rgba(143, 184, 255, 0.12);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric {
      padding: 12px;
      background: var(--panel2);
    }

    .stage {
      min-height: 330px;
      border: 1px solid rgba(240, 255, 249, 0.14);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(124,214,185,0.18), transparent 28%),
        #111816;
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .ray {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: 3px;
      height: 220px;
      transform-origin: bottom center;
      background: linear-gradient(var(--mint), rgba(124,214,185,0.05));
      border-radius: 99px;
    }

    .target {
      position: absolute;
      width: 76px;
      height: 76px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
      font-weight: 900;
      background: rgba(143,184,255,0.12);
      transform: translate(-50%, -50%);
    }

    .timeline {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 120px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: rgba(255,255,255,0.05);
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--mint), var(--blue));
    }

    .route {
      color: var(--mint);
      font-weight: 900;
      text-align: right;
    }

    .warn { color: var(--amber); }
    .bad { color: var(--red); }
    @media (max-width: 860px) {
      header, .grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .row { grid-template-columns: 1fr; }
      .route { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>XR Event Pose Ledger</h1>
        <p class="subtitle">`selectstart` / `select` / `selectend` / `squeeze` の event frame から target ray pose を読む想定で、実 inline XR probe と合成イベントを同じ台帳へ積む最小サンプルです。</p>
      </div>
      <div class="badge">
        <small>Ledger verdict</small>
        <strong id="verdict">ready</strong>
      </div>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label>Event pattern
          <span>合成イベント列</span>
          <select id="pattern">
            <option value="clean">clean select triplet</option>
            <option value="late-pose">late pose recovery</option>
            <option value="disconnect">selectend after source removal</option>
            <option value="squeeze">squeeze + select overlap</option>
          </select>
        </label>
        <label>Frame budget <span><b id="budgetValue">24</b> ms</span>
          <input id="budget" type="range" min="12" max="72" value="24">
        </label>
        <label>Pose noise <span><b id="noiseValue">18</b> mm</span>
          <input id="noise" type="range" min="0" max="80" value="18">
        </label>
        <button id="step">Step synthetic event</button>
        <button id="auto" class="secondary">Auto ledger</button>
        <button id="inline" class="secondary">Start inline XR probe</button>
      </aside>

      <section class="panel">
        <div class="metrics">
          <div class="metric"><span>event age</span><strong id="age">0 ms</strong></div>
          <div class="metric"><span>pose confidence</span><strong id="confidence">100%</strong></div>
          <div class="metric"><span>event frame</span><strong id="eventFrame">0</strong></div>
          <div class="metric"><span>route</span><strong id="route">observe</strong></div>
        </div>
        <div class="stage" aria-label="target ray visualization">
          <div class="ray" id="ray"></div>
          <div class="target" id="target">select</div>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const pattern = $("pattern");
    const budget = $("budget");
    const noise = $("noise");
    const budgetValue = $("budgetValue");
    const noiseValue = $("noiseValue");
    const verdict = $("verdict");
    const age = $("age");
    const confidence = $("confidence");
    const eventFrame = $("eventFrame");
    const route = $("route");
    const ray = $("ray");
    const target = $("target");
    const timeline = $("timeline");
    let index = 0;
    let frameNo = 0;
    let autoTimer = null;
    const ledger = [];

    const patterns = {
      clean: ["selectstart", "select", "selectend"],
      "late-pose": ["selectstart", "pose-null", "select", "selectend"],
      disconnect: ["selectstart", "source-removed", "selectend"],
      squeeze: ["squeezestart", "selectstart", "select", "squeeze", "selectend", "squeezeend"]
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function synthesize(kind) {
      frameNo += 1;
      const now = performance.now();
      const noiseMeters = Number(noise.value) / 1000;
      const drift = Math.sin(frameNo * 0.72) * noiseMeters;
      const eventDelay = kind === "pose-null" ? Number(budget.value) * 1.7 : Number(budget.value) * (0.25 + (frameNo % 4) * 0.18);
      const poseAvailable = kind !== "pose-null" && kind !== "source-removed";
      const x = 0.5 + drift * 3.2;
      const y = 0.45 + Math.cos(frameNo * 0.58) * noiseMeters * 2.6;
      const poseScore = poseAvailable ? clamp(1 - Math.abs(drift) * 8 - eventDelay / 180, 0, 1) : 0;
      const decision = kind === "source-removed" ? "cancel" : !poseAvailable ? "visual-only retry" : eventDelay > Number(budget.value) ? "hold" : "commit";
      return {
        kind,
        frame: frameNo,
        eventAge: Math.round(eventDelay),
        poseScore,
        x: clamp(x, 0.16, 0.84),
        y: clamp(y, 0.18, 0.78),
        decision,
        time: now
      };
    }

    function pushEntry(entry) {
      ledger.unshift(entry);
      ledger.splice(8);
      render(entry);
    }

    function render(entry) {
      budgetValue.textContent = budget.value;
      noiseValue.textContent = noise.value;
      age.textContent = `${entry.eventAge} ms`;
      confidence.textContent = `${Math.round(entry.poseScore * 100)}%`;
      eventFrame.textContent = String(entry.frame);
      route.textContent = entry.decision;
      route.className = entry.decision === "commit" ? "" : entry.decision === "cancel" ? "bad" : "warn";
      verdict.textContent = `${entry.kind} -> ${entry.decision}`;
      const angle = (entry.x - 0.5) * 46;
      ray.style.transform = `rotate(${angle}deg)`;
      target.style.left = `${entry.x * 100}%`;
      target.style.top = `${entry.y * 100}%`;
      target.textContent = entry.kind.replace("select", "sel");
      timeline.innerHTML = ledger.map((item) => {
        const width = Math.round(item.poseScore * 100);
        const tone = item.decision === "commit" ? "route" : item.decision === "cancel" ? "route bad" : "route warn";
        return `<div class="row">
          <div><small>frame ${item.frame}</small><strong>${item.kind}</strong></div>
          <div class="bar"><div class="fill" style="width:${width}%"></div></div>
          <div class="${tone}">${item.decision}</div>
        </div>`;
      }).join("");
    }

    function stepSynthetic() {
      const sequence = patterns[pattern.value];
      const entry = synthesize(sequence[index % sequence.length]);
      index += 1;
      pushEntry(entry);
    }

    async function startInlineProbe() {
      if (!navigator.xr) {
        pushEntry({ ...synthesize("inline-unavailable"), poseScore: 0, decision: "fallback" });
        return;
      }
      try {
        const session = await navigator.xr.requestSession("inline");
        const refSpace = await session.requestReferenceSpace("viewer");
        ["selectstart", "select", "selectend", "squeezestart", "squeeze", "squeezeend"].forEach((type) => {
          session.addEventListener(type, (event) => {
            let poseScore = 0.2;
            try {
              const pose = event.frame.getPose(event.inputSource.targetRaySpace, refSpace);
              poseScore = pose ? 0.96 : 0.32;
            } catch {
              poseScore = 0.18;
            }
            pushEntry({
              kind: `live-${type}`,
              frame: ++frameNo,
              eventAge: 0,
              poseScore,
              x: 0.5 + Math.sin(frameNo) * 0.18,
              y: 0.43 + Math.cos(frameNo) * 0.11,
              decision: poseScore > 0.7 ? "commit" : "hold",
              time: performance.now()
            });
          });
        });
        pushEntry({ ...synthesize("inline-ready"), poseScore: 0.72, decision: "listening" });
      } catch {
        pushEntry({ ...synthesize("inline-denied"), poseScore: 0.1, decision: "fallback" });
      }
    }

    $("step").addEventListener("click", stepSynthetic);
    $("auto").addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        $("auto").textContent = "Auto ledger";
      } else {
        stepSynthetic();
        autoTimer = setInterval(stepSynthetic, 760);
        $("auto").textContent = "Stop auto";
      }
    });
    $("inline").addEventListener("click", startInlineProbe);
    budget.addEventListener("input", () => render(ledger[0] || synthesize("preview")));
    noise.addEventListener("input", () => render(ledger[0] || synthesize("preview")));
    stepSynthetic();
  </script>
</body>
</html>
