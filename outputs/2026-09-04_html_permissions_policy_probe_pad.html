<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permissions Policy Probe Pad</title>
  <style>
    :root {
      --ink: #15202b;
      --muted: #66717c;
      --line: #d9e0e5;
      --bg: #f5f7f4;
      --paper: #fff;
      --blue: #256f9c;
      --green: #2d8358;
      --orange: #b46724;
      --red: #ba3c42;
      --plum: #7654a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.55rem, 4vw, 2.7rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    button {
      border: 1px solid #1e5f86;
      background: var(--blue);
      color: white;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      gap: 12px;
    }
    .toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      color: #314152;
      font-weight: 750;
    }
    input { accent-color: var(--blue); transform: scale(1.12); }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
      background: #fbfcfd;
    }
    .card strong { font-size: 1rem; }
    .badge {
      width: fit-content;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: .76rem;
      font-weight: 850;
    }
    .ok { color: var(--green); background: #e8f5ee; border: 1px solid rgba(45,131,88,.36); }
    .warn { color: var(--orange); background: #fff3df; border: 1px solid rgba(180,103,36,.36); }
    .bad { color: var(--red); background: #ffebed; border: 1px solid rgba(186,60,66,.36); }
    .matrix {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 180px 1fr 140px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 52px;
    }
    .bar {
      height: 12px;
      border-radius: 999px;
      background: #e8edf0;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--red), var(--orange), var(--green));
    }
    pre {
      overflow: auto;
      margin: 14px 0 0;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #17212b;
      color: #eaf2f7;
      font-size: .82rem;
      line-height: 1.45;
    }
    @media (max-width: 820px) {
      header { display: grid; }
      .layout, .cards, .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Permissions Policy Probe Pad</h1>
        <p>`document.permissionsPolicy.allowsFeature()` が使える時は実値を読み、使えない時は AR 起動前 checklist として `camera` / `xr-spatial-tracking` / `fullscreen` のリスクを比較します。</p>
      </div>
      <button id="refresh">再チェック</button>
    </header>

    <section class="layout">
      <aside class="panel controls">
        <label class="toggle">camera を要求 <input id="wantCamera" type="checkbox" checked></label>
        <label class="toggle">hit-test を要求 <input id="wantHit" type="checkbox" checked></label>
        <label class="toggle">iframe 埋め込み想定 <input id="inFrame" type="checkbox"></label>
        <label class="toggle">fallback UI あり <input id="hasFallback" type="checkbox" checked></label>
        <label class="toggle">同意説明を表示 <input id="hasConsentCopy" type="checkbox" checked></label>
      </aside>

      <section class="panel">
        <div class="cards" id="cards"></div>
        <div class="matrix" id="matrix"></div>
        <pre id="snippet"></pre>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const featureRows = [
      { id: "xr-spatial-tracking", label: "WebXR spatial tracking", weight: 34 },
      { id: "camera", label: "Raw camera / camera", weight: 30 },
      { id: "fullscreen", label: "Fullscreen shell", weight: 10 },
      { id: "geolocation", label: "Geo overlay optional", weight: 8 }
    ];

    function actualFeature(id) {
      const policy = document.permissionsPolicy || document.featurePolicy;
      if (!policy || typeof policy.allowsFeature !== "function") return "unknown";
      try {
        return policy.allowsFeature(id);
      } catch {
        return "unsupported";
      }
    }

    function statusClass(value) {
      if (value === true) return "ok";
      if (value === false) return "bad";
      return "warn";
    }

    function labelFor(value) {
      if (value === true) return "allowed";
      if (value === false) return "blocked";
      return String(value);
    }

    function update() {
      const wantCamera = $("wantCamera").checked;
      const wantHit = $("wantHit").checked;
      const inFrame = $("inFrame").checked;
      const hasFallback = $("hasFallback").checked;
      const hasConsentCopy = $("hasConsentCopy").checked;
      const rows = featureRows.map((row) => ({ ...row, actual: actualFeature(row.id) }));

      const xrBlocked = rows.find((row) => row.id === "xr-spatial-tracking").actual === false;
      const cameraBlocked = rows.find((row) => row.id === "camera").actual === false;
      const needPolicyAttrs = inFrame && (wantCamera || wantHit);
      let score = 100;
      if (xrBlocked) score -= 34;
      if (wantCamera && cameraBlocked) score -= 30;
      if (needPolicyAttrs) score -= 14;
      if (!hasFallback) score -= 12;
      if (wantCamera && !hasConsentCopy) score -= 10;
      score = Math.max(0, score);

      const route = score >= 78 ? "launch ready" : score >= 52 ? "launch with fallback" : "hold launch";
      const routeClass = score >= 78 ? "ok" : score >= 52 ? "warn" : "bad";
      $("cards").innerHTML = [
        ["policy score", `${score}`, routeClass, route],
        ["camera path", wantCamera ? (cameraBlocked ? "fallback" : "requested") : "not requested", wantCamera && cameraBlocked ? "warn" : "ok", "Raw Camera Access gate"],
        ["embed hint", needPolicyAttrs ? "allow attrs needed" : "same document", needPolicyAttrs ? "warn" : "ok", "iframe policy route"]
      ].map(([title, value, klass, body]) => `<article class="card"><span class="badge ${klass}">${value}</span><strong>${title}</strong><p>${body}</p></article>`).join("");

      $("matrix").innerHTML = rows.map((row) => {
        const klass = statusClass(row.actual);
        const width = row.actual === true ? 100 : row.actual === false ? 18 : 48;
        return `<div class="row"><strong>${row.label}</strong><div class="bar"><span style="width:${width}%"></span></div><span class="badge ${klass}">${labelFor(row.actual)}</span></div>`;
      }).join("");

      const required = [];
      if (wantHit) required.push("hit-test");
      if (wantCamera) required.push("camera-access");
      const allow = [];
      if (wantHit) allow.push("xr-spatial-tracking");
      if (wantCamera) allow.push("camera");
      $("snippet").textContent = [
        `route: ${route}`,
        `requestSession("immersive-ar", { optionalFeatures: ${JSON.stringify(required)} })`,
        inFrame ? `<iframe allow="${allow.join("; ")}">` : "top-level document: default allowlist is usually self",
        hasFallback ? "fallback: inline preview + projection reticle" : "fallback: missing",
        hasConsentCopy ? "consent copy: shown before XR request" : "consent copy: missing"
      ].join("\n");
    }

    ["wantCamera", "wantHit", "inFrame", "hasFallback", "hasConsentCopy"].forEach((id) => $(id).addEventListener("input", update));
    $("refresh").addEventListener("click", update);
    update();
  </script>
</body>
</html>
