<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XR Input Log Store Lab</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1213;
      --panel: rgba(20, 26, 27, 0.94);
      --soft: rgba(255,255,255,0.055);
      --line: rgba(114, 210, 192, 0.28);
      --text: #effffa;
      --muted: #a9bbb8;
      --mint: #72d2c0;
      --blue: #8bbdff;
      --amber: #f1c86b;
      --red: #ff8f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(114,210,192,0.15), transparent 32%),
        linear-gradient(235deg, rgba(139,189,255,0.12), transparent 34%),
        linear-gradient(180deg, #0f1213, #162122 62%, #080a0b);
    }
    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .subtitle {
      max-width: 860px;
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }
    .badge, .panel, .metric, .row, .stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
    }
    .badge { min-width: 230px; padding: 12px 14px; }
    small, label span, .metric span, .row small {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge strong, .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 1.15rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 14px;
    }
    .panel { padding: 14px; }
    .controls { display: grid; gap: 12px; }
    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-weight: 700;
      font-size: 0.88rem;
    }
    select, input, button, textarea { width: 100%; }
    select, textarea {
      border: 1px solid rgba(239, 255, 250, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    textarea {
      min-height: 128px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
    }
    button {
      border: 1px solid rgba(114, 210, 192, 0.48);
      border-radius: 8px;
      background: rgba(114, 210, 192, 0.15);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary {
      border-color: rgba(139, 189, 255, 0.4);
      background: rgba(139, 189, 255, 0.12);
    }
    button.danger {
      border-color: rgba(255, 143, 143, 0.38);
      background: rgba(255, 143, 143, 0.12);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric { padding: 12px; background: var(--soft); }
    .stage {
      min-height: 280px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(114,210,192,0.18), transparent 28%),
        #111819;
      background-size: 34px 34px, 34px 34px, auto, auto;
      margin-bottom: 12px;
    }
    .controller {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: 32px;
      height: 48px;
      border: 2px solid var(--mint);
      border-radius: 16px 16px 8px 8px;
      transform: translateX(-50%);
      background: rgba(114,210,192,0.13);
    }
    .ray {
      position: absolute;
      left: 50%;
      bottom: 72px;
      width: 3px;
      height: 190px;
      transform-origin: bottom center;
      background: linear-gradient(var(--mint), rgba(114,210,192,0.03));
      border-radius: 99px;
    }
    .hit {
      position: absolute;
      width: 74px;
      height: 74px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
      font-weight: 900;
      background: rgba(139,189,255,0.12);
      transform: translate(-50%, -50%);
    }
    .rows { display: grid; gap: 8px; }
    .row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 118px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: rgba(255,255,255,0.045);
    }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--mint), var(--blue));
    }
    .route {
      color: var(--mint);
      font-weight: 900;
      text-align: right;
    }
    .warn { color: var(--amber); }
    .bad { color: var(--red); }
    @media (max-width: 880px) {
      header, .grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .row { grid-template-columns: 1fr; }
      .route { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>XR Input Log Store Lab</h1>
        <p class="subtitle">`XRInputSourceEvent.frame.getPose()` と近傍 frame の `XRInputSource.gamepad` snapshot を同じ行として保存する想定の、IndexedDB 対応ミニロガーです。</p>
      </div>
      <div class="badge">
        <small>Storage status</small>
        <strong id="storageStatus">opening</strong>
      </div>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label>Scenario
          <span>保存する入力ログの性格</span>
          <select id="scenario">
            <option value="clean">clean select commit</option>
            <option value="late">late pose recovery</option>
            <option value="noisy">noisy controller drift</option>
            <option value="blurred">visible-blurred pose limit</option>
          </select>
        </label>
        <label>Pose noise
          <span><b id="noiseValue">24</b> mm</span>
          <input id="noise" type="range" min="0" max="80" value="24">
        </label>
        <label>Frame gap
          <span><b id="gapValue">14</b> ms</span>
          <input id="gap" type="range" min="2" max="48" value="14">
        </label>
        <button id="append">Append synthetic XR row</button>
        <button id="burst" class="secondary">Record 5-row burst</button>
        <button id="probe" class="secondary">Probe inline XR support</button>
        <button id="clear" class="danger">Clear IndexedDB rows</button>
        <label>Exported JSON
          <span>2本目の replayer に貼り付け可能</span>
          <textarea id="exportBox" spellcheck="false"></textarea>
        </label>
      </aside>

      <section>
        <div class="metrics">
          <div class="metric"><span>Rows</span><strong id="rowCount">0</strong></div>
          <div class="metric"><span>Commit ready</span><strong id="commitCount">0</strong></div>
          <div class="metric"><span>Retry / hold</span><strong id="retryCount">0</strong></div>
          <div class="metric"><span>XR probe</span><strong id="probeState">not run</strong></div>
        </div>
        <div class="stage" aria-label="XR input ray preview">
          <div id="ray" class="ray"></div>
          <div class="controller"></div>
          <div id="hit" class="hit">pose</div>
        </div>
        <div id="rows" class="rows"></div>
      </section>
    </section>
  </main>

  <script>
    const DB_NAME = "xr-input-log-store-lab";
    const STORE_NAME = "events";
    const state = {
      db: null,
      rows: [],
      seq: 0,
      xrProbe: "not run"
    };

    const scenarioEl = document.querySelector("#scenario");
    const noiseEl = document.querySelector("#noise");
    const gapEl = document.querySelector("#gap");
    const rowsEl = document.querySelector("#rows");
    const exportBox = document.querySelector("#exportBox");

    function openDb() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          const store = db.createObjectStore(STORE_NAME, { keyPath: "id" });
          store.createIndex("createdAt", "createdAt");
          store.createIndex("route", "route");
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function tx(mode = "readonly") {
      return state.db.transaction(STORE_NAME, mode).objectStore(STORE_NAME);
    }

    function getAllRows() {
      return new Promise((resolve, reject) => {
        const request = tx().getAll();
        request.onsuccess = () => resolve(request.result.sort((a, b) => a.createdAt - b.createdAt));
        request.onerror = () => reject(request.error);
      });
    }

    function putRow(row) {
      return new Promise((resolve, reject) => {
        const request = tx("readwrite").put(row);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function clearRows() {
      return new Promise((resolve, reject) => {
        const request = tx("readwrite").clear();
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function classify(row) {
      if (!row.poseAvailable) return "visual-only retry";
      if (row.visibility === "visible-blurred") return "hold";
      if (row.poseConfidence < 0.58) return "hold";
      if (row.frameGapMs > 30) return "retry";
      return "commit";
    }

    function makeRow() {
      state.seq += 1;
      const scenario = scenarioEl.value;
      const noise = Number(noiseEl.value);
      const gap = Number(gapEl.value);
      const seed = state.seq;
      const posePenalty = scenario === "noisy" ? 0.25 : scenario === "late" ? 0.12 : 0;
      const poseAvailable = scenario !== "blurred" && !(scenario === "late" && seed % 4 === 0);
      const confidence = Math.max(0.1, Math.min(0.98, 0.94 - noise / 130 - posePenalty + Math.sin(seed * 1.7) * 0.04));
      const row = {
        id: `${Date.now()}-${seed}`,
        createdAt: Date.now(),
        frame: 420 + seed,
        eventType: seed % 5 === 0 ? "squeeze" : seed % 3 === 0 ? "selectend" : "selectstart",
        handedness: seed % 2 ? "right" : "left",
        eventAgeMs: Math.round(8 + gap * 0.42 + seed % 6),
        frameGapMs: Math.round(gap + (scenario === "late" ? 18 : 0) + Math.max(0, noise - 50) * 0.18),
        poseAvailable,
        poseConfidence: Number(confidence.toFixed(2)),
        visibility: scenario === "blurred" ? "visible-blurred" : "visible",
        targetRay: {
          x: Number((Math.sin(seed * 0.8) * 0.34).toFixed(2)),
          y: Number((1.25 + Math.cos(seed * 0.6) * 0.16).toFixed(2)),
          z: Number((-1.4 - Math.sin(seed * 0.4) * 0.25).toFixed(2))
        },
        gamepad: {
          trigger: Number(Math.min(1, 0.45 + seed % 4 * 0.17).toFixed(2)),
          squeeze: Number((seed % 5 === 0 ? 0.86 : 0.18).toFixed(2)),
          axes: [Number((Math.sin(seed) * 0.18).toFixed(2)), Number((Math.cos(seed) * 0.18).toFixed(2))]
        }
      };
      row.route = classify(row);
      return row;
    }

    async function refresh() {
      state.rows = await getAllRows();
      const recent = state.rows.slice(-7).reverse();
      const commits = state.rows.filter((row) => row.route === "commit").length;
      const retries = state.rows.filter((row) => row.route !== "commit").length;
      document.querySelector("#rowCount").textContent = String(state.rows.length);
      document.querySelector("#commitCount").textContent = String(commits);
      document.querySelector("#retryCount").textContent = String(retries);
      document.querySelector("#probeState").textContent = state.xrProbe;
      exportBox.value = JSON.stringify({
        source: "XR Input Log Store Lab",
        exportedAt: new Date().toISOString(),
        rows: state.rows
      }, null, 2);

      const last = state.rows.at(-1) || makePreviewRow();
      drawStage(last);
      rowsEl.innerHTML = recent.map(renderRow).join("");
    }

    function makePreviewRow() {
      return {
        eventType: "preview",
        frame: 0,
        poseConfidence: 0.74,
        targetRay: { x: 0, y: 1.35, z: -1.45 },
        route: "standby",
        eventAgeMs: 0,
        frameGapMs: 0,
        poseAvailable: true,
        visibility: "visible"
      };
    }

    function drawStage(row) {
      const ray = document.querySelector("#ray");
      const hit = document.querySelector("#hit");
      const angle = row.targetRay.x * 38;
      ray.style.transform = `translateX(-50%) rotate(${angle}deg)`;
      hit.style.left = `${50 + row.targetRay.x * 32}%`;
      hit.style.top = `${46 - (row.targetRay.y - 1.25) * 28}%`;
      hit.textContent = row.poseAvailable ? row.route.split(" ")[0] : "no pose";
      hit.style.borderColor = row.route === "commit" ? "var(--mint)" : row.route === "hold" ? "var(--amber)" : "var(--red)";
    }

    function renderRow(row) {
      const routeClass = row.route === "commit" ? "" : row.route === "hold" || row.route === "retry" ? "warn" : "bad";
      return `
        <article class="row">
          <div><strong>${row.eventType}</strong><small>f${row.frame} ${row.handedness || ""}</small></div>
          <div>
            <small>pose ${Math.round(row.poseConfidence * 100)}% / age ${row.eventAgeMs}ms / gap ${row.frameGapMs}ms</small>
            <div class="bar"><div class="fill" style="width:${Math.round(row.poseConfidence * 100)}%"></div></div>
          </div>
          <div class="route ${routeClass}">${row.route}</div>
        </article>
      `;
    }

    async function appendOne() {
      await putRow(makeRow());
      await refresh();
    }

    async function probeInlineXr() {
      const xr = navigator.xr;
      if (!xr) {
        state.xrProbe = "no navigator.xr";
      } else {
        try {
          const supported = await xr.isSessionSupported("inline");
          state.xrProbe = supported ? "inline supported" : "inline false";
        } catch (error) {
          state.xrProbe = error.name || "probe error";
        }
      }
      await refresh();
    }

    noiseEl.addEventListener("input", () => {
      document.querySelector("#noiseValue").textContent = noiseEl.value;
      drawStage(state.rows.at(-1) || makePreviewRow());
    });
    gapEl.addEventListener("input", () => {
      document.querySelector("#gapValue").textContent = gapEl.value;
    });
    document.querySelector("#append").addEventListener("click", appendOne);
    document.querySelector("#burst").addEventListener("click", async () => {
      for (let i = 0; i < 5; i += 1) await putRow(makeRow());
      await refresh();
    });
    document.querySelector("#probe").addEventListener("click", probeInlineXr);
    document.querySelector("#clear").addEventListener("click", async () => {
      await clearRows();
      await refresh();
    });

    openDb()
      .then(async (db) => {
        state.db = db;
        document.querySelector("#storageStatus").textContent = "IndexedDB ready";
        await refresh();
      })
      .catch((error) => {
        document.querySelector("#storageStatus").textContent = error.message;
        exportBox.value = JSON.stringify({ error: error.message }, null, 2);
      });
  </script>
</body>
</html>
