<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plane Label Placement Router</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #253034;
      --muted: #617176;
      --paper: #fffdfa;
      --bg: #f5f4f0;
      --line: #ddd9cf;
      --blue: #2c6d8f;
      --green: #30775a;
      --amber: #a36823;
      --red: #b65349;
      --magenta: #8a5f83;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 34px; }
    header { display: grid; grid-template-columns: 1fr 330px; gap: 18px; align-items: end; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 8px; font-size: 2.08rem; line-height: 1.08; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .summary, .panel, .room, .result { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px rgba(43, 48, 44, .07); }
    .summary { padding: 16px; }
    .route { font-size: 1.25rem; font-weight: 900; margin-bottom: 8px; }
    .route.place { color: var(--green); }
    .route.preview { color: var(--blue); }
    .route.retarget { color: var(--amber); }
    .route.block { color: var(--red); }
    .grid { display: grid; grid-template-columns: 305px 1fr; gap: 18px; margin-top: 18px; }
    .panel { padding: 16px; display: grid; gap: 14px; align-content: start; }
    label { display: grid; gap: 6px; font-size: .86rem; font-weight: 760; color: #3b474b; }
    select, input[type="range"] { width: 100%; accent-color: var(--blue); }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 1px solid #c5c0b5; background: #fbfcfa; color: var(--ink); border-radius: 8px; padding: 10px 12px; font-weight: 840; cursor: pointer; }
    button.primary { border-color: var(--blue); background: var(--blue); color: white; }
    .room { padding: 18px; min-height: 500px; display: grid; grid-template-rows: 1fr auto; gap: 14px; overflow: hidden; }
    .map { position: relative; min-height: 340px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, #ffffff 0 42%, #ebe7dd 42%); overflow: hidden; }
    .surface { position: absolute; border: 2px solid var(--stroke); background: var(--fill); border-radius: 8px; display: grid; place-items: center; font-weight: 880; }
    .floor { left: 13%; right: 13%; bottom: 11%; height: 30%; transform: perspective(440px) rotateX(58deg); }
    .table { left: 22%; top: 48%; width: 28%; height: 15%; }
    .wall { right: 10%; top: 14%; width: 25%; height: 42%; }
    .target { outline: 4px solid rgba(255,255,255,.8); box-shadow: 0 0 0 5px var(--green), 0 18px 24px rgba(37,48,52,.16); }
    .ghost { opacity: .36; filter: grayscale(.25); }
    .object {
      position: absolute;
      left: var(--ox);
      top: var(--oy);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, var(--magenta) 38%, #483a5c);
      box-shadow: 0 18px 22px rgba(37, 48, 52, .2);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      transition: left .2s ease, top .2s ease;
    }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .metric { min-height: 78px; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: #fffefa; }
    .metric strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
    .result { margin-top: 14px; padding: 14px; display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: 120px 1fr 120px; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fffefa; font-size: .88rem; }
    .tag { justify-self: start; border-radius: 999px; padding: 4px 8px; font-weight: 850; background: #e6f0f5; color: var(--blue); }
    .tag.ok { background: #e4f1e9; color: var(--green); }
    .tag.warn { background: #fff0d8; color: var(--amber); }
    .tag.bad { background: #ffe9e5; color: var(--red); }
    @media (max-width: 830px) {
      header, .grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Plane Label Placement Router</h1>
        <p>Plane Detection の semantic label を直接信じ切らず、目的物、surface label、面積、傾き、depth confidence を合わせて配置先を選ぶ派生試作。</p>
      </div>
      <section class="summary">
        <div id="route" class="route place">PLACE ON FLOOR</div>
        <p id="summary">目的物と floor label が一致し、十分な面積と depth confidence があります。</p>
      </section>
    </header>

    <div class="grid">
      <aside class="panel">
        <label>Object intent
          <select id="intent">
            <option value="floor-art">floor art</option>
            <option value="table-tool">table tool</option>
            <option value="wall-panel">wall panel</option>
            <option value="any-preview">any preview</option>
          </select>
        </label>
        <label>Detected label
          <select id="label">
            <option value="floor">floor</option>
            <option value="table">table</option>
            <option value="wall">wall</option>
            <option value="unknown">unknown</option>
          </select>
        </label>
        <label>Placement area <span id="areaLabel">2.2 m2</span>
          <input id="area" type="range" min="3" max="48" value="22">
        </label>
        <label>Surface tilt <span id="tiltLabel">5 deg</span>
          <input id="tilt" type="range" min="0" max="50" value="5">
        </label>
        <label>Depth confidence <span id="depthLabel">78%</span>
          <input id="depth" type="range" min="0" max="100" value="78">
        </label>
        <label>Plane freshness <span id="freshLabel">86%</span>
          <input id="fresh" type="range" min="0" max="100" value="86">
        </label>
        <label>Retarget tolerance <span id="toleranceLabel">24%</span>
          <input id="tolerance" type="range" min="0" max="100" value="24">
        </label>
        <div class="buttons">
          <button id="gallery" class="primary">Gallery Wall</button>
          <button id="scan">Scan Noise</button>
        </div>
      </aside>

      <section>
        <div class="room">
          <div id="map" class="map">
            <div id="floor" class="surface floor">floor</div>
            <div id="table" class="surface table">table</div>
            <div id="wall" class="surface wall">wall</div>
            <div id="object" class="object">AR</div>
          </div>
          <div class="metrics">
            <div class="metric"><strong id="score">84</strong><span>fit score</span></div>
            <div class="metric"><strong id="target">floor</strong><span>target surface</span></div>
            <div class="metric"><strong id="handoff">anchor</strong><span>next handoff</span></div>
            <div class="metric"><strong id="policy">strict</strong><span>policy</span></div>
          </div>
        </div>
        <div id="result" class="result"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const controls = ["intent", "label", "area", "tilt", "depth", "fresh", "tolerance"].map($);
    const expected = {
      "floor-art": "floor",
      "table-tool": "table",
      "wall-panel": "wall",
      "any-preview": "any"
    };
    const colors = {
      floor: ["rgba(48,119,90,.23)", "#30775a"],
      table: ["rgba(44,109,143,.24)", "#2c6d8f"],
      wall: ["rgba(138,95,131,.22)", "#8a5f83"]
    };

    function values() {
      return {
        intent: $("intent").value,
        label: $("label").value,
        area: Number($("area").value) / 10,
        tilt: Number($("tilt").value),
        depth: Number($("depth").value),
        fresh: Number($("fresh").value),
        tolerance: Number($("tolerance").value)
      };
    }

    function choose(v) {
      const want = expected[v.intent];
      const semanticMatch = want === "any" || want === v.label;
      const retargetable = !semanticMatch && v.tolerance > 52 && v.label !== "unknown";
      const enoughArea = v.area >= (v.intent === "table-tool" ? 0.8 : 1.2);
      const stable = v.tilt < 24 && v.depth > 56 && v.fresh > 52;
      if (v.label === "unknown" || v.depth < 34 || v.fresh < 32) return ["block", "BLOCK PLACEMENT", "semantic label または depth が弱く、reticle preview のみにします。", "reticle", "visual"];
      if (!stable || !enoughArea) return ["preview", "PREVIEW ONLY", "面積、傾き、freshness のどれかが弱く、仮置きだけにします。", v.label, "hold"];
      if (semanticMatch) return ["place", `PLACE ON ${v.label.toUpperCase()}`, "目的物と detected label が一致し、anchor handoff へ進めます。", v.label, "anchor"];
      if (retargetable) return ["retarget", `RETARGET TO ${v.label.toUpperCase()}`, "目的とは違う面ですが、許容度が高いため代替配置として採用します。", v.label, "anchor review"];
      return ["retarget", "ASK RETARGET", "目的物に合う surface ではないため、配置先の再選択を促します。", want, "user choice"];
    }

    function paint(target) {
      ["floor", "table", "wall"].forEach((id) => {
        const node = $(id);
        const [fill, stroke] = colors[id];
        node.style.setProperty("--fill", fill);
        node.style.setProperty("--stroke", stroke);
        node.classList.toggle("target", id === target);
        node.classList.toggle("ghost", target !== "reticle" && id !== target);
      });
      const positions = {
        floor: ["46%", "68%"],
        table: ["31%", "47%"],
        wall: ["73%", "27%"],
        reticle: ["50%", "34%"],
        any: ["50%", "58%"]
      };
      const [x, y] = positions[target] || positions.reticle;
      $("object").style.setProperty("--ox", x);
      $("object").style.setProperty("--oy", y);
    }

    function render() {
      const v = values();
      $("areaLabel").textContent = `${v.area.toFixed(1)} m2`;
      $("tiltLabel").textContent = `${v.tilt} deg`;
      $("depthLabel").textContent = `${v.depth}%`;
      $("freshLabel").textContent = `${v.fresh}%`;
      $("toleranceLabel").textContent = `${v.tolerance}%`;
      const [status, title, text, target, handoff] = choose(v);
      const want = expected[v.intent];
      const semantic = want === "any" || want === v.label ? 22 : -18;
      const score = Math.max(0, Math.round(v.depth * .26 + v.fresh * .22 + Math.min(v.area, 3.6) * 11 - v.tilt + v.tolerance * .1 + semantic));
      $("route").className = `route ${status}`;
      $("route").textContent = title;
      $("summary").textContent = text;
      $("score").textContent = score;
      $("target").textContent = target;
      $("handoff").textContent = handoff;
      $("policy").textContent = v.tolerance > 52 ? "flex" : "strict";
      paint(target);
      const rows = [
        ["intent", `${v.intent} wants ${want}`, want === "any" || want === v.label ? "ok" : "warn"],
        ["detected", `${v.label} label`, v.label === "unknown" ? "bad" : "ok"],
        ["geometry", `${v.area.toFixed(1)}m2 / ${v.tilt}deg`, v.area < 1.2 || v.tilt > 24 ? "warn" : "ok"],
        ["signals", `${v.depth}% depth / ${v.fresh}% fresh`, v.depth < 56 || v.fresh < 52 ? "warn" : "ok"]
      ];
      $("result").innerHTML = rows.map(([name, detail, tone]) => `<div class="row"><strong>${name}</strong><span>${detail}</span><span class="tag ${tone}">${tone}</span></div>`).join("");
    }

    controls.forEach((control) => control.addEventListener("input", render));
    $("gallery").addEventListener("click", () => {
      $("intent").value = "wall-panel"; $("label").value = "wall"; $("area").value = 18; $("tilt").value = 3; $("depth").value = 84; $("fresh").value = 88; $("tolerance").value = 28;
      render();
    });
    $("scan").addEventListener("click", () => {
      $("intent").value = "table-tool"; $("label").value = "unknown"; $("area").value = 7; $("tilt").value = 31; $("depth").value = 41; $("fresh").value = 36; $("tolerance").value = 64;
      render();
    });
    render();
  </script>
</body>
</html>
