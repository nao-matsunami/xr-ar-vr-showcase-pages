<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU XR Capability Negotiation Board</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111417;
      --panel: #1a2327;
      --panel2: #253036;
      --line: #64737b;
      --text: #f7f4ed;
      --muted: #c5d0ce;
      --blue: #8cd1ff;
      --green: #a4db8d;
      --gold: #efca73;
      --red: #ee8179;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(140, 209, 255, 0.13), transparent 34%),
        linear-gradient(315deg, rgba(164, 219, 141, 0.1), transparent 56%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(26, 35, 39, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(7, 10, 12, 0.62); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .board { display: grid; gap: 8px; min-height: 344px; align-content: center; }
    .gate {
      display: grid;
      grid-template-columns: 160px 1fr 132px;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: rgba(7, 10, 12, 0.56);
      color: var(--muted);
    }
    .track { height: 16px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); }
    .fill { height: 100%; width: 0; transition: width 0.18s ease; background: var(--green); }
    .fill.warn { background: var(--gold); }
    .fill.bad { background: var(--red); }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    input[type="range"] { padding: 0; accent-color: var(--blue); }
    textarea { width: 100%; min-height: 180px; padding: 12px; resize: vertical; line-height: 1.45; }
    .rows { display: grid; gap: 8px; }
    .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(7, 10, 12, 0.62); color: var(--muted); }
    @media (max-width: 900px) {
      header, .controls, .metrics, .gate { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>WebGPU XR Capability Negotiation Board</h1>
        <p>WebXR + WebGPU の起動前に、WebGPU adapter、XRGPUBinding、projection layer、depth / motion vector、foveation、space-warp の候補を 1 つの negotiation row に畳みます。昨日の telemetry schema に入れる前の入口チェックです。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>route</span><strong id="routeMetric">-</strong></div>
          <div class="metric"><span>coverage</span><strong id="coverageMetric">0%</strong></div>
          <div class="metric"><span>risk</span><strong id="riskMetric">0</strong></div>
          <div class="metric"><span>missing</span><strong id="missingMetric">0</strong></div>
        </div>
        <div id="board" class="board" aria-label="capability negotiation board"></div>
      </div>
    </header>

    <div class="controls">
      <label>Session target
        <select id="sessionSelect">
          <option value="immersive-vr">immersive-vr</option>
          <option value="immersive-ar">immersive-ar</option>
          <option value="inline">inline</option>
        </select>
      </label>
      <label>WebGPU readiness
        <input id="gpuRange" type="range" min="0" max="100" value="72">
      </label>
      <label>XRGPUBinding confidence
        <input id="bindingRange" type="range" min="0" max="100" value="64">
      </label>
      <label>Depth / motion vectors
        <input id="depthMotionRange" type="range" min="0" max="100" value="58">
      </label>
      <label>Policy / consent
        <input id="policyRange" type="range" min="0" max="100" value="76">
      </label>
    </div>

    <section>
      <h2>Negotiation notes</h2>
      <div id="rows" class="rows"></div>
    </section>

    <section>
      <h2>Export negotiation row</h2>
      <textarea id="rowBox" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const required = [
      "xrSessionMode",
      "webgpuAdapter",
      "xrGpuBinding",
      "projectionLayer",
      "fixedFoveation",
      "depthOrMotionVector",
      "spaceWarpCandidate",
      "policyConsent"
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function decideRoute(session, gpu, binding, depthMotion, policy) {
      if (session === "inline") return "inline-webgl-preview";
      if (policy < 0.45) return "block-before-requestSession";
      if (gpu < 0.42) return "webgl-projection-fallback";
      if (binding < 0.5) return "webgpu-no-xr-binding";
      if (depthMotion > 0.62 && gpu > 0.64) return "webgpu-space-warp-candidate";
      if (gpu > 0.55) return "webgpu-projection-layer";
      return "webgl-balanced-route";
    }

    function compute() {
      const xrSessionMode = $("sessionSelect").value;
      const webgpuAdapter = Number($("gpuRange").value) / 100;
      const xrGpuBinding = Number($("bindingRange").value) / 100;
      const depthOrMotionVector = Number($("depthMotionRange").value) / 100;
      const policyConsent = Number($("policyRange").value) / 100;
      const projectionLayer = clamp((webgpuAdapter + xrGpuBinding) / 2, 0, 1);
      const fixedFoveation = clamp(0.2 + webgpuAdapter * 0.36 - depthOrMotionVector * 0.08, 0, 0.72);
      const spaceWarpCandidate = depthOrMotionVector > 0.6 && projectionLayer > 0.55;
      const available = new Set(["xrSessionMode", "policyConsent"]);
      if (webgpuAdapter > 0.35) available.add("webgpuAdapter");
      if (xrGpuBinding > 0.45) available.add("xrGpuBinding");
      if (projectionLayer > 0.46) available.add("projectionLayer");
      if (webgpuAdapter > 0.5) available.add("fixedFoveation");
      if (depthOrMotionVector > 0.38) available.add("depthOrMotionVector");
      if (spaceWarpCandidate) available.add("spaceWarpCandidate");
      const missingFields = required.filter((field) => !available.has(field));
      const coverage = (required.length - missingFields.length) / required.length;
      const risk = clamp((1 - policyConsent) * 0.32 + (1 - webgpuAdapter) * 0.22 + (1 - xrGpuBinding) * 0.22 + (1 - depthOrMotionVector) * 0.12 + (xrSessionMode === "inline" ? 0.12 : 0), 0, 1);
      return {
        timestamp: new Date().toISOString(),
        xrSessionMode,
        webgpuAdapter: Number(webgpuAdapter.toFixed(2)),
        xrGpuBinding: Number(xrGpuBinding.toFixed(2)),
        projectionLayer: Number(projectionLayer.toFixed(2)),
        fixedFoveation: Number(fixedFoveation.toFixed(2)),
        depthOrMotionVector: Number(depthOrMotionVector.toFixed(2)),
        spaceWarpCandidate,
        policyConsent: Number(policyConsent.toFixed(2)),
        route: decideRoute(xrSessionMode, webgpuAdapter, xrGpuBinding, depthOrMotionVector, policyConsent),
        coverage: Number(coverage.toFixed(3)),
        risk: Number(risk.toFixed(3)),
        missingFields
      };
    }

    function renderGate(label, value, suffix = "") {
      const state = value < 0.42 ? "bad" : value < 0.62 ? "warn" : "";
      return `
        <div class="gate">
          <span>${label}</span>
          <div class="track"><div class="fill ${state}" style="width:${Math.round(value * 100)}%"></div></div>
          <strong>${Math.round(value * 100)}${suffix}</strong>
        </div>
      `;
    }

    function render() {
      const row = compute();
      $("routeMetric").textContent = row.route;
      $("coverageMetric").textContent = `${Math.round(row.coverage * 100)}%`;
      $("riskMetric").textContent = row.risk.toFixed(2);
      $("missingMetric").textContent = row.missingFields.length;
      $("board").innerHTML = [
        renderGate("WebGPU adapter", row.webgpuAdapter, "%"),
        renderGate("XRGPUBinding", row.xrGpuBinding, "%"),
        renderGate("Projection layer", row.projectionLayer, "%"),
        renderGate("Depth / motion", row.depthOrMotionVector, "%"),
        renderGate("Policy / consent", row.policyConsent, "%")
      ].join("");
      $("rows").innerHTML = [
        `route: ${row.route}`,
        `missing fields: ${row.missingFields.length ? row.missingFields.join(", ") : "none"}`,
        `space warp candidate: ${row.spaceWarpCandidate ? "yes" : "no"}`,
        "next: 実 navigator.gpu / navigator.xr / requestSession feature probe の結果でこの row を埋める"
      ].map((text) => `<div class="row">${text}</div>`).join("");
      $("rowBox").value = JSON.stringify(row, null, 2);
    }

    document.querySelectorAll("input, select").forEach((input) => input.addEventListener("input", render));
    render();
  </script>
</body>
</html>
