<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Periphery Priority Mixer</title><style>:root{color-scheme:dark;--b:#07111d;--c:#10263b;--l:#315878;--t:#e7f6ff;--m:#abc6d7;--x:#72ddff;--g:#82edbe;--a:#ffd074;--r:#ff899c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#235272,transparent 40%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:26px 16px 48px}h1{margin:0;font-size:clamp(27px,5vw,42px)}p{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{padding:15px;border:1px solid var(--l);border-radius:16px;background:var(--c)}.field{height:300px;position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(circle,#24637f 0 10%,#102d40 34%,#07101b 75%)}.zone{position:absolute;border-radius:50%;border:1px solid #72ddff55;left:50%;top:50%;transform:translate(-50%,-50%)}.z1{width:35%;height:35%}.z2{width:66%;height:66%}.z3{width:101%;height:101%}.item{position:absolute;padding:8px;border:1px solid;border-radius:8px;font:12px ui-monospace;transition:.3s}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 10px;border-radius:9px;border:1px solid #4382a1;background:#16405a;color:var(--t);font:inherit;cursor:pointer}button:hover{border-color:var(--x)}.row{margin:9px 0;padding:10px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.ok{color:var(--g)}.warn{color:var(--a)}.no{color:var(--r)}pre{min-height:126px;white-space:pre-wrap;color:#d1efff;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Periphery Priority <span style="color:var(--x)">Mixer</span></h1><p>派生の自作試作。周辺品質を下げるとき、何を中心へ寄せ、何を簡略化し、何を止めるかを比較します。</p><div class="grid"><section class="card"><div class="field"><div class="zone z1"></div><div class="zone z2"></div><div class="zone z3"></div><div id="caption" class="item" style="left:42%;top:45%;color:var(--g);border-color:var(--g)">caption</div><div id="particles" class="item" style="left:10%;top:15%;color:var(--a);border-color:var(--a)">particles</div><div id="map" class="item" style="right:8%;bottom:13%;color:var(--x);border-color:var(--x)">mini map</div></div><div class="buttons"><button data-s="calm">calm scene</button><button data-s="busy">busy scene</button><button data-s="critical">critical guidance</button></div><p id="desc">コンテンツ種別ごとに、中心・簡略化・停止の判断を表示します。</p></section><aside class="card"><b>priority receipt</b><div class="row">center: <span id="center">—</span></div><div class="row">periphery: <span id="edge">—</span></div><div class="row">legibility: <span id="legibility">—</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="clear">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let state='calm',log=[];const R={calm:{center:'caption optional',edge:'particles simplified',legibility:'comfortable',c:'ok',cp:'42%',pp:'1',mp:'1',d:'静かな場面。周辺の粒子や背景を軽くしても、中心にある任意の説明は十分読めます。'},busy:{center:'caption protected',edge:'particles reduce + map move inward',legibility:'review contrast',c:'warn',cp:'43%',pp:'.28',mp:'.7',d:'描画負荷が増えた場面。周辺は簡略化し、地図を内側へ寄せ、重要な説明を中心品質に守ります。'},critical:{center:'guidance only',edge:'particles paused + map becomes cue',legibility:'high-contrast required',c:'no',cp:'45%',pp:'0',mp:'.5',d:'安全や手順が重要な場面。装飾を止め、読める指示だけを中心に残します。周辺で読ませる設計を避けます。'}};function note(x){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+x);$('#log').textContent=log.join('\n')}function draw(){let r=R[state];for(let [id,v] of Object.entries({center:r.center,edge:r.edge,legibility:r.legibility})){let e=$('#'+id);e.textContent=v;e.className=r.c}$('#caption').style.left=r.cp;$('#particles').style.opacity=r.pp;$('#map').style.opacity=r.mp;$('#desc').textContent=r.d;note(r.center+' / '+r.edge)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state=b.dataset.s;draw()});$('#copy').onclick=async()=>{let r=R[state],x=JSON.stringify({center:r.center,periphery:r.edge,legibility:r.legibility},null,2);try{await navigator.clipboard.writeText(x);note('receipt copied')}catch{note(x)}};$('#clear').onclick=()=>{state='calm';log=[];draw()};draw()</script></html>
