<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Fallback Route Replayer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121514;
      --panel: #1d2423;
      --panel2: #293230;
      --line: #68756f;
      --text: #f8f3eb;
      --muted: #cbd1ca;
      --blue: #90d4ff;
      --green: #a7dc8f;
      --gold: #f0ca74;
      --red: #ee8179;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(145deg, rgba(144, 212, 255, 0.12), transparent 38%),
        linear-gradient(315deg, rgba(240, 202, 116, 0.1), transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(29, 36, 35, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(7, 10, 11, 0.62); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 8px; min-height: 344px; align-content: center; }
    .frame {
      display: grid;
      grid-template-columns: 84px 1fr 158px;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: rgba(7, 10, 11, 0.56);
      color: var(--muted);
    }
    .track { height: 16px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); }
    .fill { height: 100%; width: 0; transition: width 0.18s ease; }
    .ok { background: var(--green); }
    .watch { background: var(--gold); }
    .fail { background: var(--red); }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    input[type="range"] { padding: 0; accent-color: var(--blue); }
    textarea { width: 100%; min-height: 180px; padding: 12px; resize: vertical; line-height: 1.45; }
    .queue { display: grid; gap: 8px; }
    .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(7, 10, 11, 0.62); color: var(--muted); }
    @media (max-width: 900px) {
      header, .controls, .metrics, .frame { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Feature Fallback Route Replayer</h1>
        <p>1本目の negotiation row を、起動直後の数フレームに展開する派生試作です。feature 欠落、policy ブロック、GPU 余力低下、depth / motion vector 不足がどの fallback に落ちるかを再生します。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>stable frames</span><strong id="stableMetric">0</strong></div>
          <div class="metric"><span>fallbacks</span><strong id="fallbackMetric">0</strong></div>
          <div class="metric"><span>blocked</span><strong id="blockedMetric">0</strong></div>
          <div class="metric"><span>confidence</span><strong id="confidenceMetric">0%</strong></div>
        </div>
        <div id="timeline" class="timeline" aria-label="fallback route timeline"></div>
      </div>
    </header>

    <div class="controls">
      <label>Requested feature
        <select id="featureSelect">
          <option value="webgpu-space-warp-candidate">webgpu-space-warp</option>
          <option value="webgpu-projection-layer">webgpu-projection-layer</option>
          <option value="webgl-balanced-route">webgl-balanced-route</option>
          <option value="inline-webgl-preview">inline-webgl-preview</option>
        </select>
      </label>
      <label>Missing feature pressure
        <input id="missingRange" type="range" min="0" max="100" value="38">
      </label>
      <label>Policy pressure
        <input id="policyRange" type="range" min="0" max="100" value="26">
      </label>
      <label>GPU pressure
        <input id="gpuRange" type="range" min="0" max="100" value="44">
      </label>
      <label>Depth / vector gap
        <input id="depthRange" type="range" min="0" max="100" value="48">
      </label>
    </div>

    <section>
      <h2>Fallback notes</h2>
      <div id="queue" class="queue"></div>
    </section>

    <section>
      <h2>Export fallback replay row</h2>
      <textarea id="rowBox" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function chooseRoute(requested, missing, policy, gpu, depthGap, frame) {
      if (policy > 0.72) return "block-before-requestSession";
      if (requested === "inline-webgl-preview") return "inline-webgl-preview";
      if (missing + frame * 0.025 > 0.72) return "webgl-projection-fallback";
      if (requested === "webgpu-space-warp-candidate" && depthGap > 0.62) return "webgpu-projection-layer-no-warp";
      if (gpu > 0.76) return "lower-foveation-webgl-fallback";
      return requested;
    }

    function compute() {
      const requested = $("featureSelect").value;
      const missing = Number($("missingRange").value) / 100;
      const policy = Number($("policyRange").value) / 100;
      const gpu = Number($("gpuRange").value) / 100;
      const depthGap = Number($("depthRange").value) / 100;
      const frames = Array.from({ length: 7 }, (_, index) => {
        const pressure = clamp(missing * 0.28 + policy * 0.3 + gpu * 0.24 + depthGap * 0.18 + index * 0.025, 0, 1);
        const route = chooseRoute(requested, missing, policy, gpu, depthGap, index);
        const blocked = route === "block-before-requestSession";
        const fallback = route !== requested;
        return {
          index,
          pressure: Number(pressure.toFixed(3)),
          requested,
          route,
          blocked,
          fallback
        };
      });
      const stable = frames.filter((frame) => !frame.fallback && !frame.blocked).length;
      const fallbacks = frames.filter((frame) => frame.fallback).length;
      const blocked = frames.filter((frame) => frame.blocked).length;
      const confidence = clamp(stable / frames.length - fallbacks * 0.035 - blocked * 0.12, 0, 1);
      return {
        requested,
        missingFeaturePressure: Number(missing.toFixed(2)),
        policyPressure: Number(policy.toFixed(2)),
        gpuPressure: Number(gpu.toFixed(2)),
        depthVectorGap: Number(depthGap.toFixed(2)),
        stable,
        fallbacks,
        blocked,
        confidence: Number(confidence.toFixed(3)),
        frames
      };
    }

    function render() {
      const row = compute();
      $("stableMetric").textContent = `${row.stable}/7`;
      $("fallbackMetric").textContent = row.fallbacks;
      $("blockedMetric").textContent = row.blocked;
      $("confidenceMetric").textContent = `${Math.round(row.confidence * 100)}%`;
      $("timeline").innerHTML = row.frames.map((frame) => {
        const state = frame.blocked ? "fail" : frame.fallback ? "watch" : "ok";
        return `
          <div class="frame">
            <strong>f+${frame.index + 1}</strong>
            <div class="track"><div class="fill ${state}" style="width:${Math.round(frame.pressure * 100)}%"></div></div>
            <span>${frame.route}</span>
          </div>
        `;
      }).join("");
      $("queue").innerHTML = [
        row.blocked ? "policy / consent が requestSession 前に止める状態" : "policy block はまだ出ていない",
        row.fallbacks ? `${row.fallbacks} frame で要求 feature から fallback した` : "要求 feature が全 frame で維持された",
        row.confidence < 0.55 ? "次に足すなら feature descriptor ごとの retry queue" : "次に足すなら 1本目の export JSON を直接 import"
      ].map((text) => `<div class="row">${text}</div>`).join("");
      $("rowBox").value = JSON.stringify(row, null, 2);
    }

    document.querySelectorAll("input, select").forEach((input) => input.addEventListener("input", render));
    render();
  </script>
</body>
</html>
