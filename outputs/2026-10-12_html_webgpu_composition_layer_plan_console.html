<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Composition Layer Plan Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101414;
      --panel: #1b2424;
      --panel2: #263434;
      --line: #6a7774;
      --text: #f7f1e8;
      --muted: #cad3cf;
      --cyan: #91d8ff;
      --green: #a7dd91;
      --gold: #efca74;
      --red: #ef8078;
      --ink: rgba(4, 8, 8, 0.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(140deg, rgba(145, 216, 255, 0.12), transparent 36%),
        linear-gradient(310deg, rgba(167, 221, 145, 0.1), transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 36, 36, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric, .layer, .row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
    }
    .metric { padding: 10px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .layers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 320px; }
    .layer { padding: 12px; display: grid; gap: 8px; align-content: start; }
    .layer b { font-size: 15px; }
    .layer small { color: var(--muted); line-height: 1.45; }
    .bar { height: 12px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); }
    .fill { height: 100%; width: 0; transition: width 0.18s ease; background: var(--green); }
    .fill.warn { background: var(--gold); }
    .fill.bad { background: var(--red); }
    .toolbar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    button, select, input, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
    label input[type="checkbox"] { min-height: auto; accent-color: var(--cyan); justify-self: start; }
    label input[type="range"] { padding: 0; accent-color: var(--cyan); }
    button { cursor: pointer; background: #24495d; border-color: #86cdeb; }
    textarea { width: 100%; min-height: 216px; padding: 12px; resize: vertical; line-height: 1.45; }
    .rows { display: grid; gap: 8px; }
    .row { padding: 10px; color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 940px) {
      header, .toolbar, .metrics, .layers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>WebGPU Composition Layer Plan Console</h1>
        <p>Meta Browser 152.1 の WebGPU composition layers と WebXR-WebGPU Binding をきっかけに、projection / quad HUD / depth / motion vector / foveation を起動直前の layer plan row にまとめる本命試作です。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>route</span><strong id="routeMetric">-</strong></div>
          <div class="metric"><span>readiness</span><strong id="readyMetric">0%</strong></div>
          <div class="metric"><span>memory</span><strong id="memoryMetric">0 MB</strong></div>
          <div class="metric"><span>risk</span><strong id="riskMetric">0.00</strong></div>
        </div>
        <div id="layers" class="layers" aria-label="composition layer plan"></div>
      </div>
    </header>

    <div class="toolbar">
      <select id="profileSelect">
        <option value="runtime">runtime probe</option>
        <option value="quest152">quest 152.1 target</option>
        <option value="webgpuLayer">webgpu layer ready</option>
        <option value="webglFallback">webgl fallback</option>
      </select>
      <label>scale <input id="scaleRange" type="range" min="0.7" max="1.5" value="1.05" step="0.05"></label>
      <label>memory cap <input id="capRange" type="range" min="96" max="512" value="256" step="16"></label>
      <label><input id="hudToggle" type="checkbox" checked> quad HUD</label>
      <label><input id="depthToggle" type="checkbox" checked> depth</label>
      <button id="copyButton" type="button">Copy row</button>
    </div>

    <section>
      <h2>Decision notes</h2>
      <div id="notes" class="rows"></div>
    </section>

    <section>
      <h2>Export layer plan row</h2>
      <textarea id="rowBox" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const mb = 1024 * 1024;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function policyAllows(feature) {
      const policy = document.permissionsPolicy || document.featurePolicy;
      if (!policy || typeof policy.allowsFeature !== "function") return null;
      try {
        return policy.allowsFeature(feature);
      } catch {
        return null;
      }
    }

    function seedProfile(name) {
      const runtime = {
        secureContext: window.isSecureContext,
        webgpu: "gpu" in navigator,
        xr: "xr" in navigator,
        xrGpuBinding: "XRGPUBinding" in window,
        projectionLayer: "XRProjectionLayer" in window,
        quadLayer: "XRQuadLayer" in window || "XRWebGLBinding" in window,
        xrSpatialPolicy: policyAllows("xr-spatial-tracking") !== false
      };
      const profiles = {
        runtime,
        quest152: { secureContext: true, webgpu: true, xr: true, xrGpuBinding: true, projectionLayer: true, quadLayer: true, xrSpatialPolicy: true },
        webgpuLayer: { secureContext: true, webgpu: true, xr: true, xrGpuBinding: true, projectionLayer: true, quadLayer: false, xrSpatialPolicy: true },
        webglFallback: { secureContext: true, webgpu: false, xr: true, xrGpuBinding: false, projectionLayer: true, quadLayer: true, xrSpatialPolicy: true }
      };
      return profiles[name];
    }

    function layerBytes(width, height, bytesPerPixel, eyes = 2) {
      return width * height * bytesPerPixel * eyes;
    }

    function buildRow() {
      const profileName = $("profileSelect").value;
      const seed = seedProfile(profileName);
      const scale = Number($("scaleRange").value);
      const capMb = Number($("capRange").value);
      const wantsHud = $("hudToggle").checked;
      const wantsDepth = $("depthToggle").checked;
      const width = Math.round(1832 * scale);
      const height = Math.round(1920 * scale);
      const layers = [
        {
          id: "gpu-projection-color",
          kind: seed.webgpu && seed.xrGpuBinding ? "XRProjectionLayer/WebGPU" : "XRWebGLLayer fallback",
          bytes: layerBytes(width, height, 4),
          status: seed.webgpu && seed.xrGpuBinding && seed.projectionLayer ? "native" : "fallback",
          reason: "stereo color projection"
        },
        wantsDepth ? {
          id: "depth-projection",
          kind: seed.webgpu && seed.xrGpuBinding ? "depth attachment" : "depth texture copy",
          bytes: layerBytes(width, height, 4),
          status: seed.webgpu && seed.xrGpuBinding ? "native" : "deferred",
          reason: "occlusion and depth projection"
        } : null,
        {
          id: "motion-vector",
          kind: seed.webgpu ? "motion vector attachment" : "synthetic velocity row",
          bytes: layerBytes(Math.round(width / 2), Math.round(height / 2), 4),
          status: seed.webgpu ? "native-candidate" : "synthetic",
          reason: "space-warp and prediction recovery"
        },
        wantsHud ? {
          id: "quad-hud",
          kind: seed.quadLayer ? "XRQuadLayer" : "DOM overlay fallback",
          bytes: 1280 * 720 * 4,
          status: seed.quadLayer ? "native" : "fallback",
          reason: "readable debug/control surface"
        } : null
      ].filter(Boolean);
      const totalMb = layers.reduce((sum, layer) => sum + layer.bytes, 0) / mb;
      const fields = ["secureContext", "webgpu", "xr", "xrGpuBinding", "projectionLayer", "xrSpatialPolicy"];
      const ready = fields.reduce((sum, field) => sum + (seed[field] ? 1 : 0), 0) / fields.length;
      const pressure = totalMb / capMb;
      let route = "commit-webgpu-composition-layers";
      if (!seed.secureContext) route = "block-insecure-context";
      else if (!seed.xr || !seed.xrSpatialPolicy) route = "screen-preview-only";
      else if (!seed.webgpu || !seed.xrGpuBinding) route = "webgl-projection-layer-fallback";
      else if (pressure > 1.12) route = "reduce-scale-before-session";
      else if (!seed.quadLayer && wantsHud) route = "native-projection-dom-hud";
      const risk = clamp((1 - ready) * 0.62 + Math.max(0, pressure - 0.78) * 0.38, 0, 1);
      return {
        id: `composition-plan-${Date.now()}`,
        timestamp: new Date().toISOString(),
        source: profileName,
        viewport: { width, height, scale },
        memoryCapMb: capMb,
        memoryTotalMb: Number(totalMb.toFixed(1)),
        pressure: Number(pressure.toFixed(3)),
        readiness: Number(ready.toFixed(3)),
        risk: Number(risk.toFixed(3)),
        route,
        features: seed,
        requested: { quadHud: wantsHud, depthProjection: wantsDepth, motionVector: true, foveation: true },
        layers: layers.map((layer) => ({ ...layer, bytesMb: Number((layer.bytes / mb).toFixed(1)) })),
        nextStep: "replay this row as swapchain pressure frames and decide which layer degrades first"
      };
    }

    function renderLayer(layer, capMb) {
      const ratio = clamp(layer.bytesMb / capMb, 0, 1);
      const state = layer.status.includes("fallback") || layer.status === "deferred" ? "warn" : ratio > 0.34 ? "bad" : "";
      return `
        <div class="layer">
          <b>${layer.id}</b>
          <small>${layer.kind}</small>
          <div class="bar"><div class="fill ${state}" style="width:${Math.round(ratio * 100)}%"></div></div>
          <small>${layer.bytesMb} MB / ${layer.status} / ${layer.reason}</small>
        </div>
      `;
    }

    function render() {
      const row = buildRow();
      $("routeMetric").textContent = row.route;
      $("readyMetric").textContent = `${Math.round(row.readiness * 100)}%`;
      $("memoryMetric").textContent = `${row.memoryTotalMb} MB`;
      $("riskMetric").textContent = row.risk.toFixed(2);
      $("layers").innerHTML = row.layers.map((layer) => renderLayer(layer, row.memoryCapMb)).join("");
      $("notes").innerHTML = [
        `pressure ${row.pressure}: ${row.pressure > 1 ? "scale or HUD layer must degrade before session start" : "composition memory fits the current cap"}`,
        `route ${row.route}: ${row.layers.map((layer) => layer.id + "=" + layer.status).join(", ")}`,
        `next: ${row.nextStep}`
      ].map((note) => `<div class="row">${note}</div>`).join("");
      $("rowBox").value = JSON.stringify(row, null, 2);
    }

    $("copyButton").addEventListener("click", async () => {
      $("rowBox").select();
      await navigator.clipboard?.writeText($("rowBox").value).catch(() => {});
    });
    ["profileSelect", "scaleRange", "capRange", "hudToggle", "depthToggle"].forEach((id) => {
      $(id).addEventListener("input", render);
    });
    render();
  </script>
</body>
</html>
