<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflection Privacy Budget</title><style>:root{color-scheme:dark;--b:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#432c68,transparent 35%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.scene{height:300px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#244059,#0a111a 72%)}.room{position:absolute;inset:14% 11%;border:2px solid #a6ddec55;border-radius:14px}.cube{position:absolute;width:118px;height:118px;left:calc(50% - 59px);top:31%;border:2px solid var(--c);background:linear-gradient(135deg,#9beeff,#5a64c9 42%,#152440 75%);box-shadow:0 0 34px #69e5ff66;transform:perspective(260px) rotateY(-32deg) rotateX(12deg);transition:.35s}.cube:after{content:"";position:absolute;inset:14px;background:linear-gradient(120deg,#fff9,transparent 28%,#ffe2a755 60%,transparent 68%);transition:.35s}.pixels{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 7px,#0003 8px 9px);opacity:.05;transition:.35s}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.meter{height:12px;margin-top:7px;border-radius:999px;border:1px solid var(--l);background:#061018;overflow:hidden}.meter i{display:block;height:100%;width:32%;background:var(--g);transition:.35s}pre{min-height:130px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Reflection Privacy <span style="color:var(--c)">Budget</span></h1><p>派生の自作試作。環境反射を写実性の上限ではなく、空間・時間の詳細をどこまで出すかという予算として扱います。低周波・低更新の表現から、同意を要する詳細反射まで切り替えます。</p><div class="grid"><section class="card"><div class="scene"><div class="room"></div><div id="cube" class="cube"></div><div id="pixels" class="pixels"></div></div><div class="buttons"><button data-mode="coarse">coarse / default</button><button data-mode="balanced">balanced</button><button data-mode="detailed">detailed + consent</button><button id="apply">apply policy</button></div><p id="meaning">既定の coarse reflection を選んでいます。</p></section><aside class="card"><b>reflection disclosure contract</b><div class="row">spatial detail: <span id="detail">low</span><div class="meter"><i id="bar"></i></div></div><div class="row">update cadence: <span id="cadence">slow</span></div><div class="row">permission: <span id="permission" class="good">default XR grant</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let mode='coarse',applied=false,log=[];const cfg={coarse:['low','slow','default XR grant','good',24,'低周波・低更新の反射です。現実の細部を復元しない、安定した既定表現にします。'],balanced:['medium','moderate','default XR grant','warn',55,'展示や製品のアクセントとして少しだけ環境色を使います。内容を読める反射にはしません。'],detailed:['high','fast','camera consent required','bad',92,'高詳細・高更新の反射は環境の情報量を増やします。追加のカメラ同意と用途表示が前提です。']};function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let[d,c,p,k,w,t]=cfg[mode];$('#detail').textContent=d;$('#cadence').textContent=c;let x=$('#permission');x.textContent=p;x.className=k;$('#bar').style.width=w+'%';$('#bar').style.background=k==='good'?'var(--g)':k==='warn'?'var(--a)':'var(--r)';$('#pixels').style.opacity=mode==='coarse'?'.34':mode==='balanced'?'.16':'.02';$('#cube').style.filter=mode==='coarse'?'blur(1.3px) saturate(.65)':mode==='balanced'?'saturate(.9)':'none';$('#meaning').textContent=t}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;applied=false;note('policy selected: '+cfg[mode][0]+' detail');draw()});$('#apply').onclick=()=>{if(mode==='detailed'&&!confirm('追加の camera consent が必要な想定です。詳細反射を適用しますか？')){note('detailed reflection not applied');return}applied=true;note('policy applied: '+mode);draw()};$('#copy').onclick=async()=>{let c=cfg[mode];let r={detail:c[0],cadence:c[1],permission:c[2],applied};try{await navigator.clipboard.writeText(JSON.stringify(r,null,2));note('receipt copied')}catch{note(JSON.stringify(r))}};$('#reset').onclick=()=>{mode='coarse';applied=false;log=[];note('ready: coarse default reflection');draw()};$('#reset').click()</script></html>
