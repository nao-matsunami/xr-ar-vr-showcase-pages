<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transient Hit Group Router</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #66717c;
      --line: #d8e0e4;
      --paper: #fff;
      --bg: #f3f7f7;
      --blue: #236f96;
      --green: #2c855c;
      --amber: #b06a1f;
      --red: #bc3f42;
      --violet: #6459a7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f9fbfa 0%, var(--bg) 100%);
      color: var(--ink);
    }
    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    header {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.9rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .status, .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(31, 48, 61, .07);
    }
    .route {
      font-size: 1.35rem;
      font-weight: 850;
      margin-bottom: 8px;
    }
    .route.commit { color: var(--green); }
    .route.patch { color: var(--blue); }
    .route.hold { color: var(--amber); }
    .route.block { color: var(--red); }
    .grid {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    .controls {
      display: grid;
      gap: 14px;
      align-content: start;
    }
    label {
      display: grid;
      gap: 6px;
      color: #344252;
      font-size: .86rem;
      font-weight: 750;
    }
    select, input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }
    .switch {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 34px;
    }
    .switch input { transform: scale(1.15); accent-color: var(--blue); }
    .stage {
      display: grid;
      gap: 14px;
    }
    .scene {
      min-height: 340px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(35,111,150,.12) 1px, transparent 1px),
        linear-gradient(0deg, rgba(44,133,92,.12) 1px, transparent 1px),
        radial-gradient(circle at 50% 60%, #fff 0 16%, #e8f0f1 17% 100%);
      background-size: 36px 36px, 36px 36px, 100% 100%;
    }
    .ray {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 3px;
      height: 180px;
      transform-origin: 50% 0;
      background: linear-gradient(180deg, var(--blue), rgba(35,111,150,0));
    }
    .hit {
      position: absolute;
      width: 70px;
      height: 70px;
      border: 3px solid var(--green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      color: var(--green);
      font-weight: 900;
      background: rgba(255,255,255,.64);
    }
    .hit.warn { border-color: var(--amber); color: var(--amber); }
    .hit.bad { border-color: var(--red); color: var(--red); opacity: .42; }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: #f9fbfc;
      color: #2f3d4b;
      font-size: .8rem;
      font-weight: 800;
    }
    .chip.ok { color: var(--green); background: #e8f5ee; border-color: rgba(44,133,92,.35); }
    .chip.warn { color: var(--amber); background: #fff4e2; border-color: rgba(176,106,31,.35); }
    .chip.bad { color: var(--red); background: #ffedef; border-color: rgba(188,63,66,.35); }
    .groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .group {
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 8px;
    }
    .group strong { font-size: .95rem; }
    .meter {
      height: 12px;
      border-radius: 999px;
      background: #e8edf0;
      overflow: hidden;
    }
    .meter span {
      display: block;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
    }
    .log {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #edf1f3;
      font-size: .86rem;
    }
    .row span:first-child { color: var(--muted); }
    @media (max-width: 840px) {
      header, .grid, .groups, .row { grid-template-columns: 1fr; }
      .scene { min-height: 300px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Transient Hit Group Router</h1>
        <p>WebXR Hit Test の `XRTransientInputHitTestResult` が `inputSource` ごとに `results` を束ねる前提を、commit / patch / hold / block の判断表として触る最小サンプルです。</p>
      </div>
      <aside class="status">
        <div id="route" class="route">判定中</div>
        <p id="summary">profile、policy、result grouping、pose age から transient placement の経路を計算します。</p>
      </aside>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label>Transient input profile
          <select id="profile">
            <option value="generic-touchscreen">generic-touchscreen</option>
            <option value="transient-pointer">transient-pointer</option>
            <option value="tracked-pointer">tracked-pointer mismatch</option>
          </select>
        </label>
        <label>Input source groups <output id="groupsOut">2</output>
          <input id="groupsCount" type="range" min="0" max="3" value="2">
        </label>
        <label>Results per active source <output id="resultsOut">2</output>
          <input id="resultsCount" type="range" min="0" max="4" value="2">
        </label>
        <label>Pose age ms <output id="poseOut">24</output>
          <input id="poseAge" type="range" min="6" max="180" value="24">
        </label>
        <label>Grouping confidence <output id="confidenceOut">88</output>
          <input id="confidence" type="range" min="0" max="100" value="88">
        </label>
        <label class="switch">hit-test feature enabled
          <input id="hitFeature" type="checkbox" checked>
        </label>
        <label class="switch">xr-spatial-tracking policy
          <input id="spatialPolicy" type="checkbox" checked>
        </label>
        <label class="switch">dedupe same frame commits
          <input id="dedupe" type="checkbox" checked>
        </label>
      </aside>

      <section class="panel stage">
        <div class="chips" id="chips"></div>
        <div class="scene" id="scene"></div>
        <div class="groups" id="groups"></div>
      </section>
    </section>

    <section class="panel log" id="log"></section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const controls = ["profile", "groupsCount", "resultsCount", "poseAge", "confidence", "hitFeature", "spatialPolicy", "dedupe"];
    const profiles = {
      "generic-touchscreen": { mode: "screen", match: true, label: "screen tap" },
      "transient-pointer": { mode: "transient-pointer", match: true, label: "gaze intent" },
      "tracked-pointer": { mode: "tracked-pointer", match: false, label: "profile mismatch" }
    };

    function policyValue(name) {
      const policy = document.permissionsPolicy || document.featurePolicy;
      if (!policy || typeof policy.allowsFeature !== "function") return "unknown";
      try {
        return policy.allowsFeature(name);
      } catch {
        return "unsupported";
      }
    }

    function chip(label, state) {
      return `<span class="chip ${state}">${label}</span>`;
    }

    function groupCard(group, route) {
      const score = Math.max(0, Math.min(100, group.score));
      const klass = score >= 78 ? "ok" : score >= 45 ? "warn" : "bad";
      return `<article class="group">
        <strong>${group.name}</strong>
        <p>${group.mode} / ${group.results} results / ${group.poseAge}ms</p>
        <div class="meter"><span style="width:${score}%"></span></div>
        <span class="chip ${klass}">${route}</span>
      </article>`;
    }

    function update() {
      $("groupsOut").textContent = $("groupsCount").value;
      $("resultsOut").textContent = $("resultsCount").value;
      $("poseOut").textContent = $("poseAge").value;
      $("confidenceOut").textContent = $("confidence").value;

      const profile = profiles[$("profile").value];
      const groupCount = Number($("groupsCount").value);
      const resultsCount = Number($("resultsCount").value);
      const poseAge = Number($("poseAge").value);
      const confidence = Number($("confidence").value);
      const hitFeature = $("hitFeature").checked;
      const spatialPolicy = $("spatialPolicy").checked;
      const dedupe = $("dedupe").checked;
      const liveSpatial = policyValue("xr-spatial-tracking");

      const activeGroups = Array.from({ length: groupCount }, (_, index) => {
        const age = poseAge + index * 18;
        const results = Math.max(0, resultsCount - (dedupe && index > 0 ? 1 : 0));
        const score = (profile.match ? 30 : 0) + (hitFeature ? 20 : 0) + (spatialPolicy ? 18 : 0) + Math.min(22, results * 8) + Math.max(0, 20 - age / 7) + confidence * .1;
        return {
          name: `inputSource ${index + 1}`,
          mode: index === 0 ? profile.mode : "auxiliary transient",
          results,
          poseAge: age,
          score
        };
      });

      const best = activeGroups.reduce((memo, group) => group.score > memo.score ? group : memo, { score: -1, results: 0, poseAge: 999 });
      let route = "BLOCK SOURCE";
      let routeClass = "block";
      let summary = "hit-test feature、policy、profile のいずれかが不足しています。";
      if (!spatialPolicy || !hitFeature || !profile.match) {
        route = "BLOCK SOURCE";
      } else if (!groupCount || !best.results) {
        route = "HOLD RETICLE";
        routeClass = "hold";
        summary = "transient input は来ていますが、grouped results がないため reticle を出しません。";
      } else if (best.poseAge > 80 || confidence < 55) {
        route = "PATCH WITH LAST HIT";
        routeClass = "patch";
        summary = "inputSource の束ねは取れていますが、pose freshness が弱いため前回 hit を補助表示します。";
      } else {
        route = "COMMIT TRANSIENT HIT";
        routeClass = "commit";
        summary = "profile、policy、grouped results、pose age が揃ったので transient hit を配置候補にします。";
      }

      $("route").textContent = route;
      $("route").className = `route ${routeClass}`;
      $("summary").textContent = summary;

      $("chips").innerHTML = [
        chip(`live xr policy: ${liveSpatial}`, liveSpatial === true ? "ok" : liveSpatial === false ? "bad" : "warn"),
        chip(`profile ${$("profile").value}`, profile.match ? "ok" : "bad"),
        chip(`groups ${groupCount}`, groupCount ? "ok" : "warn"),
        chip(`route ${route.toLowerCase()}`, routeClass === "commit" ? "ok" : routeClass === "block" ? "bad" : "warn")
      ].join("");

      const sceneHits = activeGroups.map((group, index) => {
        const left = 36 + index * 18;
        const top = 63 - Math.min(18, group.results * 4) + index * 5;
        const rot = -22 + index * 20;
        const klass = routeClass === "commit" && group === best ? "" : routeClass === "block" ? "bad" : "warn";
        return `<div class="ray" style="transform: rotate(${rot}deg)"></div><div class="hit ${klass}" style="left:${left}%;top:${top}%">${group.results}</div>`;
      }).join("");
      $("scene").innerHTML = sceneHits || `<div class="hit bad" style="left:50%;top:56%">0</div>`;
      $("groups").innerHTML = activeGroups.map((group) => groupCard(group, group === best ? route.toLowerCase() : "queued / deduped")).join("") || groupCard({ name: "no transient input", mode: "none", results: 0, poseAge, score: 0 }, "waiting");
      $("log").innerHTML = [
        ["source request", `requestHitTestSourceForTransientInput({ profile: "${$("profile").value}", offsetRay: new XRRay() })`],
        ["frame read", "XRFrame.getHitTestResultsForTransientInput(source)"],
        ["grouped field", "XRTransientInputHitTestResult.inputSource + results[]"],
        ["next addition", "export grouped rows into the input/camera commit ledger"]
      ].map(([key, value]) => `<div class="row"><span>${key}</span><strong>${value}</strong></div>`).join("");
    }

    controls.forEach((id) => $(id).addEventListener("input", update));
    update();
  </script>
</body>
</html>
