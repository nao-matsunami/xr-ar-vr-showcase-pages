<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haptic Verdict Pulse Sketch</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d10;
      --panel: rgba(14, 17, 19, 0.93);
      --line: rgba(234, 239, 230, 0.18);
      --text: #f6f8ee;
      --muted: #aeb6aa;
      --cyan: #7ce4dc;
      --green: #b7ec74;
      --amber: #f3c967;
      --red: #ff806f;
      --ink: #07100f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #090d10, #151916 52%, #1c120f);
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.55vw, 2.3rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 820px;
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.96rem;
    }

    .badge,
    .panel,
    .stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.31);
    }

    .badge {
      min-width: 250px;
      padding: 12px 14px;
    }

    .badge b {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      color: var(--cyan);
      font-size: 1.08rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
    }

    .stage {
      min-height: 620px;
      padding: 16px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 380px;
      border: 1px solid rgba(246, 248, 238, 0.12);
      border-radius: 8px;
      background: #07100f;
      cursor: crosshair;
      touch-action: none;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 7px;
      height: 120px;
      align-items: end;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(246, 248, 238, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
    }

    .pulse {
      min-height: 8px;
      border-radius: 6px 6px 2px 2px;
      background: var(--cyan);
      opacity: 0.3;
      transform-origin: bottom;
      transition: opacity 130ms ease, transform 130ms ease;
    }

    .pulse.active {
      opacity: 1;
      transform: scaleY(1.08);
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .readout {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(246, 248, 238, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
    }

    .readout small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .readout strong {
      display: block;
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: 1.02rem;
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .panel {
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 11px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    select,
    input,
    button {
      width: 100%;
      border: 1px solid rgba(246, 248, 238, 0.15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
    }

    select,
    input {
      padding: 10px;
    }

    button {
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.primary {
      color: var(--ink);
      border-color: transparent;
      background: var(--cyan);
      font-weight: 760;
    }

    pre {
      max-height: 260px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      color: #dce8df;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 880px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .badge { min-width: 0; }
      .readouts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Haptic Verdict Pulse Sketch</h1>
        <p class="subtitle">レイヤー可読性や境界判定の verdict を、XRInputSource.gamepad.hapticActuators へ渡す前の短いパルス列として設計する派生試作です。キャンバス上のターゲットをクリックして距離と危険度を変えます。</p>
      </div>
      <div class="badge">
        <b>Pulse verdict</b>
        <strong id="verdictBadge">confirm</strong>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <canvas id="stage" width="760" height="380" aria-label="haptic pulse sketch canvas"></canvas>
        <div class="timeline" id="timeline"></div>
        <div class="readouts">
          <div class="readout"><small>Pattern</small><strong id="patternText">--</strong></div>
          <div class="readout"><small>Total energy</small><strong id="energyText">--</strong></div>
          <div class="readout"><small>Next addition</small><strong id="nextText">--</strong></div>
        </div>
      </div>

      <aside class="side">
        <section class="panel">
          <h2>Controls</h2>
          <div class="control">
            <label for="source">Verdict source <span id="sourceValue"></span></label>
            <select id="source">
              <option value="readability">Layer readability</option>
              <option value="boundary">Teleport boundary</option>
              <option value="anchor">Anchor recovery</option>
            </select>
          </div>
          <div class="control">
            <label for="urgency">Urgency <span id="urgencyValue"></span></label>
            <input id="urgency" type="range" min="0" max="1" step="0.05" value="0.32">
          </div>
          <div class="control">
            <label for="distance">Target distance <span id="distanceValue"></span></label>
            <input id="distance" type="range" min="0.6" max="5.8" step="0.1" value="2.1">
          </div>
          <div class="control">
            <label for="support">Haptics support <span id="supportValue"></span></label>
            <select id="support">
              <option value="dual">Two controllers</option>
              <option value="single">Primary only</option>
              <option value="none">No haptics</option>
            </select>
          </div>
          <button class="primary" id="play">Replay pulse</button>
        </section>

        <section class="panel">
          <h2>Payload</h2>
          <pre id="payload"></pre>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const timeline = document.getElementById("timeline");
    const els = {
      source: document.getElementById("source"),
      urgency: document.getElementById("urgency"),
      distance: document.getElementById("distance"),
      support: document.getElementById("support"),
      play: document.getElementById("play"),
      sourceValue: document.getElementById("sourceValue"),
      urgencyValue: document.getElementById("urgencyValue"),
      distanceValue: document.getElementById("distanceValue"),
      supportValue: document.getElementById("supportValue"),
      verdictBadge: document.getElementById("verdictBadge"),
      patternText: document.getElementById("patternText"),
      energyText: document.getElementById("energyText"),
      nextText: document.getElementById("nextText"),
      payload: document.getElementById("payload")
    };

    const state = {
      source: "readability",
      urgency: 0.32,
      distance: 2.1,
      support: "dual",
      playhead: -1,
      target: { x: 0.56, y: 0.38 }
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function classify() {
      const rangePressure = clamp((state.distance - 1.2) / 4.2, 0, 1);
      const combined = clamp(state.urgency * 0.68 + rangePressure * 0.42, 0, 1);
      if (state.support === "none") return { verdict: "visual-only", tone: "#7ce4dc", combined };
      if (combined < 0.38) return { verdict: "confirm", tone: "#b7ec74", combined };
      if (combined < 0.68) return { verdict: "caution", tone: "#f3c967", combined };
      return { verdict: "block", tone: "#ff806f", combined };
    }

    function buildPattern(result) {
      if (result.verdict === "visual-only") return Array.from({ length: 12 }, () => 0);
      if (result.verdict === "confirm") return [0.25, 0.55, 0, 0, 0.18, 0, 0, 0, 0, 0, 0, 0];
      if (result.verdict === "caution") return [0.32, 0, 0.45, 0, 0.58, 0, 0.28, 0, 0, 0, 0, 0];
      return [0.8, 0, 0.68, 0, 0.78, 0, 0.62, 0, 0.7, 0, 0, 0];
    }

    function draw(result, pattern) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const grd = ctx.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, "#07100f");
      grd.addColorStop(0.6, "#151916");
      grd.addColorStop(1, "#1c120f");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(246,248,238,0.08)";
      for (let x = 28; x < w; x += 38) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 28; y < h; y += 38) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      const origin = { x: w * 0.5, y: h * 0.76 };
      const target = { x: state.target.x * w, y: state.target.y * h };
      const radius = 54 + state.urgency * 74;
      ctx.strokeStyle = result.tone;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(target.x, target.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "rgba(124,228,220,0.5)";
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#f6f8ee";
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#07100f";
      ctx.font = "700 12px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("user", origin.x, origin.y + 4);

      ctx.fillStyle = result.tone;
      ctx.beginPath();
      ctx.arc(target.x, target.y, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#07100f";
      ctx.fillText("v", target.x, target.y + 4);

      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(246,248,238,0.78)";
      ctx.font = "13px Inter, sans-serif";
      ctx.fillText("Click to move verdict target. Pulse bars show a gamepad haptics draft.", 22, 30);
      ctx.fillText(`pattern: ${pattern.map((v) => v.toFixed(2)).join(" / ")}`, 22, h - 22);
    }

    function renderTimeline(pattern, result) {
      timeline.innerHTML = pattern.map((value, index) => {
        const height = Math.max(8, value * 108);
        const active = index === state.playhead ? " active" : "";
        return `<span class="pulse${active}" style="height:${height}px;background:${result.tone}"></span>`;
      }).join("");
    }

    function update() {
      const result = classify();
      const pattern = buildPattern(result);
      const energy = pattern.reduce((sum, value) => sum + value, 0);
      draw(result, pattern);
      renderTimeline(pattern, result);
      els.verdictBadge.textContent = result.verdict;
      els.patternText.textContent = result.verdict;
      els.energyText.textContent = state.support === "none" ? "visual fallback" : energy.toFixed(2);
      els.nextText.textContent = state.support === "none" ? "DOM Overlay reason" : "send pulse() per hand";
      els.sourceValue.textContent = els.source.options[els.source.selectedIndex].textContent;
      els.urgencyValue.textContent = `${Math.round(state.urgency * 100)}%`;
      els.distanceValue.textContent = `${state.distance.toFixed(1)} m`;
      els.supportValue.textContent = els.support.options[els.support.selectedIndex].textContent;
      els.payload.textContent = JSON.stringify({
        date: "2026-08-23",
        verdictSource: state.source,
        hapticsSupport: state.support,
        resolvedVerdict: result.verdict,
        pulseDurationMs: 42,
        intervalMs: 58,
        amplitudes: pattern,
        fallback: state.support === "none" ? "show DOM Overlay reason and reticle color" : "XRInputSource.gamepad.hapticActuators pulse draft",
        telemetry: {
          urgency: state.urgency,
          distanceMeters: state.distance,
          combinedRisk: Number(result.combined.toFixed(3))
        }
      }, null, 2);
    }

    function replay() {
      const result = classify();
      const pattern = buildPattern(result);
      state.playhead = 0;
      update();
      pattern.forEach((_, index) => {
        setTimeout(() => {
          state.playhead = index;
          update();
        }, index * 80);
      });
      setTimeout(() => {
        state.playhead = -1;
        update();
      }, pattern.length * 80 + 120);
    }

    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      state.target.x = clamp((event.clientX - rect.left) / rect.width, 0.04, 0.96);
      state.target.y = clamp((event.clientY - rect.top) / rect.height, 0.06, 0.92);
      const dy = 0.76 - state.target.y;
      state.distance = clamp(0.8 + dy * 6.4, 0.6, 5.8);
      els.distance.value = state.distance;
      replay();
    });

    for (const key of ["source", "urgency", "distance", "support"]) {
      els[key].addEventListener("input", () => {
        const value = els[key].value;
        state[key] = ["urgency", "distance"].includes(key) ? Number(value) : value;
        update();
      });
    }

    els.play.addEventListener("click", replay);
    update();
  </script>
</body>
</html>
