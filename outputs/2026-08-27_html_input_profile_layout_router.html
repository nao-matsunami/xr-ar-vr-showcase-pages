<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Input Profile Layout Router</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #10120f;
      --panel: rgba(18, 22, 19, 0.94);
      --line: rgba(187, 222, 155, 0.25);
      --text: #f7fff0;
      --muted: #b8c8b1;
      --lime: #bbde9b;
      --blue: #8fd5ff;
      --amber: #ffd17a;
      --red: #ff8795;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(187, 222, 155, 0.16), transparent 30%),
        linear-gradient(230deg, rgba(143, 213, 255, 0.15), transparent 34%),
        linear-gradient(180deg, #10120f, #18201c 58%, #0b0f12);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 2.35rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 820px;
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }

    .badge, .panel, .stage, .component, .action {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }

    .badge {
      min-width: 260px;
      padding: 12px 14px;
    }

    .badge small, label span, .component small, .action small {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      color: var(--lime);
      font-size: 1.1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
    }

    .stage {
      min-height: 640px;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .profile-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .profile {
      padding: 12px;
      border: 1px solid rgba(247, 255, 240, 0.13);
      border-radius: 8px;
      background: rgba(7, 10, 8, 0.48);
    }

    .profile b {
      display: block;
      color: var(--lime);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile p {
      margin: 6px 0 0;
      min-height: 42px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 0.8fr);
      gap: 12px;
      min-height: 410px;
    }

    .controller {
      position: relative;
      border: 1px solid rgba(247, 255, 240, 0.12);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 18%, rgba(143, 213, 255, 0.2), transparent 18%),
        linear-gradient(180deg, rgba(247, 255, 240, 0.08), rgba(247, 255, 240, 0.025));
      overflow: hidden;
      min-height: 410px;
    }

    .part {
      position: absolute;
      display: grid;
      place-items: center;
      border: 1px solid rgba(247, 255, 240, 0.17);
      background: rgba(247, 255, 240, 0.08);
      color: var(--text);
      font-weight: 760;
      font-size: 0.82rem;
      cursor: pointer;
      user-select: none;
      transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
    }

    .part.active {
      transform: scale(1.04);
      border-color: rgba(255, 209, 122, 0.9);
      background: rgba(255, 209, 122, 0.34);
    }

    .trigger { left: 29%; top: 12%; width: 42%; height: 44px; border-radius: 8px; }
    .squeeze { left: 18%; top: 29%; width: 64%; height: 56px; border-radius: 8px; }
    .thumbstick { left: 35%; top: 51%; width: 30%; aspect-ratio: 1; border-radius: 999px; }
    .touchpad { left: 20%; top: 69%; width: 60%; height: 44px; border-radius: 999px; }
    .primary { left: 63%; top: 43%; width: 52px; aspect-ratio: 1; border-radius: 999px; }

    .component-list {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .component {
      padding: 10px;
      background: rgba(7, 10, 8, 0.48);
    }

    .component b {
      display: block;
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .component em {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-style: normal;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .action {
      padding: 10px;
      background: rgba(7, 10, 8, 0.52);
      min-width: 0;
    }

    .action strong {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel {
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    label {
      display: grid;
      gap: 7px;
    }

    select, input[type="range"] {
      width: 100%;
      accent-color: var(--lime);
    }

    select {
      min-height: 38px;
      color: var(--text);
      background: rgba(7, 10, 8, 0.76);
      border: 1px solid rgba(247, 255, 240, 0.15);
      border-radius: 8px;
      padding: 0 10px;
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .metric b { color: var(--text); }

    .route {
      padding: 12px;
      border-radius: 8px;
      background: rgba(187, 222, 155, 0.12);
      border: 1px solid rgba(187, 222, 155, 0.28);
      line-height: 1.45;
    }

    .route strong {
      display: block;
      color: var(--lime);
      font-size: 1.05rem;
    }

    .log {
      min-height: 120px;
      max-height: 180px;
      overflow: auto;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #dfead9;
      background: rgba(7, 10, 8, 0.64);
    }

    @media (max-width: 860px) {
      header, .layout, .board { grid-template-columns: 1fr; }
      .actions, .profile-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .badge { min-width: 0; }
    }

    @media (max-width: 540px) {
      main { width: min(100vw - 20px, 1180px); }
      .actions, .profile-strip { grid-template-columns: 1fr; }
      .controller { min-height: 360px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>WebXR Input Profile Layout Router</h1>
        <p class="subtitle">Input Profiles Registry の layout / component / selectComponentId をもとに、XRInputSource.profiles の fallback 順から操作部品を選び、アプリ内 action へ結びつける最小検証です。</p>
      </div>
      <div class="badge">
        <small>selected route</small>
        <strong id="routeBadge">profile lookup</strong>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <div class="profile-strip" id="profileStrip"></div>
        <div class="board">
          <div class="controller" id="controller">
            <button class="part trigger" data-part="trigger">trigger</button>
            <button class="part squeeze" data-part="squeeze">squeeze</button>
            <button class="part thumbstick" data-part="thumbstick">stick</button>
            <button class="part touchpad" data-part="touchpad">pad</button>
            <button class="part primary" data-part="primary">A</button>
          </div>
          <div class="component-list" id="componentList"></div>
        </div>
        <div class="actions" id="actions"></div>
      </div>

      <aside class="panel">
        <label>
          <span>reported profiles</span>
          <select id="reportedProfiles">
            <option value="meta-quest-touch-plus">meta-quest-touch-plus, oculus-touch-v3, generic-trigger-squeeze-thumbstick</option>
            <option value="pico-neo3">pico-neo3, generic-trigger-squeeze-touchpad</option>
            <option value="unknown-vendor">unknown-vendor, generic-trigger</option>
            <option value="screen-emulated">screen-emulated, generic-touchscreen</option>
          </select>
        </label>
        <label>
          <span>handedness</span>
          <select id="handedness">
            <option value="right">right</option>
            <option value="left">left</option>
            <option value="none">none</option>
          </select>
        </label>
        <label>
          <span>registry freshness <b id="freshnessValue">86%</b></span>
          <input id="freshness" type="range" min="30" max="100" value="86">
        </label>
        <label>
          <span>gamepad confidence <b id="gamepadValue">78%</b></span>
          <input id="gamepadConfidence" type="range" min="0" max="100" value="78">
        </label>
        <label>
          <span>fallback penalty <b id="penaltyValue">18%</b></span>
          <input id="fallbackPenalty" type="range" min="0" max="60" value="18">
        </label>
        <div class="metric"><span>matched profile</span><b id="matchedProfile">-</b></div>
        <div class="metric"><span>layout key</span><b id="layoutKey">-</b></div>
        <div class="metric"><span>select component</span><b id="selectComponent">-</b></div>
        <div class="route">
          <strong id="routeTitle">component route</strong>
          <span id="routeText">設定を変更すると routing が更新されます。</span>
        </div>
        <div class="log" id="log"></div>
      </aside>
    </section>
  </main>

  <script>
    const profileSets = {
      "meta-quest-touch-plus": ["meta-quest-touch-plus", "oculus-touch-v3", "generic-trigger-squeeze-thumbstick"],
      "pico-neo3": ["pico-neo3", "generic-trigger-squeeze-touchpad"],
      "unknown-vendor": ["unknown-vendor", "generic-trigger"],
      "screen-emulated": ["screen-emulated", "generic-touchscreen"]
    };

    const registry = {
      "oculus-touch-v3": {
        fallbackProfileIds: ["generic-trigger-squeeze-thumbstick"],
        layouts: {
          "left-right": {
            selectComponentId: "xr-standard-trigger",
            components: {
              "xr-standard-trigger": { type: "trigger", button: 0 },
              "xr-standard-squeeze": { type: "squeeze", button: 1 },
              "xr-standard-thumbstick": { type: "thumbstick", axes: [2, 3] },
              "xr-standard-primary": { type: "button", button: 4 }
            }
          }
        }
      },
      "pico-neo3": {
        fallbackProfileIds: ["generic-trigger-squeeze-touchpad"],
        layouts: {
          "left-right": {
            selectComponentId: "trigger",
            components: {
              "trigger": { type: "trigger", button: 0 },
              "squeeze": { type: "squeeze", button: 1 },
              "touchpad": { type: "touchpad", axes: [0, 1] }
            }
          }
        }
      },
      "generic-trigger-squeeze-thumbstick": {
        fallbackProfileIds: ["generic-trigger"],
        layouts: {
          "left-right": {
            selectComponentId: "trigger",
            components: {
              "trigger": { type: "trigger", button: 0 },
              "squeeze": { type: "squeeze", button: 1 },
              "thumbstick": { type: "thumbstick", axes: [2, 3] }
            }
          }
        }
      },
      "generic-trigger-squeeze-touchpad": {
        fallbackProfileIds: ["generic-trigger"],
        layouts: {
          "left-right": {
            selectComponentId: "trigger",
            components: {
              "trigger": { type: "trigger", button: 0 },
              "squeeze": { type: "squeeze", button: 1 },
              "touchpad": { type: "touchpad", axes: [0, 1] }
            }
          }
        }
      },
      "generic-trigger": {
        fallbackProfileIds: [],
        layouts: {
          "left-right-none": {
            selectComponentId: "trigger",
            components: {
              "trigger": { type: "trigger", button: 0 }
            }
          }
        }
      },
      "generic-touchscreen": {
        fallbackProfileIds: [],
        layouts: {
          "none": {
            selectComponentId: "screen-tap",
            components: {
              "screen-tap": { type: "button", button: 0 }
            }
          }
        }
      }
    };

    const state = {
      pressed: "trigger",
      lastLogs: []
    };

    const els = {
      reportedProfiles: document.querySelector("#reportedProfiles"),
      handedness: document.querySelector("#handedness"),
      freshness: document.querySelector("#freshness"),
      gamepadConfidence: document.querySelector("#gamepadConfidence"),
      fallbackPenalty: document.querySelector("#fallbackPenalty"),
      freshnessValue: document.querySelector("#freshnessValue"),
      gamepadValue: document.querySelector("#gamepadValue"),
      penaltyValue: document.querySelector("#penaltyValue"),
      profileStrip: document.querySelector("#profileStrip"),
      componentList: document.querySelector("#componentList"),
      actions: document.querySelector("#actions"),
      routeBadge: document.querySelector("#routeBadge"),
      matchedProfile: document.querySelector("#matchedProfile"),
      layoutKey: document.querySelector("#layoutKey"),
      selectComponent: document.querySelector("#selectComponent"),
      routeTitle: document.querySelector("#routeTitle"),
      routeText: document.querySelector("#routeText"),
      log: document.querySelector("#log")
    };

    function chooseProfile() {
      const reported = profileSets[els.reportedProfiles.value];
      const visited = new Set();
      const queue = [...reported];
      while (queue.length) {
        const id = queue.shift();
        if (visited.has(id)) continue;
        visited.add(id);
        if (registry[id]) {
          return { id, reported, fallbackDepth: reported.indexOf(id) >= 0 ? reported.indexOf(id) : 1 };
        }
        const generic = id.includes("touch") ? "generic-trigger-squeeze-thumbstick" : "generic-trigger";
        if (!visited.has(generic)) queue.push(generic);
      }
      return { id: "generic-trigger", reported, fallbackDepth: 2 };
    }

    function chooseLayout(profile) {
      const keys = Object.keys(profile.layouts);
      const hand = els.handedness.value;
      if (profile.layouts[hand]) return { key: hand, layout: profile.layouts[hand] };
      if ((hand === "left" || hand === "right") && profile.layouts["left-right"]) return { key: "left-right", layout: profile.layouts["left-right"] };
      if (profile.layouts["left-right-none"]) return { key: "left-right-none", layout: profile.layouts["left-right-none"] };
      if (profile.layouts.none) return { key: "none", layout: profile.layouts.none };
      return { key: keys[0], layout: profile.layouts[keys[0]] };
    }

    function actionFor(part, layout) {
      const entry = Object.entries(layout.components).find(([, value]) => value.type === part || (part === "primary" && value.type === "button"));
      if (!entry) return { action: "unmapped", detail: "component missing" };
      const [componentId, component] = entry;
      if (componentId === layout.selectComponentId || component.type === "trigger") return { action: "select", detail: componentId };
      if (component.type === "squeeze") return { action: "grab", detail: componentId };
      if (component.type === "thumbstick") return { action: "turn / move", detail: componentId };
      if (component.type === "touchpad") return { action: "cursor nudge", detail: componentId };
      return { action: "secondary confirm", detail: componentId };
    }

    function addLog(message) {
      const time = new Date().toLocaleTimeString("ja-JP", { hour12: false });
      state.lastLogs.unshift(`${time} ${message}`);
      state.lastLogs = state.lastLogs.slice(0, 8);
      els.log.textContent = state.lastLogs.join("\n");
    }

    function render() {
      els.freshnessValue.textContent = `${els.freshness.value}%`;
      els.gamepadValue.textContent = `${els.gamepadConfidence.value}%`;
      els.penaltyValue.textContent = `${els.fallbackPenalty.value}%`;

      const selected = chooseProfile();
      const profile = registry[selected.id];
      const { key, layout } = chooseLayout(profile);
      const components = Object.entries(layout.components);
      const isFallback = !profileSets[els.reportedProfiles.value].includes(selected.id) || selected.id.startsWith("generic");
      const score = Math.max(0, Math.round(Number(els.freshness.value) * 0.36 + Number(els.gamepadConfidence.value) * 0.52 - (isFallback ? Number(els.fallbackPenalty.value) : 0)));
      const route = score >= 72 ? "full component map" : score >= 48 ? "semantic fallback" : "select-only fallback";
      const pressed = actionFor(state.pressed, layout);

      els.profileStrip.innerHTML = profileSets[els.reportedProfiles.value].map((id, index) => `
        <div class="profile">
          <b>${id}</b>
          <p>${registry[id] ? "registry match" : index === 0 ? "unknown vendor id" : "fallback candidate"}</p>
        </div>
      `).join("");

      els.componentList.innerHTML = components.map(([id, component]) => `
        <div class="component">
          <small>${component.type}${id === layout.selectComponentId ? " / select source" : ""}</small>
          <b>${id}</b>
          <em>${component.button !== undefined ? `button[${component.button}]` : ""}${component.axes ? ` axes[${component.axes.join(", ")}]` : ""}</em>
        </div>
      `).join("");

      els.actions.innerHTML = ["trigger", "squeeze", "thumbstick", "touchpad"].map((part) => {
        const mapped = actionFor(part, layout);
        return `
          <div class="action">
            <small>${part}</small>
            <strong>${mapped.action}</strong>
          </div>
        `;
      }).join("");

      document.querySelectorAll(".part").forEach((button) => {
        const active = button.dataset.part === state.pressed;
        button.classList.toggle("active", active);
      });

      els.routeBadge.textContent = route;
      els.matchedProfile.textContent = selected.id;
      els.layoutKey.textContent = key;
      els.selectComponent.textContent = layout.selectComponentId;
      els.routeTitle.textContent = `${route} / ${score}%`;
      els.routeText.textContent = `${state.pressed} は ${pressed.action} として処理。${pressed.detail} を使い、低信頼時は select 以外を UI confirm に回します。`;
    }

    document.querySelectorAll(".part").forEach((button) => {
      button.addEventListener("click", () => {
        state.pressed = button.dataset.part;
        const selected = chooseProfile();
        const { layout } = chooseLayout(registry[selected.id]);
        const mapped = actionFor(state.pressed, layout);
        addLog(`${state.pressed} -> ${mapped.action} (${mapped.detail})`);
        render();
      });
    });

    [els.reportedProfiles, els.handedness, els.freshness, els.gamepadConfidence, els.fallbackPenalty].forEach((control) => {
      control.addEventListener("input", () => {
        addLog(`refresh ${els.reportedProfiles.value} / ${els.handedness.value}`);
        render();
      });
    });

    addLog("profile router ready");
    render();
  </script>
</body>
</html>
