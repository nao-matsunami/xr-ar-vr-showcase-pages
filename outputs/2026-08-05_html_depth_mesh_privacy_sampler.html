<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depth Mesh Privacy Sampler</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #061014;
      --panel: rgba(9, 25, 31, 0.82);
      --line: rgba(128, 244, 255, 0.28);
      --text: #e9fbff;
      --muted: #8eb4bd;
      --cyan: #5ee9ff;
      --green: #8dffb6;
      --amber: #ffd36d;
      --red: #ff6b7d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(94, 233, 255, 0.16), transparent 32rem),
        linear-gradient(135deg, #061014, #101019 48%, #081512);
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 26px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.6vw, 2.4rem);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .status {
      min-width: 210px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .status b {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status span {
      display: block;
      margin-top: 4px;
      font-size: 1.08rem;
      color: var(--green);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
      align-items: start;
    }

    .stage,
    .controls,
    .readouts {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 660px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 660px;
      touch-action: none;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      pointer-events: none;
    }

    .metric {
      border: 1px solid rgba(94, 233, 255, 0.22);
      background: rgba(4, 13, 17, 0.76);
      padding: 10px;
      border-radius: 7px;
    }

    .metric b {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .metric span {
      display: block;
      margin-top: 3px;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }

    .side {
      display: grid;
      gap: 12px;
    }

    .controls,
    .readouts {
      padding: 14px;
    }

    .group {
      display: grid;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid rgba(128, 244, 255, 0.16);
    }

    .group:first-child {
      border-top: 0;
      padding-top: 0;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.83rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button {
      min-height: 36px;
      border: 1px solid rgba(94, 233, 255, 0.34);
      color: var(--text);
      background: rgba(6, 20, 26, 0.86);
      border-radius: 7px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: rgba(141, 255, 182, 0.72);
      box-shadow: inset 0 0 18px rgba(141, 255, 182, 0.16);
      color: var(--green);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(128, 244, 255, 0.13);
      padding: 9px 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .row:first-child {
      border-top: 0;
    }

    .row strong {
      color: var(--text);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .log {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      max-height: 176px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .log li {
      border-left: 2px solid rgba(94, 233, 255, 0.42);
      padding-left: 8px;
    }

    @media (max-width: 920px) {
      main {
        width: min(100% - 20px, 720px);
      }

      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .status {
        min-width: 0;
      }

      .stage {
        min-height: auto;
      }

      canvas {
        height: min(74vh, 560px);
      }

      .hud {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Depth Mesh Privacy Sampler</h1>
        <p class="subtitle">Raw camera pixels を読む前に、Depth Sensing の点距離と Mesh Detection の粗い面だけで AR 判定が足りるかを比較する最小サンプルです。</p>
      </div>
      <div class="status">
        <b>Route</b>
        <span id="route">Depth + Mesh</span>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <canvas id="stage" width="980" height="660"></canvas>
        <div class="hud">
          <div class="metric"><b>Privacy risk</b><span id="risk">0%</span></div>
          <div class="metric"><b>Utility</b><span id="utility">0%</span></div>
          <div class="metric"><b>Depth samples</b><span id="depthCount">0</span></div>
          <div class="metric"><b>Mesh LOD</b><span id="lod">coarse</span></div>
        </div>
      </div>

      <aside class="side">
        <div class="controls">
          <div class="group">
            <label>Environment source</label>
            <div class="seg" id="sourceButtons">
              <button type="button" data-source="depth" aria-pressed="false">Depth</button>
              <button type="button" data-source="mesh" aria-pressed="false">Mesh</button>
              <button type="button" data-source="hybrid" aria-pressed="true">Hybrid</button>
            </div>
          </div>
          <div class="group">
            <label>Depth sample density <input id="sampleDensity" type="range" min="3" max="15" value="9"></label>
            <label>Mesh quantization <input id="quant" type="range" min="0" max="100" value="54"></label>
            <label>Raw camera pressure <input id="rawPressure" type="range" min="0" max="100" value="18"></label>
            <label>Scene motion <input id="motion" type="range" min="0" max="100" value="36"></label>
            <label>Surface complexity <input id="complexity" type="range" min="0" max="100" value="62"></label>
          </div>
          <div class="group">
            <div class="seg">
              <button type="button" id="scenarioRoom">Room</button>
              <button type="button" id="scenarioStore">Store</button>
              <button type="button" id="scenarioPrivate">Private</button>
            </div>
            <button type="button" id="rescan">Rescan Meshes</button>
          </div>
        </div>

        <div class="readouts">
          <div class="row"><span>Point probe</span><strong id="probe">0.00, 0.00</strong></div>
          <div class="row"><span>Nearest depth</span><strong id="nearest">0.00m</strong></div>
          <div class="row"><span>Mesh surfaces</span><strong id="meshes">0 tracked</strong></div>
          <div class="row"><span>Semantic labels</span><strong id="labels">limited</strong></div>
          <div class="row"><span>Decision</span><strong id="decision">sample</strong></div>
          <ul class="log" id="log"></ul>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const ui = {
      route: document.getElementById("route"),
      risk: document.getElementById("risk"),
      utility: document.getElementById("utility"),
      depthCount: document.getElementById("depthCount"),
      lod: document.getElementById("lod"),
      density: document.getElementById("sampleDensity"),
      quant: document.getElementById("quant"),
      raw: document.getElementById("rawPressure"),
      motion: document.getElementById("motion"),
      complexity: document.getElementById("complexity"),
      probe: document.getElementById("probe"),
      nearest: document.getElementById("nearest"),
      meshes: document.getElementById("meshes"),
      labels: document.getElementById("labels"),
      decision: document.getElementById("decision"),
      log: document.getElementById("log")
    };

    const state = {
      source: "hybrid",
      probe: { x: 0.54, y: 0.46 },
      t: 0,
      seed: 3,
      pointerDown: false,
      logs: []
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function rand(seed) {
      const value = Math.sin(seed * 127.1 + state.seed * 311.7) * 43758.5453;
      return value - Math.floor(value);
    }

    function addLog(text) {
      state.logs.unshift(`${new Date().toLocaleTimeString("ja-JP", { hour12: false })} ${text}`);
      state.logs = state.logs.slice(0, 6);
      ui.log.innerHTML = state.logs.map((entry) => `<li>${entry}</li>`).join("");
    }

    function depthAt(x, y) {
      const wave = Math.sin((x * 7.2 + state.t * 0.9)) * 0.22 + Math.cos((y * 6.4 - state.t * 0.7)) * 0.18;
      const wall = 1.1 + y * 2.2 + wave;
      const object = Math.hypot(x - 0.64, y - 0.42) < 0.13 ? -0.52 : 0;
      const desk = y > 0.67 && x > 0.12 && x < 0.88 ? -0.34 : 0;
      return clamp(wall + object + desk, 0.55, 4.2);
    }

    function meshPolys() {
      const c = Number(ui.complexity.value) / 100;
      const q = Number(ui.quant.value) / 100;
      const detail = Math.round(3 + c * 7 - q * 4);
      const polys = [
        { label: "wall", color: "#5ee9ff", z: 2.75, pts: [[0.08, 0.18], [0.92, 0.14], [0.86, 0.58], [0.18, 0.63]] },
        { label: "table", color: "#ffd36d", z: 1.24, pts: [[0.18, 0.66], [0.88, 0.61], [0.98, 0.82], [0.08, 0.88]] },
        { label: "object", color: "#8dffb6", z: 0.92, pts: [[0.55, 0.34], [0.73, 0.36], [0.78, 0.53], [0.59, 0.58], [0.50, 0.47]] }
      ];
      if (detail > 6) {
        polys.push({ label: "thin-detail", color: "#ff6b7d", z: 1.6, pts: [[0.36, 0.25], [0.42, 0.24], [0.44, 0.56], [0.37, 0.57]] });
      }
      return polys.map((poly, i) => {
        const pts = poly.pts.map(([x, y], j) => {
          const snap = 0.02 + q * 0.1;
          const nx = Math.round((x + (rand(i * 17 + j) - 0.5) * 0.018 * c) / snap) * snap;
          const ny = Math.round((y + (rand(i * 19 + j) - 0.5) * 0.018 * c) / snap) * snap;
          return [clamp(nx, 0.02, 0.98), clamp(ny, 0.02, 0.98)];
        });
        return { ...poly, pts };
      });
    }

    function drawGrid() {
      ctx.fillStyle = "#061014";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.globalAlpha = 0.9;
      for (let y = 0; y < canvas.height; y += 34) {
        ctx.strokeStyle = y % 68 === 0 ? "rgba(94,233,255,0.15)" : "rgba(94,233,255,0.07)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 34) {
        ctx.strokeStyle = x % 68 === 0 ? "rgba(94,233,255,0.15)" : "rgba(94,233,255,0.07)";
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      ctx.restore();

      const horizon = canvas.height * 0.46;
      const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grd.addColorStop(0, "rgba(94,233,255,0.11)");
      grd.addColorStop(0.46, "rgba(255,211,109,0.05)");
      grd.addColorStop(1, "rgba(141,255,182,0.10)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(255,211,109,0.4)";
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      ctx.lineTo(canvas.width, horizon + Math.sin(state.t) * 8);
      ctx.stroke();
    }

    function drawDepthSamples(density) {
      const samples = [];
      for (let y = 1; y <= density; y += 1) {
        for (let x = 1; x <= density; x += 1) {
          const nx = x / (density + 1);
          const ny = y / (density + 1);
          const depth = depthAt(nx, ny);
          samples.push({ x: nx, y: ny, depth });
          const px = nx * canvas.width;
          const py = ny * canvas.height;
          const near = clamp(1 - (depth - 0.55) / 3.65, 0, 1);
          ctx.fillStyle = `rgba(${Math.round(255 * near + 94 * (1 - near))}, ${Math.round(107 * near + 233 * (1 - near))}, ${Math.round(125 * near + 255 * (1 - near))}, 0.82)`;
          ctx.beginPath();
          ctx.arc(px, py, 2.6 + near * 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return samples;
    }

    function drawMeshes(polys, source) {
      if (source === "depth") return;
      polys.forEach((poly) => {
        ctx.save();
        ctx.globalAlpha = source === "mesh" ? 0.82 : 0.58;
        ctx.fillStyle = `${poly.color}24`;
        ctx.strokeStyle = poly.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        poly.pts.forEach(([x, y], index) => {
          const px = x * canvas.width;
          const py = y * canvas.height;
          if (index === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        const [lx, ly] = poly.pts[0];
        ctx.fillStyle = poly.color;
        ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.fillText(poly.label, lx * canvas.width + 8, ly * canvas.height + 18);
        ctx.restore();
      });
    }

    function drawRawPressure(raw) {
      if (raw < 8) return;
      const width = 80 + raw * 4.4;
      const x = canvas.width / 2 - width / 2;
      ctx.save();
      ctx.globalAlpha = 0.18 + raw / 210;
      ctx.fillStyle = "#ff6b7d";
      ctx.strokeStyle = "rgba(255,107,125,0.85)";
      ctx.lineWidth = 2;
      ctx.fillRect(x, 70, width, canvas.height - 168);
      ctx.strokeRect(x, 70, width, canvas.height - 168);
      ctx.fillStyle = "#ffb0bb";
      ctx.font = "13px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText("raw camera pressure", x + 12, 94);
      ctx.restore();
    }

    function drawProbe(samples) {
      const px = state.probe.x * canvas.width;
      const py = state.probe.y * canvas.height;
      let nearest = Infinity;
      samples.forEach((sample) => {
        const d = Math.hypot(sample.x - state.probe.x, sample.y - state.probe.y);
        if (d < nearest) nearest = sample.depth;
      });

      ctx.save();
      ctx.strokeStyle = "rgba(141,255,182,0.9)";
      ctx.fillStyle = "rgba(141,255,182,0.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px - 58, py);
      ctx.lineTo(px + 58, py);
      ctx.moveTo(px, py - 58);
      ctx.lineTo(px, py + 58);
      ctx.stroke();
      ctx.fillStyle = "#e9fbff";
      ctx.font = "13px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(`${nearest.toFixed(2)}m`, px + 14, py - 14);
      ctx.restore();
      return nearest;
    }

    function updateButtons() {
      document.querySelectorAll("[data-source]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.source === state.source));
      });
    }

    function routeMetrics(samples, polys) {
      const density = Number(ui.density.value);
      const q = Number(ui.quant.value);
      const raw = Number(ui.raw.value);
      const motion = Number(ui.motion.value);
      const sourceWeight = state.source === "hybrid" ? 0.42 : state.source === "mesh" ? 0.3 : 0.18;
      const exposedGeometry = state.source === "depth" ? samples.length * 0.08 : polys.reduce((sum, p) => sum + p.pts.length, 0) * 0.7;
      const risk = clamp(raw * 0.72 + exposedGeometry * sourceWeight + motion * 0.12 - q * 0.2, 0, 100);
      const utility = clamp((density - 2) * 4.4 + (100 - q) * 0.26 + (state.source === "hybrid" ? 21 : 10) - motion * 0.11 - raw * 0.08, 0, 100);
      const route = raw > 62 && utility < 54 ? "Ask camera only after consent" : utility > 68 && risk < 52 ? "Depth + Mesh" : risk > 70 ? "Quantize or fallback" : state.source === "depth" ? "Depth sampler" : "Mesh sampler";
      return { risk, utility, route };
    }

    function render() {
      state.t += 0.016 + Number(ui.motion.value) / 8200;
      updateButtons();
      drawGrid();
      const raw = Number(ui.raw.value);
      drawRawPressure(raw);
      const polys = meshPolys();
      drawMeshes(polys, state.source);
      const samples = state.source === "mesh" ? [] : drawDepthSamples(Number(ui.density.value));
      const nearest = samples.length ? drawProbe(samples) : depthAt(state.probe.x, state.probe.y);
      if (!samples.length) drawProbe([{ x: state.probe.x, y: state.probe.y, depth: nearest }]);
      const metrics = routeMetrics(samples.length ? samples : [{ depth: nearest }], polys);
      const lod = Number(ui.quant.value) > 70 ? "very coarse" : Number(ui.quant.value) > 38 ? "coarse" : "detailed";
      const labels = Number(ui.raw.value) > 50 ? "redacted" : Number(ui.quant.value) > 72 ? "none" : "limited";
      const decision = metrics.risk > 70 ? "hold raw pixels" : metrics.utility > 68 ? "place object" : "sample again";

      ui.route.textContent = metrics.route;
      ui.risk.textContent = `${Math.round(metrics.risk)}%`;
      ui.utility.textContent = `${Math.round(metrics.utility)}%`;
      ui.depthCount.textContent = state.source === "mesh" ? "0" : String(samples.length);
      ui.lod.textContent = lod;
      ui.probe.textContent = `${state.probe.x.toFixed(2)}, ${state.probe.y.toFixed(2)}`;
      ui.nearest.textContent = `${nearest.toFixed(2)}m`;
      ui.meshes.textContent = `${state.source === "depth" ? 0 : polys.length} tracked`;
      ui.labels.textContent = labels;
      ui.decision.textContent = decision;

      requestAnimationFrame(render);
    }

    function setProbeFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      state.probe.x = clamp((event.clientX - rect.left) / rect.width, 0.02, 0.98);
      state.probe.y = clamp((event.clientY - rect.top) / rect.height, 0.02, 0.98);
    }

    document.getElementById("sourceButtons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-source]");
      if (!button) return;
      state.source = button.dataset.source;
      addLog(`source -> ${state.source}`);
    });

    canvas.addEventListener("pointerdown", (event) => {
      state.pointerDown = true;
      canvas.setPointerCapture(event.pointerId);
      setProbeFromEvent(event);
      addLog("probe moved");
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!state.pointerDown) return;
      setProbeFromEvent(event);
    });
    canvas.addEventListener("pointerup", () => {
      state.pointerDown = false;
    });
    canvas.addEventListener("pointercancel", () => {
      state.pointerDown = false;
    });

    document.getElementById("scenarioRoom").addEventListener("click", () => {
      ui.density.value = 9;
      ui.quant.value = 54;
      ui.raw.value = 18;
      ui.motion.value = 36;
      ui.complexity.value = 62;
      state.source = "hybrid";
      addLog("scenario: room");
    });
    document.getElementById("scenarioStore").addEventListener("click", () => {
      ui.density.value = 12;
      ui.quant.value = 44;
      ui.raw.value = 32;
      ui.motion.value = 54;
      ui.complexity.value = 78;
      state.source = "hybrid";
      addLog("scenario: store");
    });
    document.getElementById("scenarioPrivate").addEventListener("click", () => {
      ui.density.value = 6;
      ui.quant.value = 84;
      ui.raw.value = 8;
      ui.motion.value = 22;
      ui.complexity.value = 42;
      state.source = "depth";
      addLog("scenario: private");
    });
    document.getElementById("rescan").addEventListener("click", () => {
      state.seed += 1;
      addLog("detectedMeshes refreshed");
    });

    addLog("XRFrame detectedMeshes + depth probe simulated");
    render();
  </script>
</body>
</html>
