<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Locked Layer Readability Budget</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b0f;
      --panel: rgba(12, 16, 20, 0.92);
      --soft: rgba(255, 255, 255, 0.065);
      --line: rgba(231, 238, 230, 0.18);
      --text: #f5f7ed;
      --muted: #aab2a7;
      --aqua: #77e5d3;
      --lime: #b8e972;
      --gold: #f3c45d;
      --red: #ff7d74;
      --blue: #8db8ff;
      --ink: #07100f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(145deg, #080b0f 0%, #141717 48%, #1a130d 100%);
    }

    main {
      width: min(1240px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.6vw, 2.35rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 900px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.55;
    }

    .badge,
    .stage,
    .panel,
    .log {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    }

    .badge {
      min-width: 260px;
      padding: 12px 14px;
    }

    .badge b {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      color: var(--aqua);
      font-size: 1.06rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.28fr) minmax(340px, 0.72fr);
      gap: 14px;
    }

    .stage {
      position: relative;
      min-height: 656px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 656px;
      background: #07100f;
      cursor: crosshair;
      touch-action: none;
    }

    .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      pointer-events: none;
    }

    .readout {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(245, 247, 237, 0.14);
      border-radius: 8px;
      background: rgba(3, 8, 9, 0.78);
    }

    .readout small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .readout strong {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
      font-size: clamp(0.86rem, 1.45vw, 1.06rem);
      line-height: 1.18;
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .panel,
    .log {
      padding: 14px;
    }

    .panel h2,
    .log h2 {
      margin: 0 0 12px;
      color: var(--aqua);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 11px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    select,
    input,
    button {
      width: 100%;
      border: 1px solid rgba(245, 247, 237, 0.15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
    }

    select,
    input { padding: 10px; }

    button {
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.primary {
      color: var(--ink);
      border-color: transparent;
      background: var(--aqua);
      font-weight: 760;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .meter {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .meter span {
      display: block;
      height: 100%;
      width: 50%;
      border-radius: inherit;
      background: var(--lime);
      transition: width 160ms ease, background 160ms ease;
    }

    .status-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .status {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-height: 35px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      font-size: 0.84rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.ok { background: var(--lime); }
    .dot.warn { background: var(--gold); }
    .dot.bad { background: var(--red); }

    pre {
      max-height: 270px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      color: #dce8df;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 920px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .badge { min-width: 0; }
      .stage { min-height: 540px; }
      canvas { height: 540px; }
      .hud { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>World Locked Layer Readability Budget</h1>
        <p class="subtitle">WebXR Layers API の quad / cylinder layer を想定し、世界固定パネルの距離、角度、解像度、更新頻度から「読める UI として維持できるか」を判定する自作ミニ試作です。</p>
      </div>
      <div class="badge">
        <b>Active route</b>
        <strong id="routeBadge">XRQuadLayer</strong>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <canvas id="stage" width="920" height="656" aria-label="world locked layer readability simulator"></canvas>
        <div class="hud">
          <div class="readout"><small>Readability</small><strong id="scoreText">--</strong></div>
          <div class="readout"><small>Layer choice</small><strong id="layerText">--</strong></div>
          <div class="readout"><small>Render budget</small><strong id="budgetText">--</strong></div>
          <div class="readout"><small>Next action</small><strong id="actionText">--</strong></div>
        </div>
      </div>

      <aside class="side">
        <section class="panel">
          <h2>Controls</h2>
          <div class="control">
            <label for="device">Device profile <span id="deviceValue"></span></label>
            <select id="device">
              <option value="layers">Immersive headset, layers optional</option>
              <option value="projection">Immersive headset, projection only</option>
              <option value="inline">Inline preview</option>
            </select>
          </div>
          <div class="control">
            <label for="shape">Panel shape <span id="shapeValue"></span></label>
            <select id="shape">
              <option value="quad">Flat quad panel</option>
              <option value="cylinder">Curved cylinder panel</option>
              <option value="projection">Projection texture panel</option>
            </select>
          </div>
          <div class="control">
            <label for="distance">Distance <span id="distanceValue"></span></label>
            <input id="distance" type="range" min="0.8" max="5.6" step="0.1" value="2.2">
          </div>
          <div class="control">
            <label for="yaw">Off-axis yaw <span id="yawValue"></span></label>
            <input id="yaw" type="range" min="0" max="68" step="1" value="18">
          </div>
          <div class="control">
            <label for="scale">Framebuffer scale <span id="scaleValue"></span></label>
            <input id="scale" type="range" min="0.5" max="1.6" step="0.05" value="1">
          </div>
          <div class="control">
            <label for="motion">Head jitter <span id="motionValue"></span></label>
            <input id="motion" type="range" min="0" max="1" step="0.05" value="0.25">
          </div>
          <div class="button-grid">
            <button class="primary" id="snapGood">Readable preset</button>
            <button id="snapBad">Stress preset</button>
          </div>
        </section>

        <section class="panel">
          <h2>Readability budget</h2>
          <div class="meter"><span id="meterBar"></span></div>
          <div class="status-list" id="statusList"></div>
        </section>

        <section class="log">
          <h2>Session payload</h2>
          <pre id="payload"></pre>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const els = {
      device: document.getElementById("device"),
      shape: document.getElementById("shape"),
      distance: document.getElementById("distance"),
      yaw: document.getElementById("yaw"),
      scale: document.getElementById("scale"),
      motion: document.getElementById("motion"),
      deviceValue: document.getElementById("deviceValue"),
      shapeValue: document.getElementById("shapeValue"),
      distanceValue: document.getElementById("distanceValue"),
      yawValue: document.getElementById("yawValue"),
      scaleValue: document.getElementById("scaleValue"),
      motionValue: document.getElementById("motionValue"),
      scoreText: document.getElementById("scoreText"),
      layerText: document.getElementById("layerText"),
      budgetText: document.getElementById("budgetText"),
      actionText: document.getElementById("actionText"),
      routeBadge: document.getElementById("routeBadge"),
      meterBar: document.getElementById("meterBar"),
      statusList: document.getElementById("statusList"),
      payload: document.getElementById("payload"),
      snapGood: document.getElementById("snapGood"),
      snapBad: document.getElementById("snapBad")
    };

    const state = {
      device: "layers",
      shape: "quad",
      distance: 2.2,
      yaw: 18,
      scale: 1,
      motion: 0.25,
      tick: 0
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function compute() {
      const layersAvailable = state.device === "layers";
      const inline = state.device === "inline";
      const requested = state.shape;
      let layer = requested;
      if (!layersAvailable && requested !== "projection") layer = "projection";
      if (inline) layer = "inline canvas";

      const idealDistance = layer === "cylinder" ? 2.8 : 2.1;
      const distancePenalty = Math.abs(state.distance - idealDistance) * 10.5;
      const yawPenalty = state.yaw * (layer === "cylinder" ? 0.34 : 0.58);
      const scaleGain = (state.scale - 0.85) * 30;
      const motionPenalty = state.motion * (layer === "projection" ? 24 : 12);
      const layerGain = layer === "projection" ? -11 : layer === "cylinder" ? 8 : 5;
      const score = clamp(82 - distancePenalty - yawPenalty - motionPenalty + scaleGain + layerGain, 0, 100);
      const redrawHz = layer === "projection" ? 90 : state.motion > 0.55 ? 45 : 20;
      const pixelDensity = Math.round((state.scale * 1000) / state.distance);
      const verdict = score >= 74 ? "ok" : score >= 52 ? "warn" : "bad";
      const action = verdict === "ok" ? "Keep layer locked" : verdict === "warn" ? "Face user or raise scale" : "Move closer / use layer";

      return { layersAvailable, layer, score, redrawHz, pixelDensity, verdict, action };
    }

    function draw(result) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const grd = ctx.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, "#07100f");
      grd.addColorStop(0.52, "#131818");
      grd.addColorStop(1, "#1a130d");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(245,247,237,0.08)";
      ctx.lineWidth = 1;
      for (let x = 40; x < w; x += 42) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 36; y < h; y += 42) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      const origin = { x: w * 0.5, y: h * 0.72 };
      const pxPerMeter = 78;
      const panelY = origin.y - state.distance * pxPerMeter;
      const panelWidth = 230 * clamp(2.3 / state.distance, 0.62, 1.42);
      const panelHeight = 118 * clamp(2.3 / state.distance, 0.62, 1.42);
      const yaw = state.yaw * Math.PI / 180;
      const skew = Math.sin(yaw) * 52;
      const wobble = Math.sin(state.tick / 16) * state.motion * 12;

      ctx.save();
      ctx.translate(origin.x + wobble, panelY);
      ctx.fillStyle = "rgba(141,184,255,0.08)";
      ctx.strokeStyle = "rgba(141,184,255,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-panelWidth / 2 + skew, -panelHeight / 2);
      ctx.lineTo(panelWidth / 2 + skew, -panelHeight / 2);
      ctx.lineTo(panelWidth / 2 - skew, panelHeight / 2);
      ctx.lineTo(-panelWidth / 2 - skew, panelHeight / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (state.shape === "cylinder") {
        ctx.strokeStyle = "rgba(119,229,211,0.55)";
        for (let i = -2; i <= 2; i += 1) {
          ctx.beginPath();
          ctx.ellipse(i * panelWidth / 7, 0, panelWidth / 8, panelHeight / 2, 0, -1.25, 1.25);
          ctx.stroke();
        }
      }

      ctx.fillStyle = result.score > 72 ? "#b8e972" : result.score > 50 ? "#f3c45d" : "#ff7d74";
      ctx.font = "700 18px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(result.layer, 0, -14);
      ctx.font = "13px Inter, sans-serif";
      ctx.fillStyle = "#f5f7ed";
      ctx.fillText(`${Math.round(result.score)} readability / ${result.pixelDensity} px per meter`, 0, 12);
      ctx.restore();

      ctx.fillStyle = "rgba(245,247,237,0.9)";
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#07100f";
      ctx.font = "700 12px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("HMD", origin.x, origin.y + 4);

      ctx.strokeStyle = "rgba(119,229,211,0.5)";
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y - 22);
      ctx.lineTo(origin.x + wobble, panelY + panelHeight / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(245,247,237,0.72)";
      ctx.font = "13px Inter, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("World space preview: distance, yaw, scale, and motion pressure", 24, 32);
    }

    function statusRows(result) {
      const rows = [
        ["layers feature", result.layersAvailable ? "ok" : "warn", result.layersAvailable ? "optional feature granted" : "fall back to projection"],
        ["view angle", state.yaw <= 28 ? "ok" : state.yaw <= 48 ? "warn" : "bad", `${state.yaw} deg off-axis`],
        ["pixel density", result.pixelDensity >= 420 ? "ok" : result.pixelDensity >= 280 ? "warn" : "bad", `${result.pixelDensity} px/m`],
        ["redraw cadence", result.redrawHz <= 30 ? "ok" : result.redrawHz <= 60 ? "warn" : "bad", `${result.redrawHz} Hz estimated`]
      ];
      els.statusList.innerHTML = rows.map(([name, tone, value]) => `
        <div class="status">
          <span class="dot ${tone}"></span>
          <span>${name}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function render() {
      const result = compute();
      draw(result);
      els.routeBadge.textContent = result.layer;
      els.scoreText.textContent = `${Math.round(result.score)} / 100`;
      els.layerText.textContent = result.layer;
      els.budgetText.textContent = `${result.redrawHz} Hz / ${result.pixelDensity} pxm`;
      els.actionText.textContent = result.action;
      els.meterBar.style.width = `${result.score}%`;
      els.meterBar.style.background = result.verdict === "ok" ? "var(--lime)" : result.verdict === "warn" ? "var(--gold)" : "var(--red)";
      els.deviceValue.textContent = els.device.options[els.device.selectedIndex].textContent;
      els.shapeValue.textContent = els.shape.options[els.shape.selectedIndex].textContent;
      els.distanceValue.textContent = `${state.distance.toFixed(1)} m`;
      els.yawValue.textContent = `${state.yaw} deg`;
      els.scaleValue.textContent = `${state.scale.toFixed(2)}x`;
      els.motionValue.textContent = `${Math.round(state.motion * 100)}%`;
      statusRows(result);
      els.payload.textContent = JSON.stringify({
        date: "2026-08-23",
        requestedFeatures: state.device === "layers" ? ["layers", "local-floor"] : ["local-floor"],
        requestedPanel: state.shape,
        resolvedLayer: result.layer,
        readabilityScore: Math.round(result.score),
        verdict: result.verdict,
        nextAction: result.action,
        telemetry: {
          distanceMeters: state.distance,
          offAxisYawDegrees: state.yaw,
          framebufferScaleFactor: state.scale,
          headJitter: state.motion,
          redrawHz: result.redrawHz,
          pixelDensityPerMeter: result.pixelDensity
        }
      }, null, 2);
    }

    function animate() {
      state.tick += 1;
      render();
      requestAnimationFrame(animate);
    }

    for (const key of ["device", "shape", "distance", "yaw", "scale", "motion"]) {
      els[key].addEventListener("input", () => {
        const value = els[key].value;
        state[key] = ["distance", "yaw", "scale", "motion"].includes(key) ? Number(value) : value;
      });
    }

    els.snapGood.addEventListener("click", () => {
      Object.assign(state, { device: "layers", shape: "quad", distance: 2.1, yaw: 14, scale: 1.1, motion: 0.12 });
      syncControls();
    });

    els.snapBad.addEventListener("click", () => {
      Object.assign(state, { device: "projection", shape: "quad", distance: 4.8, yaw: 58, scale: 0.65, motion: 0.82 });
      syncControls();
    });

    function syncControls() {
      for (const key of ["device", "shape", "distance", "yaw", "scale", "motion"]) {
        els[key].value = state[key];
      }
    }

    syncControls();
    animate();
  </script>
</body>
</html>
