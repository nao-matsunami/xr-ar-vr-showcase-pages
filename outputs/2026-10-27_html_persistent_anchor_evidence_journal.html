<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persistent Anchor Evidence Journal</title>
<style>:root{color-scheme:dark;--bg:#07111d;--panel:#101f33;--line:#294865;--ink:#e8f1ff;--muted:#9eafc9;--cyan:#61e5ed;--amber:#ffc65c;--green:#84efad;--red:#ff849c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1c4163,transparent 38%),var(--bg);font:15px system-ui;color:var(--ink)}main{max-width:1080px;margin:auto;padding:28px 18px 44px}h1{margin:0;font-size:clamp(25px,5vw,43px)}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#101f33dd;border:1px solid var(--line);border-radius:16px;padding:16px}.scene{height:260px;overflow:hidden;position:relative;border-radius:12px;background:linear-gradient(145deg,#123954,#07111d 70%)}.floor{position:absolute;width:160%;height:66%;bottom:-32%;left:-28%;transform:perspective(420px) rotateX(66deg);background:repeating-linear-gradient(90deg,transparent 0 46px,#2c5370 47px),repeating-linear-gradient(0deg,transparent 0 46px,#2c5370 47px)}.pin{position:absolute;left:51%;top:47%;width:31px;height:31px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--amber);box-shadow:0 0 25px #ffc65c99}.pin.tracked{background:var(--green);box-shadow:0 0 30px #84efad99}.pin.hold{animation:pulse .8s infinite}@keyframes pulse{50%{opacity:.3;transform:rotate(-45deg) scale(.7)}}button{font:inherit;color:var(--ink);background:#183c5b;border:1px solid #427098;border-radius:9px;padding:9px 11px;cursor:pointer}button:hover{border-color:var(--cyan)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.state{font-weight:700;color:var(--cyan)}.rows{display:grid;gap:7px;margin-top:12px}.row{border:1px solid #294863;border-radius:9px;padding:9px;font:12px ui-monospace;color:#c9dcf5}.tag{float:right;color:var(--amber)}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.log{min-height:165px;max-height:280px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace;color:#c9dcf5}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style>
<main><h1>Persistent Anchor <span style="color:var(--cyan)">Evidence Journal</span></h1><p>自作の最小試作。persistent handle を「次回も置ける保証」ではなく復元判断の手掛かりとして記録し、restore・tracked 観測・pose の3つがそろうまで再配置しません。</p><div class="grid"><section class="card"><div class="scene"><div class="floor"></div><div id="pin" class="pin"></div></div><div class="controls"><button data-k="create">1. Handle を発行</button><button data-k="restore">2. Restore を要求</button><button data-k="tracked">3. tracked + pose</button><button data-k="gap">pose 一時不明</button><button data-k="miss">restore miss</button></div><p>状態: <span class="state" id="state">未記録</span></p></section><aside class="card"><b>復元の判定規則</b><div class="rows" id="rules"></div><div class="controls"><button id="save">journal を保存</button><button id="export">JSON export</button><button id="probe">API probe</button></div><p id="probeout">対応状況はまだ確認していません。</p></aside></div><section class="card" style="margin-top:16px"><b>Evidence receipt</b><div class="log" id="log"></div></section><script>
const $=s=>document.querySelector(s),rules=[['handle','persistent handle','restore 候補を識別するだけ'],['restore','restore resolved','object を得ても placement は保留'],['tracked','trackedAnchors + pose','ここでだけ復元を commit'],['gap','pose null','既存 visual を hold、retry しない'],['miss','restore miss','marker を残し、re-hit は budget 内だけ']];let phase='',journal=[];function add(k,n){phase=k;journal.push({at:new Date().toISOString(),kind:k,note:n,retryBudget:1});$('#log').textContent=`[${new Date().toLocaleTimeString('ja-JP',{hour12:false})}] ${k}: ${n}\n`+$('#log').textContent;draw()}function draw(){let committed=phase==='tracked',hold=phase==='gap'||phase==='miss';$('#pin').className='pin '+(committed?'tracked':hold?'hold':'');$('#state').textContent=committed?'復元を確定':hold?'既存 marker を hold':'証跡を待機';$('#rules').innerHTML=rules.map(([k,t,d])=>`<div class="row ${k===phase?(k==='tracked'?'good':k==='gap'||k==='miss'?'warn':''):''}">${t}<span class="tag">${k===phase?'NOW':''}</span><small style="display:block;color:#9eafc9;margin-top:3px">${d}</small></div>`).join('')};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='restore'&&!journal.some(x=>x.kind==='create'))return add('guard','先に handle を発行してください');if(k==='tracked'&&!journal.some(x=>x.kind==='restore'))return add('guard','restore receipt が必要です');let msg={create:'合成 UUID を発行。実機では requestPersistentHandle() の解決値を保存',restore:'restorePersistentAnchor(handle) が object を解決。まだ commit しない',tracked:'frame.trackedAnchors と getPose(anchorSpace) を確認',gap:'getPose() が null。今回の frame は新配置の根拠にしない',miss:'restore は失敗。既存 marker を残し retry budget=1 を表示'}[k];add(k,msg)});$('#save').onclick=()=>{localStorage.setItem('xr-persistent-anchor-journal',JSON.stringify({savedAt:new Date().toISOString(),journal}));add('saved','localStorage に保存')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({journal},null,2)],{type:'application/json'}));a.download='persistent-anchor-journal.json';a.click();URL.revokeObjectURL(a.href);add('export','JSON download を作成')};$('#probe').onclick=async()=>{let xr=!!navigator.xr,ar=xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);$('#probeout').textContent=`navigator.xr=${xr}; immersive-ar=${ar}。実際の restore は immersive-ar session 内で実行します。`;add('probe',`navigator.xr=${xr}, immersive-ar=${ar}`)};draw();
</script></main></html>
