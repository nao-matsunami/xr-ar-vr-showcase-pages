<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Probe Confidence Lab</title><style>:root{color-scheme:dark;--b:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#614817,transparent 36%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:1000px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.scene{height:312px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#183346,#090e16 73%)}.room{position:absolute;inset:12% 10%;border:2px solid #9edff455;border-radius:15px;background:repeating-linear-gradient(55deg,#fff1bc08 0 16px,transparent 17px 33px)}.orb{position:absolute;width:106px;height:106px;border-radius:50%;left:calc(50% - 53px);top:33%;border:2px solid var(--g);background:radial-gradient(circle at 35% 28%,#fff 0 4%,var(--g) 22%,#397f7a 57%,#102833 100%);box-shadow:0 0 58px #92f3bd77;transition:.4s}.ray{position:absolute;left:50%;top:8%;width:3px;height:48%;transform-origin:bottom;background:linear-gradient(transparent,#ffe39b);filter:drop-shadow(0 0 8px #ffd579);transition:.4s}.ray:after{content:"";position:absolute;bottom:-3px;left:-7px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:13px solid #ffe39b}.tag{position:absolute;left:12px;bottom:11px;padding:6px 8px;border:1px solid var(--l);border-radius:8px;font:12px ui-monospace;background:#07111cbb}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.meter{height:12px;margin-top:7px;border-radius:999px;border:1px solid var(--l);background:#061018;overflow:hidden}.meter i{display:block;height:100%;width:68%;background:var(--g);transition:.35s}pre{min-height:128px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Light Probe <span style="color:var(--c)">Confidence Lab</span></h1><p>自作の最小試作。光推定を「正しい照明」と決めつけず、primary light の方向・強度・推定の年齢を分離した receipt として扱い、鮮度に応じて反射と影の表現を落とします。</p><div class="grid"><section class="card"><div class="scene"><div class="room"></div><div id="ray" class="ray"></div><div id="orb" class="orb"></div><div id="tag" class="tag">awaiting light estimate</div></div><div class="buttons"><button data-mode="fresh">fresh probe</button><button data-mode="aging">aging probe</button><button data-mode="missing">no estimate</button><button id="probe">WebXR probe</button></div><p id="meaning">light estimate receipt を選択してください。</p></section><aside class="card"><b>light estimate contract</b><div class="row">estimate age: <span id="age">—</span> ms<div class="meter"><i id="bar"></i></div></div><div class="row">render policy: <span id="policy">awaiting</span></div><div class="row">primary light: <span id="light">—</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let mode='none',log=[];const cfg={fresh:[22,'live diffuse + soft shadow','good','(-0.42, -0.81, 0.40) · 1.18','新しい推定値です。拡散光と控えめな影を更新し、反射の強さは過度に上げません。'],aging:[148,'hold reflection / fade shadow','warn','(-0.42, -0.81, 0.40) · 1.18','推定は古くなっています。反射キューブマップを更新せず、影だけをゆっくり弱めます。'],missing:[null,'neutral material fallback','bad','unavailable','推定値がありません。中立の素材と既定ライトへ縮退し、現実光への一致を主張しません。']};function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let c=cfg[mode];if(!c){$('#age').textContent='—';$('#policy').textContent='awaiting';$('#light').textContent='—';return}let[a,p,k,l,t]=c;$('#age').textContent=a??'—';let x=$('#policy');x.textContent=p;x.className=k;$('#light').textContent=l;$('#meaning').textContent=t;$('#bar').style.width=a?Math.max(8,100-a/2)+'%':'5%';$('#bar').style.background=k==='good'?'var(--g)':k==='warn'?'var(--a)':'var(--r)';$('#ray').style.transform='rotate('+(mode==='fresh'?-24:mode==='aging'?-24:0)+'deg)';$('#ray').style.opacity=mode==='missing'?'.08':mode==='aging'?'.45':'1';$('#orb').style.filter=mode==='missing'?'saturate(.15) brightness(.65)':mode==='aging'?'saturate(.7) brightness(.85)':'none';$('#tag').textContent='estimate '+(a??'missing')+'ms → '+p}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;note('light receipt → '+cfg[mode][1]);draw()});$('#probe').onclick=async()=>{let out='WebXR unavailable';try{out=navigator.xr?'immersive-ar: '+await navigator.xr.isSessionSupported('immersive-ar'):'WebXR unavailable'}catch(e){out='probe error: '+e.name}note(out)};$('#copy').onclick=async()=>{let c=cfg[mode]||[];let r={estimateAgeMs:c[0]??null,policy:c[1]||'awaiting',primaryLight:c[3]||null};try{await navigator.clipboard.writeText(JSON.stringify(r,null,2));note('receipt copied')}catch{note(JSON.stringify(r))}};$('#reset').onclick=()=>{mode='none';log=[];note('ready: choose a light receipt');draw()};$('#reset').click()</script></html>
