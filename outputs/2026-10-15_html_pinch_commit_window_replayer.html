<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinch Commit Window Replayer</title><style>
:root{color-scheme:dark;--b:#101619;--p:#1b282b;--l:#748d90;--t:#f4f1e8;--m:#c5d1d1;--c:#83d9d1;--g:#a9e39a;--y:#f0cc73;--r:#ef837e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 8%,#393262,transparent 35%),var(--b);color:var(--t);font:15px system-ui,sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:25px 0 42px}.head,.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;margin-bottom:14px}.box{background:#1b282be8;border:1px solid var(--l);border-radius:10px;padding:17px;box-shadow:0 15px 35px #0005}h1{font-size:clamp(30px,5vw,50px);line-height:1;margin:0 0 12px}h2{font-size:18px;margin:0 0 11px}p{color:var(--m);line-height:1.65;margin:0}.metrics,.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric,.frame,.row{border:1px solid var(--l);border-radius:8px;background:#07101280;padding:10px}.metric span,.frame small{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.metric b{font-size:17px}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}button,select,input,textarea{min-height:42px;border:1px solid var(--l);border-radius:8px;background:#26383b;color:var(--t);padding:0 11px;font:inherit}button{background:#44376f;border-color:#b9a8ff;cursor:pointer}label{display:grid;gap:4px;color:var(--m);font-size:12px}input[type=range]{padding:0;accent-color:#b9a8ff}textarea{width:100%;min-height:225px;padding:11px;resize:vertical;line-height:1.45}.timeline{grid-template-columns:repeat(8,1fr)}.frame{min-height:138px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:var(--g);color:#07110e;margin-top:6px}.warn{background:var(--y)}.bad{background:var(--r)}.rows{display:grid;gap:8px}.row{color:var(--m);overflow-wrap:anywhere}@media(max-width:850px){.head,.grid,.toolbar,.metrics,.timeline{grid-template-columns:1fr}}
</style></head><body><main><div class="head"><div class="box"><h1>Pinch Commit Window Replayer</h1><p>本命サンプルの intent row を貼り、8 frame の閉じ具合・追跡・安定性を再生して、即時確定ではなく短い commit window が重複発火や手振れをどう抑えるかを見る派生試作です。</p></div><div class="box"><div class="metrics"><div class="metric"><span>policy</span><b id="policyM">balanced</b></div><div class="metric"><span>commit frame</span><b id="commitM">—</b></div><div class="metric"><span>duplicate guard</span><b id="guardM">—</b></div><div class="metric"><span>final route</span><b id="routeM">—</b></div></div></div></div><div class="toolbar"><select id="policy"><option value="balanced">balanced</option><option value="strict">strict</option><option value="quick">quick preview</option></select><select id="pattern"><option value="clean">clean close</option><option value="bounce">bounce / jitter</option><option value="loss">joint loss</option><option value="reserved">system reserved</option></select><label>window frames<input id="window" type="range" min="1" max="5" value="3"></label><button id="seed">Seed row</button><button id="play">Replay</button></div><div class="grid"><section class="box"><h2>Intent row input</h2><textarea id="input" spellcheck="false"></textarea></section><section class="box"><h2>Replay explanation</h2><div id="summary" class="rows"></div></section></div><section class="box"><h2>8 frame commit timeline</h2><div id="timeline" class="timeline"></div></section></main><script>
const seed={date:'2026-10-15',sample:'hand-pinch-intent-gateboard',profile:'steady',tipDistanceMm:12,jointTracking:96,motionStability:91,pinchScore:87,gesture:'regular-pinch',controllerActive:false,confidence:90,intent:'commit',route:'select-event',hold:'none'};const patterns={clean:[[28,82],[19,86],[13,92],[11,94],[10,93],[12,91],[18,88],[30,82]],bounce:[[24,79],[15,70],[27,55],[14,72],[23,60],[12,78],[19,70],[29,66]],loss:[[21,80],[15,74],[13,43],[12,38],[17,56],[15,69],[13,77],[18,80]],reserved:[[12,92],[10,95],[9,96],[8,96],[8,95],[10,93],[13,90],[17,86]]};const $=s=>document.querySelector(s),e={policy:$('#policy'),pattern:$('#pattern'),window:$('#window'),input:$('#input'),timeline:$('#timeline'),summary:$('#summary')};function row(){try{return JSON.parse(e.input.value)}catch{return {...seed,intent:'hold',hold:'invalid-json'}}}function run(){const r=row(),w=+e.window.value,p=patterns[e.pattern.value],strict=e.policy.value==='strict'?1:e.policy.value==='quick'?-1:0;let run=0,committed=false,frames=[];p.forEach(([d,st],i)=>{const regular=r.gesture==='regular-pinch'&&!r.controllerActive&&e.pattern.value!=='reserved';const closed=d<=18,ok=regular&&closed&&st>=70+strict*8&&r.jointTracking>=55;if(ok)run++;else run=0;let v='preview',why='await close';if(!regular){v='block';why='reserved / controller'}else if(r.jointTracking<55||st<55){v='hold';why='tracking unstable'}else if(!committed&&run>=w+strict){v='commit';why='commit window met';committed=true}else if(committed){v='guard';why='duplicate suppressed'}frames.push({i,d,st,v,why,run})});const cf=frames.find(x=>x.v==='commit');$('#policyM').textContent=e.policy.value;$('#commitM').textContent=cf?'F'+(cf.i+1):'—';$('#guardM').textContent=frames.some(x=>x.v==='guard')?'armed':'not needed';$('#routeM').textContent=cf?'select-event':frames.some(x=>x.v==='block')?'system-reserved':'reticle-preview';e.timeline.innerHTML=frames.map(f=>`<div class="frame"><b>F${f.i+1}</b><small>${f.d}mm · stable ${f.st}%</small><span class="pill ${f.v==='commit'||f.v==='guard'?'':f.v==='preview'?'warn':'bad'}">${f.v}</span><small>${f.why}<br>window ${f.run}/${w}</small></div>`).join('');e.summary.innerHTML=[`入力 gesture=${r.gesture}, confidence=${r.confidence}%, policy=${e.policy.value}`,cf?`F${cf.i+1} で ${w} frame の連続条件が揃い、1回だけ select candidate を確定。`:'確定条件を満たさないため、手の再取得またはプレビュー表示を維持。','次に足すなら: 実 XRFrame timestamp と selectstart / selectend を保存し、この replay に流す。'].map(x=>`<div class="row">${x}</div>`).join('')}$('#seed').onclick=()=>{e.input.value=JSON.stringify(seed,null,2);run()};$('#play').onclick=run;[e.policy,e.pattern,e.window].forEach(x=>x.oninput=run);e.input.value=JSON.stringify(seed,null,2);run();
</script></body></html>
