<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redraw Budget Route Board</title>
<style>:root{color-scheme:dark;--bg:#07101b;--card:#102033;--line:#2a506c;--ink:#edf6ff;--muted:#a9bdce;--cyan:#67e7ef;--amber:#ffd064;--green:#87efb0;--red:#ff8298}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#254360,transparent 38%),var(--bg);font:15px system-ui;color:var(--ink)}main{max-width:1030px;margin:auto;padding:28px 18px 50px}h1{margin:0;font-size:clamp(26px,5vw,43px)}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#102033df;border:1px solid var(--line);border-radius:16px;padding:16px}.routes{display:grid;gap:10px}.route{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}.route b{display:block}.tag{float:right;font:12px ui-monospace;padding:3px 6px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}.bar{height:8px;border-radius:8px;background:#07101b;margin-top:10px;overflow:hidden}.bar i{height:100%;display:block;width:0;background:var(--cyan);transition:.25s}.route.need{border-color:var(--amber)}.route.need .tag{color:var(--amber);border-color:var(--amber)}.route.done{border-color:var(--green)}.route.done .tag{color:var(--green);border-color:var(--green)}button{font:inherit;color:var(--ink);background:#173b59;border:1px solid #477b9e;border-radius:9px;padding:9px 11px;cursor:pointer;margin:6px 5px 0 0}button:hover{border-color:var(--cyan)}#log{font:12px ui-monospace;white-space:pre-wrap;min-height:220px;color:#cce1f4}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style>
<main><h1>Redraw Budget <span style="color:var(--cyan)">Route Board</span></h1><p>派生の自作試作。HUD、字幕、動画の三つを「更新頻度」ではなく redraw の根拠と予算で仕分けます。毎 frame の一括描画を避ける判断を触って確認できます。</p><div class="grid"><section class="card"><b>layer routes</b><div class="routes" id="routes"></div><button id="tick">通常 frame</button><button id="event">字幕 layer に redraw</button><button id="burst">全 layer に要求</button><button id="commit">許可分を描画</button><button id="reset">リセット</button></section><aside class="card"><b>budget receipt</b><p>1 frame の redraw 予算: <strong id="budget" style="color:var(--cyan)">1</strong> layer</p><p>採用: <span id="selected">なし</span></p><p>見送り: <span id="deferred">なし</span></p><pre id="log"></pre></aside></div></main>
<script>const $=s=>document.querySelector(s);const r=[{n:'HUD quad',cost:1,why:'layout 変更時のみ'},{n:'字幕 quad',cost:1,why:'文字列が変わった時'},{n:'動画 media',cost:2,why:'media compositor に委譲'}];let pending=new Set(),v=0,log=[];function note(x){log.unshift(`[${new Date().toISOString().slice(11,19)}] ${x}`);$('#log').textContent=log.join('\n')}function draw(){const allowed=[...pending].sort((a,b)=>r[a].cost-r[b].cost).filter((x,i,a)=>a.slice(0,i).reduce((s,y)=>s+r[y].cost,0)+r[x].cost<=1);const defer=[...pending].filter(x=>!allowed.includes(x));$('#routes').innerHTML=r.map((x,i)=>`<div class="route ${pending.has(i)?'need':''} ${!pending.has(i)&&v?'done':''}"><span class="tag">${pending.has(i)?'REDRAW':v?'CURRENT':'IDLE'}</span><b>${x.n}</b><small>${x.why} / cost ${x.cost}</small><div class="bar"><i style="width:${pending.has(i)?'75':'0'}%"></i></div></div>`).join('');$('#selected').textContent=allowed.length?allowed.map(i=>r[i].n).join('、'):'なし';$('#deferred').textContent=defer.length?defer.map(i=>r[i].n).join('、'):'なし'}$('#tick').onclick=()=>{note('通常 frame: pending がなければ全 redraw を skip');draw()};$('#event').onclick=()=>{pending.add(1);note('字幕内容が変化: 字幕 quad の redraw receipt');draw()};$('#burst').onclick=()=>{r.forEach((_,i)=>pending.add(i));note('compositor/resource event: 3 layer が redraw を要求');draw()};$('#commit').onclick=()=>{let used=0,done=[];[...pending].sort((a,b)=>r[a].cost-r[b].cost).forEach(i=>{if(used+r[i].cost<=1){used+=r[i].cost;pending.delete(i);done.push(r[i].n)}});v++;note(done.length?`描画: ${done.join('、')}。残りは次 frame へ`:'予算内の route がない。見送り');draw()};$('#reset').onclick=()=>{pending.clear();v=0;log=[];note('ready: redraw 根拠と予算を分離');draw()};$('#reset').click()</script></html>
