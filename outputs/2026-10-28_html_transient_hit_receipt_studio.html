<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transient Hit Receipt Studio</title>
<style>:root{color-scheme:dark;--bg:#07101b;--card:#102033;--line:#2a506c;--ink:#ebf5ff;--muted:#a8b9ca;--cyan:#64e7ed;--amber:#ffca64;--green:#83edaf;--red:#ff8099}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 13% 0,#204767,transparent 38%),var(--bg);font:15px system-ui;color:var(--ink)}main{max-width:1080px;margin:auto;padding:28px 18px 50px}h1{margin:0;font-size:clamp(26px,5vw,43px)}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:1.16fr .84fr;gap:16px}.card{background:#102033dc;border:1px solid var(--line);border-radius:16px;padding:16px}.stage{height:280px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#163c57,#08111d 75%)}.floor{position:absolute;width:160%;height:72%;bottom:-39%;left:-30%;transform:perspective(440px) rotateX(67deg);background:repeating-linear-gradient(90deg,transparent 0 43px,#2b5874 44px),repeating-linear-gradient(0deg,transparent 0 43px,#2b5874 44px)}.ray{position:absolute;left:50%;top:90%;height:170px;width:2px;background:linear-gradient(var(--cyan),transparent);transform-origin:bottom;transform:rotate(25deg);opacity:.8}.hit{position:absolute;left:65%;top:35%;width:36px;height:36px;border:2px solid var(--amber);border-radius:50%;box-shadow:0 0 26px #ffca6499}.hit:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--amber)}.anchor{position:absolute;left:65.5%;top:44%;width:17px;height:17px;background:var(--green);border-radius:50% 50% 50% 0;transform:rotate(-45deg);opacity:0;box-shadow:0 0 20px var(--green)}.anchor.on{opacity:1}.source{position:absolute;left:39%;bottom:15%;padding:5px 8px;border:1px solid var(--cyan);border-radius:8px;color:var(--cyan);font:12px ui-monospace}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{font:inherit;color:var(--ink);background:#183d5c;border:1px solid #42749c;border-radius:9px;padding:9px 11px;cursor:pointer}button:hover{border-color:var(--cyan)}.state{font-weight:700;color:var(--cyan)}.lane{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:9px;font:12px ui-monospace;color:#cbe0f5}.tag{float:right;color:var(--amber)}.ok{color:var(--green)}.no{color:var(--red)}#log{margin:0;min-height:155px;max-height:270px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace;color:#cbe0f5}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style>
<main><h1>Transient Hit <span style="color:var(--cyan)">Receipt Studio</span></h1><p>自作の最小試作。短命な入力 source ごとの hit 結果を「描画候補」として残し、選択の確定と anchor 化を別 receipt にします。実機 API に依存せず、どのブラウザでも手順を再生できます。</p><div class="grid"><section class="card"><div class="stage"><div class="floor"></div><div class="ray" id="ray"></div><div class="hit" id="hit"></div><div class="anchor" id="anchor"></div><div class="source" id="source">source: —</div></div><div class="buttons"><button data-a="touch">screen tap を到着</button><button data-a="gaze">transient gaze を到着</button><button data-a="hit">frame の hit 結果</button><button data-a="select">select を確定</button><button data-a="anchor">anchor を作成</button></div><p>現在: <span class="state" id="state">入力待ち</span></p></section><aside class="card"><b>placement の receipt</b><div id="lanes"></div><div class="buttons"><button id="reset">リセット</button><button id="export">JSON export</button><button id="probe">API probe</button></div><p id="probeout">対応状況は未確認です。</p></aside></div><section class="card" style="margin-top:16px"><b>frame log</b><pre id="log"></pre></section></main>
<script>
const $=s=>document.querySelector(s);let source='',hit=false,selected=false,anchored=false,log=[];const now=()=>new Date().toLocaleTimeString('ja-JP',{hour12:false});function note(kind,msg){log.unshift({at:new Date().toISOString(),kind,msg,source});$('#log').textContent=log.map(x=>`[${x.at.slice(11,19)}] ${x.kind.padEnd(7)} ${x.msg}`).join('\n');draw()}function draw(){let rows=[['input','transient source',source||'未到着',!!source],['hit','frame hit result',hit?'source ごとに得た':'まだない',hit],['select','intent commit',selected?'同一 source の select':'保留',selected],['anchor','spatial commit',anchored?'anchor 化済み':'作らない',anchored]];$('#lanes').innerHTML=rows.map(([a,b,c,on])=>`<div class="lane ${on?'ok':''}">${b}<span class="tag">${on?'RECEIPT':'WAIT'}</span><small style="display:block;color:#a8b9ca;margin-top:4px">${c}</small></div>`).join('');$('#source').textContent='source: '+(source||'—');$('#state').textContent=anchored?'anchor を確定':selected?'select を確認。anchor は任意':hit?'hit は描画候補':source?'この source の frame を待機':'入力待ち';$('#hit').style.opacity=hit?'1':'.24';$('#anchor').className='anchor '+(anchored?'on':'');$('#ray').style.transform=`rotate(${source==='gaze'?'-14deg':'25deg'})`}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==='touch'||a==='gaze'){source=a;hit=selected=anchored=false;note('input',a==='touch'?'screen / generic-touchscreen の短命 input':'transient-pointer（gaze など）の短命 input')}else if(a==='hit'){if(!source)return note('guard','先に transient input を到着させる');hit=true;note('hit','getHitTestResultsForTransientInput() を source 単位で受領')}else if(a==='select'){if(!hit)return note('guard','hit receipt がないため select を配置に使わない');selected=true;note('select','同じ source の意図を commit。別 source には引き継がない')}else{if(!selected)return note('guard','select の意図がないので anchor を作らない');anchored=true;note('anchor','選択済み hit から anchor を作成（実機では createAnchor()）')}draw()});$('#reset').onclick=()=>{source='';hit=selected=anchored=false;note('reset','新しい interaction として receipt を破棄')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),log},null,2)],{type:'application/json'}));a.download='transient-hit-receipts.json';a.click();URL.revokeObjectURL(a.href);note('export','JSON を作成')};$('#probe').onclick=async()=>{let xr=!!navigator.xr,ar=xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);$('#probeout').textContent=`navigator.xr=${xr}; immersive-ar=${ar}。実機では session.requestHitTestSourceForTransientInput() を feature 交渉後に呼びます。`;note('probe',`navigator.xr=${xr}, immersive-ar=${ar}`)};note('ready','source → hit → select → anchor を順番に確認する');
</script></html>
