<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediction Miss Recovery Replayer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101317;
      --panel: #1b2429;
      --panel2: #26343b;
      --line: #5a6972;
      --text: #f5f1e8;
      --muted: #c5cdc8;
      --cyan: #7bd7e5;
      --green: #9fda86;
      --gold: #ecc46a;
      --red: #ed827f;
      --ink: #0b0f12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(125deg, rgba(159, 218, 134, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(237, 130, 127, 0.10), transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 44px; }
    header { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 36, 41, 0.96);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(11, 15, 18, 0.62); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 20px; overflow-wrap: anywhere; }
    .timeline { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; min-height: 180px; align-items: end; }
    .frame {
      min-height: 80px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(11, 15, 18, 0.62);
      padding: 8px;
      display: grid;
      align-content: end;
      gap: 8px;
    }
    .stem { border-radius: 6px 6px 2px 2px; min-height: 10px; background: var(--cyan); }
    .frame small { color: var(--muted); overflow-wrap: anywhere; }
    .controls { display: grid; grid-template-columns: 1.2fr repeat(3, minmax(0, 0.8fr)); gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    textarea, select, input, button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      min-width: 0;
    }
    textarea { width: 100%; min-height: 210px; padding: 12px; resize: vertical; line-height: 1.45; }
    select, input, button { min-height: 42px; padding: 0 12px; }
    input[type="range"] { padding: 0; accent-color: var(--cyan); }
    button { cursor: pointer; background: var(--cyan); color: var(--ink); font-weight: 800; }
    .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 14px; margin-top: 14px; }
    .rows { display: grid; gap: 8px; }
    .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(11, 15, 18, 0.62); color: var(--muted); }
    @media (max-width: 900px) {
      header, .controls, .metrics, .grid { grid-template-columns: 1fr; }
      .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Prediction Miss Recovery Replayer</h1>
        <p>1本目の予測 mask row を貼り付けると、次に届いた実 mask との差分を合成し、hold、patch、rollback、recover の流れを再生します。予測が外れた時に何フレームで tiled rendering に戻せるかを見る派生試作です。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>final route</span><strong id="routeMetric">-</strong></div>
          <div class="metric"><span>miss</span><strong id="missMetric">0 px</strong></div>
          <div class="metric"><span>recover frame</span><strong id="recoverMetric">-</strong></div>
          <div class="metric"><span>rollback debt</span><strong id="debtMetric">0</strong></div>
        </div>
        <div id="timeline" class="timeline" aria-label="prediction miss recovery timeline"></div>
      </div>
    </header>

    <div class="controls">
      <label>Policy
        <select id="policySelect">
          <option value="balanced">balanced</option>
          <option value="strict">strict</option>
          <option value="forgiving">forgiving</option>
        </select>
      </label>
      <label>Actual mask miss
        <input id="missRange" type="range" min="0" max="90" value="22">
      </label>
      <label>Frames
        <input id="framesRange" type="range" min="4" max="10" value="8">
      </label>
      <label>Recovery gain
        <input id="gainRange" type="range" min="8" max="30" value="17">
      </label>
    </div>

    <div class="grid">
      <section>
        <h2>Input row</h2>
        <textarea id="inputBox" spellcheck="false"></textarea>
        <button id="loadButton" type="button">Replay row</button>
      </section>
      <section>
        <h2>Recovery rows</h2>
        <div id="rows" class="rows"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const seed = {
      type: "predictive-visibility-mask-row",
      date: "2026-10-04",
      viewId: "left-eye",
      maskAgeMs: 31,
      predictionLeadMs: 34,
      poseVelocityDeg: 15,
      accelerationDeg: 7,
      predictedShiftPx: 37,
      uncertaintyPx: 22,
      guardBandPx: 39,
      confidence: 0.641,
      tileSavings: 0.698,
      route: "submit-predicted-mask"
    };

    $("inputBox").value = JSON.stringify(seed, null, 2);

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function parseRow() {
      try {
        return JSON.parse($("inputBox").value);
      } catch {
        return seed;
      }
    }

    function policyFactor(policy) {
      if (policy === "strict") return { miss: 0.76, debt: 0.7, label: "early rollback" };
      if (policy === "forgiving") return { miss: 1.32, debt: 1.25, label: "hold longer" };
      return { miss: 1, debt: 1, label: "balanced patch" };
    }

    function compute() {
      const row = parseRow();
      const policy = $("policySelect").value;
      const factor = policyFactor(policy);
      const frames = Number($("framesRange").value);
      const gain = Number($("gainRange").value);
      const actualMissPx = Number($("missRange").value);
      const baseGuard = Number(row.guardBandPx || 34);
      const confidence = Number(row.confidence || 0.55);
      const rows = [];
      let debt = Math.max(0, actualMissPx - baseGuard * 0.45) * factor.debt + (1 - confidence) * 28;
      let recoverFrame = null;
      for (let frame = 0; frame < frames; frame += 1) {
        const decay = gain * (frame + 1) * (0.62 + confidence * 0.38);
        const miss = clamp(actualMissPx - decay * 0.42, 0, 120);
        const frameDebt = clamp(debt - decay, 0, 120);
        let route = "recover-tiled-rendering";
        if (miss > baseGuard * factor.miss || frameDebt > 34) route = "rollback-full-viewport";
        else if (miss > baseGuard * 0.5 || frameDebt > 16) route = "patch-and-hold";
        else if (frame < 2 && confidence < 0.5) route = "verify-mask-change";
        if (route === "recover-tiled-rendering" && recoverFrame === null) recoverFrame = frame + 1;
        rows.push({
          frame: frame + 1,
          policy,
          viewId: row.viewId || "unknown-view",
          predictedRoute: row.route || "unknown",
          missPx: Math.round(miss),
          rollbackDebt: Math.round(frameDebt),
          route,
          note: factor.label
        });
      }
      const final = rows[rows.length - 1];
      return { rows, final, recoverFrame, actualMissPx, debt: Math.round(debt) };
    }

    function color(route) {
      if (route === "recover-tiled-rendering") return "var(--green)";
      if (route === "patch-and-hold") return "var(--gold)";
      if (route === "verify-mask-change") return "var(--cyan)";
      return "var(--red)";
    }

    function render() {
      const result = compute();
      $("routeMetric").textContent = result.final.route;
      $("missMetric").textContent = `${result.actualMissPx} px`;
      $("recoverMetric").textContent = result.recoverFrame ? `f${result.recoverFrame}` : "none";
      $("debtMetric").textContent = result.debt;
      $("timeline").innerHTML = result.rows.map((row) => `
        <div class="frame">
          <div class="stem" style="height:${Math.max(12, 92 - row.rollbackDebt)}px;background:${color(row.route)}"></div>
          <small>f${row.frame}<br>${row.route}<br>${row.missPx}px</small>
        </div>
      `).join("");
      $("rows").innerHTML = result.rows.map((row) => `
        <div class="row">frame ${row.frame}: ${row.route} / miss ${row.missPx}px / debt ${row.rollbackDebt} / ${row.note}</div>
      `).join("");
    }

    $("loadButton").addEventListener("click", render);
    document.querySelectorAll("input, select").forEach((el) => el.addEventListener("input", render));
    render();
  </script>
</body>
</html>
