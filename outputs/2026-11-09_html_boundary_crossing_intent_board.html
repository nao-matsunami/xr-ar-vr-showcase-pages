<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundary Crossing Intent Board</title><style>:root{color-scheme:dark;--bg:#08121e;--card:#10263b;--line:#315878;--text:#e7f6ff;--muted:#acc4d3;--cyan:#73ddff;--mint:#82edbe;--amber:#ffd074;--red:#ff899c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#235272,transparent 37%),var(--bg);font:15px system-ui;color:var(--text)}main{max-width:980px;margin:auto;padding:26px 16px 48px}h1{margin:0;font-size:clamp(28px,5vw,42px)}p{line-height:1.6;color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.map{height:300px;position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#163b50,#07101b)}.perimeter{position:absolute;inset:14% 15%;border:3px solid var(--mint);border-radius:28px;transition:.3s}.avatar{position:absolute;left:48%;top:52%;width:22px;height:22px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan);transition:.35s}.arrow{position:absolute;left:56%;top:52%;width:70px;height:3px;background:var(--amber);transform-origin:left;opacity:.3;transition:.3s}.arrow:after{content:'';position:absolute;right:-3px;top:-4px;border-left:10px solid var(--amber);border-top:5px solid transparent;border-bottom:5px solid transparent}.gate{position:absolute;right:13%;top:42%;padding:8px;border:1px solid var(--mint);border-radius:7px;font:11px ui-monospace;color:var(--mint)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 10px;border-radius:9px;border:1px solid #4382a1;background:#16405a;color:var(--text);font:inherit;cursor:pointer}button:hover{border-color:var(--cyan)}.row{margin:9px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace}.yes{color:var(--mint)}.maybe{color:var(--amber)}.no{color:var(--red)}pre{min-height:126px;white-space:pre-wrap;color:#d1efff;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Boundary Crossing <span style="color:var(--cyan)">Intent</span> Board</h1><p>派生の自作試作。境界付近で「進む」操作を即時テレポートにせず、余裕・確認・停止へ分岐させます。</p><div class="grid"><section class="card"><div class="map"><div class="perimeter"></div><div id="avatar" class="avatar"></div><div id="arrow" class="arrow"></div><div id="gate" class="gate">inside / free</div></div><div class="buttons"><button data-s="inside">余裕あり</button><button data-s="edge">境界 0.35m</button><button data-s="outside">境界を越える</button></div><p id="desc">状態を選ぶと、移動意図をどう扱うかが変わります。</p></section><aside class="card"><b>intent receipt</b><div class="row">distance: <span id="distance">—</span></div><div class="row">action: <span id="action">—</span></div><div class="row">feedback: <span id="feedback">—</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="clear">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let state='inside',log=[];const r={inside:{distance:'1.20m',action:'move allowed',feedback:'quiet edge',cls:'yes',x:'48%',arrow:'0.3',gate:'inside / free',desc:'境界に余裕があります。意図どおり移動し、警告を常時強調しません。'},edge:{distance:'0.35m',action:'preview + confirm',feedback:'amber brake cue',cls:'maybe',x:'65%',arrow:'1',gate:'edge / confirm',desc:'境界に近い状態。移動先をプレビューし、確認または方向変更を待ちます。'},outside:{distance:'-0.18m',action:'block crossing',feedback:'stop + recenter',cls:'no',x:'78%',arrow:'1',gate:'outside / stop',desc:'境界外へ向かう状態。移動を実行せず、停止と中心へ戻る選択肢を提示します。'}};function note(x){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+x);$('#log').textContent=log.join('\n')}function draw(){let x=r[state];for(let [id,v] of Object.entries({distance:x.distance,action:x.action,feedback:x.feedback})){let e=$('#'+id);e.textContent=v;e.className=x.cls}$('#avatar').style.left=x.x;$('#arrow').style.opacity=x.arrow;$('#gate').textContent=x.gate;$('#gate').style.color=state==='inside'?'var(--mint)':state==='edge'?'var(--amber)':'var(--red)';$('#gate').style.borderColor=$('#gate').style.color;$('#desc').textContent=x.desc;note(x.distance+' → '+x.action)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state=b.dataset.s;draw()});$('#copy').onclick=async()=>{let x=r[state],v=JSON.stringify({distance:x.distance,action:x.action,feedback:x.feedback},null,2);try{await navigator.clipboard.writeText(v);note('receipt copied')}catch{note(v)}};$('#clear').onclick=()=>{state='inside';log=[];draw()};draw()</script></html>
