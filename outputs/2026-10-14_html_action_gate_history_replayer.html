<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Gate History Replayer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121619;
      --panel: #1d2529;
      --panel2: #29363b;
      --line: #74858b;
      --text: #f6f1e8;
      --muted: #c8d0d2;
      --cyan: #91d9f3;
      --green: #a9df94;
      --gold: #edc66c;
      --red: #ef8176;
      --violet: #bba8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(145deg, rgba(145, 217, 243, 0.12), transparent 36%),
        linear-gradient(305deg, rgba(187, 168, 255, 0.12), transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header, .grid { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; margin-bottom: 14px; }
    .panel, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(29, 37, 41, 0.95);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
      padding: 18px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric, .frame, .row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 9, 12, 0.54);
    }
    .metric { padding: 10px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 17px; overflow-wrap: anywhere; }
    .toolbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    button, select, input, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    button { cursor: pointer; background: #27485b; border-color: #86cee8; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
    label input[type="range"] { padding: 0; accent-color: var(--cyan); }
    textarea { width: 100%; min-height: 242px; padding: 12px; resize: vertical; line-height: 1.45; }
    .timeline { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .frame { min-height: 154px; padding: 10px; display: grid; align-content: start; gap: 8px; }
    .frame b { font-size: 14px; }
    .frame small { color: var(--muted); line-height: 1.4; }
    .pill { border-radius: 999px; padding: 6px 9px; color: #071014; background: var(--green); font-size: 12px; font-weight: 800; justify-self: start; }
    .pill.warn { background: var(--gold); }
    .pill.bad { background: var(--red); }
    .pill.info { background: var(--violet); }
    .rows { display: grid; gap: 8px; }
    .row { padding: 10px; color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 980px) {
      header, .grid, .toolbar, .metrics, .timeline { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Action Gate History Replayer</h1>
        <p>1本目の action gate row を貼り付け、過去 row と比較して次の8 frameで UI を復帰できるか、fallback を維持すべきかを再生する派生試作です。</p>
      </div>
      <div class="panel">
        <div class="metrics">
          <div class="metric"><span>policy</span><strong id="policyMetric">balanced</strong></div>
          <div class="metric"><span>flip risk</span><strong id="riskMetric">0%</strong></div>
          <div class="metric"><span>restore frame</span><strong id="restoreMetric">-</strong></div>
          <div class="metric"><span>next route</span><strong id="routeMetric">-</strong></div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <select id="policySelect">
        <option value="balanced">balanced</option>
        <option value="strict">strict</option>
        <option value="forgiving">forgiving</option>
      </select>
      <select id="historySelect">
        <option value="stable">stable history</option>
        <option value="flapping">flapping history</option>
        <option value="newFeature">new feature spike</option>
      </select>
      <label>cooldown frames <input id="cooldownRange" type="range" min="0" max="5" value="2" step="1"></label>
      <button id="seedButton" type="button">Seed row</button>
      <button id="runButton" type="button">Replay</button>
    </div>

    <div class="grid">
      <section>
        <h2>Input row</h2>
        <textarea id="rowInput" spellcheck="false"></textarea>
      </section>
      <section>
        <h2>Replay summary</h2>
        <div id="summary" class="rows"></div>
      </section>
    </div>
    <section>
      <h2>8 frame recovery timeline</h2>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>
  <script>
    const seedRow = {
      date: "2026-10-14",
      sample: "xr-capability-action-gateboard",
      profile: "meta152",
      mode: "immersive-ar",
      frameSpareMs: 6,
      route: "webgpu-xr-primary",
      actionScore: 100,
      enabledActions: 6,
      firstHold: "none",
      gates: { secure: true, webgpu: true, xr: true, xrgpu: true, layers: true, depth: true, motion: true, policy: true },
      actions: {
        enterGpuXR: { status: "enabled", missing: [] },
        enableSpaceWarp: { status: "enabled", missing: [] },
        depthOcclusion: { status: "enabled", missing: [] },
        handPins: { status: "enabled", missing: [] },
        overlayControls: { status: "enabled", missing: [] },
        webglFallback: { status: "enabled", missing: [] }
      }
    };

    const histories = {
      stable: [96, 98, 100, 99, 100],
      flapping: [100, 62, 92, 58, 88],
      newFeature: [48, 52, 66, 74, 100]
    };

    const els = {
      policy: document.querySelector("#policySelect"),
      history: document.querySelector("#historySelect"),
      cooldown: document.querySelector("#cooldownRange"),
      row: document.querySelector("#rowInput"),
      summary: document.querySelector("#summary"),
      timeline: document.querySelector("#timeline"),
      policyMetric: document.querySelector("#policyMetric"),
      riskMetric: document.querySelector("#riskMetric"),
      restoreMetric: document.querySelector("#restoreMetric"),
      routeMetric: document.querySelector("#routeMetric")
    };

    function parseRow() {
      try {
        return JSON.parse(els.row.value);
      } catch {
        return { ...seedRow, actionScore: 0, route: "parse-error", firstHold: "invalid-json", enabledActions: 0 };
      }
    }

    function thresholdFor(policy) {
      if (policy === "strict") return 92;
      if (policy === "forgiving") return 58;
      return 76;
    }

    function buildFrames(row) {
      const threshold = thresholdFor(els.policy.value);
      const history = histories[els.history.value];
      const cooldown = Number(els.cooldown.value);
      const last = history[history.length - 1];
      const target = Number(row.actionScore || 0);
      const swing = Math.abs(target - last);
      const risk = Math.min(100, Math.round(swing + history.filter((value) => value < threshold).length * 12));
      const frames = Array.from({ length: 8 }, (_, index) => {
        const settle = Math.max(0, index - cooldown);
        const score = Math.round(last + (target - last) * Math.min(1, settle / 4));
        const stableEnough = score >= threshold && index >= cooldown;
        const holdReason = row.firstHold && row.firstHold !== "none" ? row.firstHold : risk > 46 && index < cooldown + 2 ? "history-flip-risk" : "none";
        const route = stableEnough && holdReason === "none" ? row.route : score >= 50 ? "webgl-xr-fallback" : "inline-preview-only";
        const status = route === row.route ? "restore" : holdReason === "none" ? "watch" : "hold";
        return { index, score, route, status, holdReason };
      });
      return { threshold, risk, frames };
    }

    function render() {
      const row = parseRow();
      const result = buildFrames(row);
      const restore = result.frames.find((frame) => frame.status === "restore");
      const nextRoute = result.frames[result.frames.length - 1].route;
      els.timeline.innerHTML = result.frames.map((frame) => {
        const cls = frame.status === "restore" ? "" : frame.status === "watch" ? "info" : "warn";
        return `<div class="frame"><b>frame ${frame.index}</b><span class="pill ${cls}">${frame.status}</span><small>score ${frame.score}%</small><small>route ${frame.route}</small><small>hold ${frame.holdReason}</small></div>`;
      }).join("");
      els.summary.innerHTML = [
        `threshold=${result.threshold}% / cooldown=${els.cooldown.value} frame で復帰判定します。`,
        `flip risk=${result.risk}% は過去 row と今日の actionScore の揺れから算出しています。`,
        restore ? `frame ${restore.index} で ${row.route} へ戻せます。` : `8 frame 内では ${nextRoute} を維持します。`,
        `次に足すなら、1本目の row を IndexedDB から自動読み込みし、実機 viewport と例外名を history に混ぜます。`
      ].map((text) => `<div class="row">${text}</div>`).join("");
      els.policyMetric.textContent = els.policy.value;
      els.riskMetric.textContent = `${result.risk}%`;
      els.restoreMetric.textContent = restore ? `frame ${restore.index}` : "hold";
      els.routeMetric.textContent = nextRoute;
    }

    document.querySelector("#seedButton").addEventListener("click", () => {
      els.row.value = JSON.stringify(seedRow, null, 2);
      render();
    });
    document.querySelector("#runButton").addEventListener("click", render);
    [els.policy, els.history, els.cooldown, els.row].forEach((el) => el.addEventListener("input", render));
    els.row.value = JSON.stringify(seedRow, null, 2);
    render();
  </script>
</body>
</html>
