<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Commit Window Replayer</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121314;
      --panel: rgba(24, 27, 30, 0.94);
      --line: rgba(239, 201, 105, 0.28);
      --text: #fffaf0;
      --muted: #c2b8a6;
      --mint: #86d8b8;
      --blue: #8ebcff;
      --amber: #efc969;
      --red: #ff8f8f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(130deg, rgba(239,201,105,0.15), transparent 32%),
        linear-gradient(240deg, rgba(134,216,184,0.12), transparent 35%),
        linear-gradient(180deg, #121314, #1e211f 64%, #0b0c0c);
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 850px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }

    .badge, .panel, .cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0,0,0,0.24);
    }

    .badge { min-width: 225px; padding: 12px 14px; }
    small, label span, .cell small {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      font-size: 1.16rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px;
    }

    .panel { padding: 14px; }
    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 800;
      font-size: 0.88rem;
    }

    select, input, button { width: 100%; }
    select {
      border: 1px solid rgba(255,250,240,0.18);
      border-radius: 8px;
      background: rgba(255,255,255,0.07);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    button {
      border: 1px solid rgba(239,201,105,0.46);
      border-radius: 8px;
      background: rgba(239,201,105,0.15);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .cell {
      padding: 12px;
      min-height: 74px;
      background: rgba(255,255,255,0.05);
    }

    .cell strong {
      display: block;
      margin-top: 5px;
      font-size: 1.08rem;
    }

    .track {
      display: grid;
      gap: 8px;
    }

    .event {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) 130px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.045);
    }

    .axis {
      position: relative;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .window {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 42%;
      width: 24%;
      background: rgba(134,216,184,0.18);
      border-left: 1px solid var(--mint);
      border-right: 1px solid var(--mint);
    }

    .dot {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--amber);
      transform: translate(-50%, -50%);
    }

    .route {
      font-weight: 900;
      text-align: right;
      color: var(--mint);
    }

    .hold { color: var(--amber); }
    .drop { color: var(--red); }
    @media (max-width: 860px) {
      header, .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .event { grid-template-columns: 1fr; }
      .route { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Action Commit Window Replayer</h1>
        <p class="subtitle">イベント台帳を短い hold window で再生し、pose age、gamepad age、duplicate risk から commit / hold / retry / drop を分類する派生試作です。</p>
      </div>
      <div class="badge">
        <small>Current action</small>
        <strong id="action">select</strong>
      </div>
    </header>

    <section class="layout">
      <aside class="panel controls">
        <label>Replay packet
          <span>入力ログの種類</span>
          <select id="packet">
            <option value="balanced">balanced controller</option>
            <option value="fast">fast tap burst</option>
            <option value="posegap">pose gap recovery</option>
            <option value="dupe">duplicate select</option>
          </select>
        </label>
        <label>Commit window <span><b id="windowValue">32</b> ms</span>
          <input id="commitWindow" type="range" min="12" max="96" value="32">
        </label>
        <label>Duplicate guard <span><b id="dupeValue">44</b> ms</span>
          <input id="dupeGuard" type="range" min="20" max="160" value="44">
        </label>
        <button id="step">Step replay</button>
        <button id="reset">Reset packet</button>
      </aside>

      <section class="panel">
        <div class="summary">
          <div class="cell"><small>committed</small><strong id="committed">0</strong></div>
          <div class="cell"><small>held</small><strong id="held">0</strong></div>
          <div class="cell"><small>retried</small><strong id="retried">0</strong></div>
          <div class="cell"><small>dropped</small><strong id="dropped">0</strong></div>
        </div>
        <div class="track" id="track"></div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const packets = {
      balanced: [
        ["selectstart", 0, 9, 8], ["poll", 14, 4, 2], ["select", 26, 7, 5], ["selectend", 34, 10, 8]
      ],
      fast: [
        ["selectstart", 0, 6, 5], ["select", 9, 9, 8], ["selectend", 13, 14, 10], ["selectstart", 35, 5, 5], ["select", 42, 6, 4]
      ],
      posegap: [
        ["selectstart", 0, 8, 6], ["poll", 18, 44, 5], ["select", 36, 62, 10], ["poll", 58, 18, 7], ["selectend", 70, 20, 9]
      ],
      dupe: [
        ["selectstart", 0, 5, 4], ["select", 24, 8, 5], ["select", 45, 9, 6], ["selectend", 68, 13, 7], ["squeeze", 112, 12, 11]
      ]
    };
    let cursor = 0;
    let rows = [];
    let lastCommit = -999;

    function classify(item) {
      const [type, at, poseAge, gamepadAge] = item;
      const commitWindow = Number($("commitWindow").value);
      const dupeGuard = Number($("dupeGuard").value);
      if (type === "poll") return "observe";
      if (poseAge > commitWindow * 1.25) return "retry";
      if (gamepadAge > commitWindow) return "hold";
      if ((type === "select" || type === "squeeze") && at - lastCommit < dupeGuard) return "drop";
      if (type === "select" || type === "squeeze") {
        lastCommit = at;
        return "commit";
      }
      return "hold";
    }

    function render() {
      $("windowValue").textContent = $("commitWindow").value;
      $("dupeValue").textContent = $("dupeGuard").value;
      $("action").textContent = rows[0]?.type || "select";
      const tally = { commit: 0, hold: 0, retry: 0, drop: 0 };
      rows.forEach((row) => { if (tally[row.route] !== undefined) tally[row.route] += 1; });
      $("committed").textContent = tally.commit;
      $("held").textContent = tally.hold;
      $("retried").textContent = tally.retry;
      $("dropped").textContent = tally.drop;
      $("track").innerHTML = rows.map((row) => {
        const left = Math.min(96, Math.max(4, row.at));
        const tone = row.route === "hold" ? "route hold" : row.route === "retry" || row.route === "drop" ? "route drop" : "route";
        return `<div class="event">
          <div><small>${row.at} ms</small><strong>${row.type}</strong></div>
          <div class="axis"><div class="window"></div><div class="dot" style="left:${left}%"></div></div>
          <div class="${tone}">${row.route}</div>
        </div>`;
      }).join("");
    }

    function step() {
      const source = packets[$("packet").value];
      const item = source[cursor % source.length];
      cursor += 1;
      const route = classify(item);
      rows.unshift({ type: item[0], at: item[1], poseAge: item[2], gamepadAge: item[3], route });
      rows.splice(9);
      render();
    }

    function reset() {
      cursor = 0;
      rows = [];
      lastCommit = -999;
      render();
    }

    $("step").addEventListener("click", step);
    $("reset").addEventListener("click", reset);
    $("packet").addEventListener("change", reset);
    $("commitWindow").addEventListener("input", () => {
      const existing = rows.map((row) => [row.type, row.at, row.poseAge, row.gamepadAge]).reverse();
      rows = [];
      lastCommit = -999;
      existing.forEach((item) => rows.unshift({ type: item[0], at: item[1], poseAge: item[2], gamepadAge: item[3], route: classify(item) }));
      render();
    });
    $("dupeGuard").addEventListener("input", () => $("commitWindow").dispatchEvent(new Event("input")));
    step();
    step();
    step();
  </script>
</body>
</html>
