<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchor UUID Retention Budget</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d242b;
      --muted: #63717c;
      --line: #d9e0df;
      --paper: #ffffff;
      --bg: #f7f6f1;
      --blue: #2d7199;
      --green: #317b52;
      --amber: #a76a24;
      --red: #b24c45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(49,123,82,.09), transparent 260px),
        var(--bg);
    }
    main {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2.25rem;
      line-height: 1.05;
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .card, .controls, .board {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(42, 51, 48, .07);
    }
    .card { padding: 16px; }
    .verdict {
      font-size: 1.28rem;
      font-weight: 880;
      margin-bottom: 7px;
    }
    .verdict.keep { color: var(--green); }
    .verdict.prune { color: var(--amber); }
    .verdict.block { color: var(--red); }
    .layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    .controls {
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
    }
    label {
      display: grid;
      gap: 6px;
      color: #334650;
      font-size: .86rem;
      font-weight: 760;
    }
    input[type="range"] { width: 100%; accent-color: var(--green); }
    .switch {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 34px;
      font-weight: 760;
      font-size: .88rem;
    }
    .switch input { transform: scale(1.12); accent-color: var(--green); }
    .board {
      padding: 16px;
      min-height: 430px;
    }
    .bars {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      align-items: end;
      min-height: 240px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(0deg, rgba(45,113,153,.11) 1px, transparent 1px),
        #fbfcfb;
      background-size: 100% 42px;
    }
    .slot {
      min-width: 0;
      display: grid;
      gap: 7px;
      align-content: end;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }
    .bar {
      min-height: 28px;
      border-radius: 8px 8px 3px 3px;
      background: var(--green);
      border: 1px solid rgba(0,0,0,.1);
      transition: height .2s ease, background .2s ease, opacity .2s ease;
    }
    .bar.warn { background: var(--amber); }
    .bar.bad { background: var(--red); opacity: .72; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfb;
    }
    .stat strong { display: block; font-size: 1.18rem; margin-bottom: 4px; }
    .queue {
      display: grid;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 110px 1fr 120px;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      align-items: center;
      font-size: .88rem;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 8px;
      font-weight: 850;
      text-align: center;
      background: #e7f1ea;
      color: var(--green);
    }
    .pill.prune { background: #fff0da; color: var(--amber); }
    .pill.block { background: #ffe8e4; color: var(--red); }
    @media (max-width: 820px) {
      header, .layout { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Anchor UUID Retention Budget</h1>
        <p>persistent anchor の UUID map が増えた時、どれを残し、どれを削除し、どれを visual marker に落とすかを LRU 風に検証します。</p>
      </div>
      <section class="card" aria-live="polite">
        <div id="verdict" class="verdict keep">KEEP MAP</div>
        <p id="copy">上限に余裕があり、復元候補はそのまま保持できます。</p>
      </section>
    </header>

    <section class="layout">
      <aside class="controls">
        <label>
          Persistent anchors in map <span id="countLabel">18</span>
          <input id="count" type="range" min="1" max="60" step="1" value="18">
        </label>
        <label>
          User agent soft cap <span id="capLabel">36</span>
          <input id="cap" type="range" min="8" max="64" step="1" value="36">
        </label>
        <label>
          Oldest anchor age <span id="ageLabel">12d</span>
          <input id="age" type="range" min="0" max="90" step="1" value="12">
        </label>
        <label>
          Restore success rate <span id="rateLabel">74%</span>
          <input id="rate" type="range" min="0" max="100" step="1" value="74">
        </label>
        <label>
          Re-hit confidence <span id="hitLabel">0.66</span>
          <input id="hit" type="range" min="0" max="1" step=".01" value=".66">
        </label>
        <div class="switch"><span>deletePersistentAnchor available</span><input id="deleteApi" type="checkbox" checked></div>
        <div class="switch"><span>show replacement marker</span><input id="marker" type="checkbox" checked></div>
      </aside>

      <section class="board">
        <div class="bars" id="bars"></div>
        <div class="stats">
          <div class="stat"><strong id="pressure">50%</strong><span>map pressure</span></div>
          <div class="stat"><strong id="prune">0</strong><span>prune candidates</span></div>
          <div class="stat"><strong id="route">restore first</strong><span>primary route</span></div>
        </div>
        <div class="queue" id="queue"></div>
      </section>
    </section>
  </main>

  <script>
    const ids = ["uuid-6f21", "uuid-9ad0", "uuid-2c11", "uuid-771a", "uuid-e402", "uuid-44bf"];
    const el = {
      count: document.querySelector("#count"),
      cap: document.querySelector("#cap"),
      age: document.querySelector("#age"),
      rate: document.querySelector("#rate"),
      hit: document.querySelector("#hit"),
      deleteApi: document.querySelector("#deleteApi"),
      marker: document.querySelector("#marker"),
      countLabel: document.querySelector("#countLabel"),
      capLabel: document.querySelector("#capLabel"),
      ageLabel: document.querySelector("#ageLabel"),
      rateLabel: document.querySelector("#rateLabel"),
      hitLabel: document.querySelector("#hitLabel"),
      verdict: document.querySelector("#verdict"),
      copy: document.querySelector("#copy"),
      bars: document.querySelector("#bars"),
      pressure: document.querySelector("#pressure"),
      prune: document.querySelector("#prune"),
      route: document.querySelector("#route"),
      queue: document.querySelector("#queue")
    };

    function decision() {
      const count = Number(el.count.value);
      const cap = Number(el.cap.value);
      const age = Number(el.age.value);
      const rate = Number(el.rate.value);
      const hit = Number(el.hit.value);
      const pressure = count / cap;
      const pruneCount = Math.max(0, Math.ceil(count - cap * .82));
      let verdict = "KEEP MAP";
      let cls = "keep";
      let copy = "上限に余裕があり、復元候補はそのまま保持できます。";
      let route = "restore first";

      if (pressure >= 1 || (age > 45 && rate < 45)) {
        if (el.deleteApi.checked) {
          verdict = "PRUNE UUIDS";
          cls = "prune";
          copy = "`deletePersistentAnchor(uuid)` を先に走らせ、古い UUID を削除してから新規 handle を保存します。";
          route = "delete then save";
        } else {
          verdict = "BLOCK CAPACITY";
          cls = "block";
          copy = "削除 API が使えないため、新しい persistent handle の保存を止めます。";
          route = "volatile only";
        }
      } else if (pressure > .82 || rate < 55) {
        verdict = "PRUNE SOON";
        cls = "prune";
        copy = "次回 restore に備えて低成功率の UUID を削除候補へ移します。";
        route = hit >= .55 ? "re-hit replacement" : "visual fallback";
      } else if (!el.marker.checked && hit < .4) {
        verdict = "HOLD CLEANUP";
        cls = "block";
        copy = "代替 marker も hit confidence も弱いため、削除判断を保留します。";
        route = "wait for user";
      }
      return { count, cap, age, rate, hit, pressure, pruneCount, verdict, cls, copy, route };
    }

    function render() {
      const s = decision();
      el.countLabel.textContent = s.count;
      el.capLabel.textContent = s.cap;
      el.ageLabel.textContent = `${s.age}d`;
      el.rateLabel.textContent = `${s.rate}%`;
      el.hitLabel.textContent = s.hit.toFixed(2);
      el.verdict.textContent = s.verdict;
      el.verdict.className = `verdict ${s.cls}`;
      el.copy.textContent = s.copy;
      el.pressure.textContent = `${Math.round(s.pressure * 100)}%`;
      el.prune.textContent = String(s.pruneCount);
      el.route.textContent = s.route;

      el.bars.innerHTML = ids.map((id, index) => {
        const age = Math.min(90, s.age + index * 5);
        const health = Math.max(8, s.rate - index * 9 - Math.max(0, s.pressure - .8) * 80);
        const cls = health < 32 ? "bad" : health < 55 || age > 45 ? "warn" : "";
        return `<div class="slot"><div class="bar ${cls}" style="height:${Math.max(28, health * 2)}px"></div><strong>${id}</strong><span>${Math.round(health)}% / ${age}d</span></div>`;
      }).join("");

      const queue = ids.map((id, index) => {
        const old = s.age + index * 5;
        const low = s.rate - index * 9 < 52;
        const status = index < s.pruneCount || old > 60 || low ? (s.cls === "block" ? "block" : "prune") : "keep";
        const text = status === "keep" ? "restore candidate" : status === "prune" ? "delete or re-hit replacement" : "volatile marker only";
        return `<div class="row"><strong>${id}</strong><span>${text}</span><span class="pill ${status}">${status}</span></div>`;
      });
      el.queue.innerHTML = queue.join("");
    }

    document.querySelectorAll("input").forEach((node) => node.addEventListener("input", render));
    render();
  </script>
</body>
</html>
