<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visibility Media Handoff Board</title><style>:root{color-scheme:dark;--bg:#071019;--card:#0d2030;--line:#295067;--text:#e8f7ff;--muted:#a7bfca;--cyan:#6ce3ff;--mint:#87efbd;--amber:#ffd17a;--red:#ff8ba0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 14% 0,#294760,transparent 36%),var(--bg);font:15px system-ui;color:var(--text)}main{max-width:980px;margin:auto;padding:25px 16px 46px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.scene{height:300px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(150deg,#174158,#071019 72%)}.beam{position:absolute;left:49%;top:-20px;width:4px;height:350px;background:linear-gradient(var(--cyan),transparent);box-shadow:0 0 30px var(--cyan);transition:.4s}.screen{position:absolute;left:18%;right:18%;top:66px;height:144px;border:1px solid var(--cyan);border-radius:12px;background:#0d2b3bbb;display:grid;place-items:center;font-size:23px;letter-spacing:.08em;transition:.4s}.screen small{font-size:12px;color:var(--muted);display:block;text-align:center;letter-spacing:0}.shade{position:absolute;inset:0;background:#05080ad9;opacity:0;transition:.4s}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--text);background:#143a4a;border:1px solid #3a768b;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace}.good{color:var(--mint)}.warn{color:var(--amber)}.bad{color:var(--red)}pre{min-height:125px;white-space:pre-wrap;color:#cfeef9;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Visibility <span style="color:var(--cyan)">Media Handoff</span> Board</h1><p>自作の派生試作。XR session の visible / visible-blurred / hidden を、単なる画面色ではなく、音・操作・レンダリングの引き継ぎ方針として検証します。</p><div class="grid"><section class="card"><div class="scene"><div id="beam" class="beam"></div><div id="screen" class="screen">LIVE WORLD<small id="stageText">normal cadence · media playing</small></div><div id="shade" class="shade"></div></div><div class="buttons"><button data-state="visible">visible</button><button data-state="blurred">visible-blurred</button><button data-state="hidden">hidden</button><button id="copy">copy plan</button></div><p id="meaning">状態を切り替えると、セッションを終えずに何を止め、何を維持するかを表示します。</p></section><aside class="card"><b>handoff plan</b><div class="row">render loop: <span id="render">—</span></div><div class="row">media: <span id="media">—</span></div><div class="row">interaction: <span id="input">—</span></div><div class="row">resume condition: <span id="resume">—</span></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let state='visible',log=[];const plans={visible:['normal frames','play / unmute','accept intent','none','good','通常の表示です。毎フレームを前提にせず、入力と描画の receipt を分けて保存します。'],blurred:['continue, reduced cadence','pause / retain position','hold target','visibilitychange → visible','warn','表示は残っても、フレームは低頻度で pose や入力は不正確になり得ます。メディアを止め、最後の安全な視覚状態を維持します。'],hidden:['no frame expected','pause / release audio','disable actions','visibilitychange → visible or end','bad','hidden 中はXR状態を読まず、確定操作を行いません。復帰を保証せず、session end も同じ片付け経路へ入れます。']};function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let p=plans[state],k=p[4];[['render',p[0]],['media',p[1]],['input',p[2]],['resume',p[3]]].forEach(([id,v])=>{let e=$('#'+id);e.textContent=v;e.className=k});$('#meaning').textContent=p[5];$('#stageText').textContent=p[0]+' · '+p[1];$('#shade').style.opacity=state==='hidden'?'.83':state==='blurred'?'.32':'0';$('#screen').style.filter=state==='blurred'?'blur(2px)':state==='hidden'?'blur(7px) grayscale(1)':'none';$('#beam').style.opacity=state==='visible'?'1':state==='blurred'?'.45':'0';note('visibilitychange → '+state)}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;draw()});$('#copy').onclick=async()=>{let p=plans[state],x={visibilityState:state,render:p[0],media:p[1],interaction:p[2]};try{await navigator.clipboard.writeText(JSON.stringify(x,null,2));note('handoff plan copied')}catch{note(JSON.stringify(x))}};draw()</script></html>
