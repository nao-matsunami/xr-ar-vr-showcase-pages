<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Cadence Confidence Lab</title><style>:root{color-scheme:dark;--bg:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#203a55,transparent 36%),var(--bg);font:15px system-ui;color:var(--t)}main{max-width:1000px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.stage{height:310px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#183346,#090e16 73%)}.ring{position:absolute;border:1px solid #69e5ff44;border-radius:50%;inset:16%;box-shadow:0 0 42px #69e5ff16}.hand{position:absolute;left:50%;top:52%;width:110px;height:130px;transform:translate(-50%,-50%);transition:.25s}.palm{position:absolute;left:26px;top:43px;width:62px;height:66px;border:2px solid var(--c);border-radius:28px 28px 20px 20px;background:#15465a99;box-shadow:0 0 25px #69e5ff66}.finger{position:absolute;width:17px;border:2px solid var(--c);background:#143b4b;border-radius:12px;transform-origin:bottom}.f1{height:65px;left:29px;top:0}.f2{height:82px;left:49px;top:-16px}.f3{height:70px;left:69px;top:-5px}.f4{height:52px;left:88px;top:13px}.thumb{height:48px;left:8px;top:48px;transform:rotate(-42deg)}.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 18px var(--g);left:calc(50% - 7px);top:17%;transition:.25s}.tag{position:absolute;left:12px;bottom:11px;padding:6px 8px;border:1px solid var(--l);border-radius:8px;font:12px ui-monospace;background:#07111cbb}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.meter{height:12px;margin-top:7px;border-radius:999px;border:1px solid var(--l);background:#061018;overflow:hidden}.meter i{display:block;height:100%;width:68%;background:var(--g);transition:.35s}pre{min-height:123px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Hand <span style="color:var(--c)">Cadence Confidence</span> Lab</h1><p>自作の最小試作。high は「追加の生データ」ではなく希望であり、揺れ・鮮度・追跡欠落を別々の receipt として扱います。マウス移動でも疑似手首を動かせます。</p><div class="grid"><section class="card"><div id="stage" class="stage"><div class="ring"></div><div id="dot" class="dot"></div><div id="hand" class="hand"><i class="finger f1"></i><i class="finger f2"></i><i class="finger f3"></i><i class="finger f4"></i><i class="finger thumb"></i><i class="palm"></i></div><div id="tag" class="tag">awaiting hand receipt</div></div><div class="buttons"><button data-mode="default">default cadence</button><button data-mode="high">high request</button><button data-mode="lost">tracking lost</button><button id="probe">WebXR probe</button></div><p id="meaning">更新頻度の方針を選択してください。</p></section><aside class="card"><b>hand tracking contract</b><div class="row">sample age: <span id="age">—</span> ms<div class="meter"><i id="bar"></i></div></div><div class="row">interaction policy: <span id="policy">awaiting</span></div><div class="row">jitter budget: <span id="jitter">—</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let mode='none',log=[];const cfg={default:[34,'preview + stable dwell','good','low / smoothed','既定頻度です。短い dwell を置いて、追跡の小さな揺れを選択に直結させません。'],high:[17,'preview + confirm','warn','medium / device dependent','high は希望であり保証ではありません。応答性を上げても、熱・電力・プライバシー都合で実際の頻度は変わり得ます。'],lost:[null,'hold target / require resume','bad','unknown','関節 pose が null の状態です。最後の位置で確定せず、視覚フィードバックを hold にして追跡再開を待ちます。']};function note(s){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+s);$('#log').textContent=log.join('\n')}function draw(){let c=cfg[mode];if(!c)return;let[a,p,k,j,t]=c;$('#age').textContent=a??'—';let x=$('#policy');x.textContent=p;x.className=k;$('#jitter').textContent=j;$('#meaning').textContent=t;$('#bar').style.width=a?Math.max(10,100-a*2)+'%':'5%';$('#bar').style.background=k==='good'?'var(--g)':k==='warn'?'var(--a)':'var(--r)';$('#hand').style.opacity=mode==='lost'?'.2':'1';$('#dot').style.background=k==='good'?'var(--g)':k==='warn'?'var(--a)':'var(--r)';$('#tag').textContent=(mode==='lost'?'pose unavailable':'sample '+a+'ms')+' → '+p}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;note('cadence receipt → '+cfg[mode][1]);draw()});$('#stage').onpointermove=e=>{if(mode==='lost')return;let r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;$('#hand').style.left=(25+x*50)+'%';$('#hand').style.top=(28+y*42)+'%';$('#dot').style.left=(25+x*50)+'%';$('#dot').style.top='17%'};$('#probe').onclick=async()=>{let out='WebXR unavailable';try{out=navigator.xr?'immersive-vr: '+await navigator.xr.isSessionSupported('immersive-vr'):'WebXR unavailable'}catch(e){out='probe error: '+e.name}note(out)};$('#copy').onclick=async()=>{let c=cfg[mode]||[];let r={frequencyHint:mode==='high'?'high':'default',sampleAgeMs:c[0]??null,policy:c[1]||'awaiting'};try{await navigator.clipboard.writeText(JSON.stringify(r,null,2));note('receipt copied')}catch{note(JSON.stringify(r))}};$('#reset').onclick=()=>{mode='default';log=[];note('ready: default cadence selected');draw()};$('#reset').click()</script></html>
