<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Retry Budget Comparator</title><style>:root{color-scheme:dark;--bg:#08111d;--ink:#e9f1ff;--muted:#9faec9;--cyan:#64e6ed;--amber:#ffc75d;--green:#82eeac;--red:#ff849d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#26396a,transparent 45%),var(--bg);font:15px system-ui;color:var(--ink)}main{max-width:1050px;margin:auto;padding:28px 18px}h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:var(--muted);line-height:1.65}.card{background:#111e33;border:1px solid #2b4863;border-radius:16px;padding:16px;margin-top:15px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:var(--ink);background:#183a59;border:1px solid #416d95;border-radius:9px;padding:9px 11px}.frames{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:15px}.f{min-height:142px;border:1px solid #2d4964;border-radius:10px;padding:8px;background:#0a1727;color:var(--muted)}.f.now{border-color:var(--cyan);box-shadow:0 0 18px #44d8e444}.dot{height:18px;width:18px;border-radius:50%;margin:10px 0;background:#53657b}.restore{background:var(--amber)}.tracked{background:var(--green)}.hold{background:var(--amber);animation:pulse 1s infinite}.blocked{background:var(--red)}@keyframes pulse{50%{opacity:.25}}#route{font-weight:700;font-size:21px;color:var(--cyan)}@media(max-width:650px){.frames{grid-template-columns:repeat(4,1fr)}}</style><main><h1>Anchor <span style="color:var(--amber)">Retry Budget</span> Comparator</h1><p>本命の journal と組み合わせる派生試作。復元失敗のたびに再配置せず、環境ごとの retry budget を8 frameで比較します。</p><section class="card"><div class="controls"><select id="mode"><option value="clean">stable room · budget 1</option><option value="uncertain">pose gap · budget 0</option><option value="miss">restore miss · re-hit once</option></select><button id="step">1 frame</button><button id="play">再生</button><button id="load">本命 journal を読む</button></div><p>Route: <span id="route">restore pending</span></p><div class="frames" id="frames"></div></section><section class="card"><b>比較の読み方</b><p id="note">本命の保存値を読み込むと、最後の receipt をここに表示します。赤は「再配置すべき」の意味ではなく、再試行を止める安全弁です。</p></section><script>const $=s=>document.querySelector(s);const paths={clean:['restore','restore','tracked','tracked','tracked','tracked','tracked','tracked'],uncertain:['restore','tracked','hold','hold','tracked','tracked','tracked','tracked'],miss:['restore','miss','hold','rehit','blocked','blocked','tracked','tracked']};let i=0,t;function cls(s){return s==='tracked'?'tracked':s==='hold'?'hold':s==='restore'||s==='rehit'?'restore':s==='miss'||s==='blocked'?'blocked':''}function desc(s){return {restore:'object only',tracked:'commit',hold:'no retry',miss:'keep marker',rehit:'budget -1',blocked:'no duplicate'}[s]}function draw(){let a=paths[$('#mode').value],s=a[Math.min(i,7)];$('#route').textContent=`${s} · ${desc(s)}`;$('#frames').innerHTML=a.map((x,n)=>`<div class="f ${n===i?'now':''}">F${n+1}<div class="dot ${cls(x)}"></div><b>${x}</b><small style="display:block;margin-top:8px">${desc(x)}</small></div>`).join('')}function step(){i=(i+1)%8;draw()}$('#step').onclick=step;$('#mode').onchange=()=>{i=0;draw()};$('#play').onclick=()=>{clearInterval(t);i=0;draw();t=setInterval(()=>{step();if(i===0)clearInterval(t)},620)};$('#load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem('xr-persistent-anchor-journal')||'{}'),last=d.journal?.at(-1);$('#note').textContent=last?`本命 journal: ${d.journal.length} receipt、最後は ${last.kind}。この比較では pose gap は retry 0、restore miss は re-hit 1回に制限します。`:'保存 journal はありません。合成 route を比較します。'}catch{$('#note').textContent='journal の読み込みに失敗しました。'}};draw();</script></main></html>
