<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haptic Cue Budget Board</title><style>:root{color-scheme:dark;--b:#090e19;--c:#172136;--l:#415677;--t:#eff5ff;--m:#b3c0d7;--x:#8aabff;--g:#88e9c0;--a:#ffd481;--r:#ff98aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 6%,#363775,transparent 35%),var(--b);color:var(--t);font:15px system-ui}main{max-width:1020px;margin:auto;padding:26px 16px 48px}h1{font-size:clamp(27px,5vw,42px);margin:0}p{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{background:#172136e8;border:1px solid var(--l);border-radius:16px;padding:15px}.field{height:300px;border-radius:12px;position:relative;background:linear-gradient(135deg,#111a2b,#29306b);overflow:hidden}.node{position:absolute;width:92px;height:92px;border:1px solid #8aabff;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 12px system-ui;transition:.25s}.n1{left:15%;top:23%}.n2{right:16%;top:17%}.n3{left:38%;bottom:12%}.wave{position:absolute;border:2px solid #88e9c0;border-radius:50%;width:80px;height:80px;opacity:0;pointer-events:none}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 10px;border:1px solid #6077a4;border-radius:9px;background:#293b61;color:var(--t);font:inherit;cursor:pointer}button:hover{border-color:var(--x)}.row{margin:9px 0;padding:10px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}pre{min-height:150px;white-space:pre-wrap;color:#e3ebff;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Haptic Cue <span style="color:var(--x)">Budget</span> Board</h1><p>派生試作。触覚を「何でも鳴らす確認音」ではなく、緊急度と直近の提示回数に応じて抑制する空間的な合図として検証します。</p><div class="grid"><section class="card"><div class="field" id="field"><div class="node n1" data-k="guide">GUIDE<br><small>direction</small></div><div class="node n2" data-k="confirm">CONFIRM<br><small>commit</small></div><div class="node n3" data-k="warning">WARNING<br><small>boundary</small></div></div><div class="buttons"><button data-mode="quiet">quiet / 0 cues</button><button data-mode="normal">normal / 2 cues</button><button data-mode="urgent">urgent / reserve warning</button><button id="copy">copy plan</button></div><p id="desc">ノードをクリックして cue を提案します。</p></section><aside class="card"><b>cue plan</b><div class="row">mode: <span id="mode">—</span></div><div class="row">remaining budget: <span id="budget">—</span></div><div class="row">last cue: <span id="last">—</span></div><div class="row">delivery: <span id="delivery">—</span></div><div class="buttons"><button id="reset">reset</button></div><pre id="log"></pre><p>実機では actuator の有無やOS方針で再生が保証されません。重要な警告は触覚だけにせず、視覚・音・安全な停止方針を並行させます。</p></aside></div></main><script>const $=s=>document.querySelector(s);let s={mode:'normal',budget:2,last:'none',delivery:'visual fallback'},log=[];const cfg={quiet:0,normal:2,urgent:1};function note(x){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+x);$('#log').textContent=log.join('\n')}function draw(){for(let k of['mode','budget','last','delivery']){let e=$('#'+k);e.textContent=s[k];e.className=s.last==='suppressed'?'warn':s.last==='none'?'bad':'good'}$('#desc').textContent=s.mode==='urgent'?'通常の案内は抑え、warning 用の1枠を残します。':'GUIDE / CONFIRM / WARNING の順にクリックして、少ない予算で何を残すかを確認します。'}function wave(el,color){let w=document.createElement('i');w.className='wave';w.style.left=(el.offsetLeft+6)+'px';w.style.top=(el.offsetTop+6)+'px';w.style.borderColor=color;$('#field').append(w);w.animate([{opacity:.9,transform:'scale(1)'},{opacity:0,transform:'scale(2.6)'}],{duration:550}).finished.then(()=>w.remove())}function cue(k,el){let allowed=s.budget>0&&(s.mode!=='urgent'||k==='warning');if(!allowed){s.last='suppressed';s.delivery='visual label only';note(k+' suppressed');draw();return}s.budget--;s.last=k;s.delivery='pulse proposed + visual';note(k+' cue accepted');wave(el,k==='warning'?'#ff98aa':'#88e9c0');draw()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s={mode:b.dataset.mode,budget:cfg[b.dataset.mode],last:'none',delivery:'visual fallback'};note('plan '+s.mode);draw()});document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>cue(e.dataset.k,e));$('#reset').onclick=()=>{s={mode:'normal',budget:2,last:'none',delivery:'visual fallback'};log=[];draw()};$('#copy').onclick=async()=>{let x=JSON.stringify(s,null,2);try{await navigator.clipboard.writeText(x);note('plan copied')}catch{note(x)}};draw()</script></html>
