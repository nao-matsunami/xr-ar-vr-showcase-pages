<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Confidence Handoff Board</title><style>:root{color-scheme:dark;--b:#081119;--p:#102331;--l:#2e566c;--i:#edf9ff;--m:#abc2cc;--c:#71e8f5;--g:#8ff0b4;--a:#ffd36c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 5%,#145266,transparent 29%),var(--b);color:var(--i);font:15px system-ui}main{max-width:970px;margin:auto;padding:28px 18px 50px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{color:var(--m);line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#102331e6;border:1px solid var(--l);border-radius:17px;padding:16px}.track{height:254px;position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#15394c,#08131d)}.route{position:absolute;left:9%;right:9%;top:49%;height:3px;background:#6fe8f466}.node{position:absolute;top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;border:2px solid var(--c);background:#0b2230;display:grid;place-items:center;font:12px ui-monospace;transition:.3s}.node:nth-of-type(2){left:10%}.node:nth-of-type(3){left:41%}.node:nth-of-type(4){left:72%}.active{border-color:var(--g);box-shadow:0 0 24px #8ff0b488}.risk{border-color:var(--a);box-shadow:0 0 24px #ffd36c66}.chip{position:absolute;left:14%;top:25%;padding:7px 10px;border-radius:99px;background:#173a4c;border:1px solid var(--c);font:12px ui-monospace;transition:.35s}.meter{height:12px;background:#071017;border-radius:8px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8299,var(--a),var(--g));transition:.35s}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{font:inherit;color:var(--i);background:#163a4e;border:1px solid #477e93;border-radius:9px;padding:9px 11px;cursor:pointer}button:hover{border-color:var(--c)}.row{border:1px solid var(--l);padding:10px;border-radius:10px;margin:10px 0;font:12px ui-monospace}.good{color:var(--g)}.warn{color:var(--a)}pre{margin:0;min-height:168px;white-space:pre-wrap;color:#cfe5ef;font:12px ui-monospace}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>Anchor Confidence <span style="color:var(--c)">Handoff Board</span></h1><p>派生の自作試作。追跡品質の変化を「即座に新しいアンカーへ飛ぶ」操作にせず、候補・確認・handoff の順に可視化します。展示ラベルや作業手順の空間固定を安全に更新するための小さな検証です。</p><div class="grid"><section class="card"><div class="track"><div class="route"></div><div class="chip" id="chip">LABEL · 98%</div><div class="node" id="n1">A</div><div class="node" id="n2">B</div><div class="node" id="n3">C</div></div><div class="buttons"><button id="drift">confidence を低下</button><button id="candidate">B を候補にする</button><button id="handoff">handoff を確定</button><button id="restore">品質を回復</button></div><p id="state">Anchor A は安定しています。表示はその場に留まります。</p></section><aside class="card"><b>handoff receipt</b><div class="row">active anchor: <span id="active" class="good">A</span></div><div class="row">candidate: <span id="candidateState">none</span></div><div class="row">confidence: <span id="score" class="good">98%</span><div class="meter"><i id="bar"></i></div></div><div class="row">user confirmation: <span id="confirm">not needed</span></div><div class="buttons"><button id="reset">reset</button></div></aside></div><section class="card" style="margin-top:16px"><b>decision log</b><pre id="log"></pre></section></main><script>const $=s=>document.querySelector(s);let active='A',score=98,candidate=false,log=[];const t=()=>new Date().toISOString().slice(11,19);function note(a,b){log.unshift(`[${t()}] ${a.padEnd(10)} ${b}`);$('#log').textContent=log.join('\n')}function cls(e,c){$(e).className='node '+c}function draw(){cls('#n1',active==='A'?'active':score<70?'risk':'');cls('#n2',candidate?'risk':active==='B'?'active':'');cls('#n3','');$('#chip').style.left=active==='A'?'14%':active==='B'?'45%':'76%';$('#chip').textContent=`LABEL · ${score}%`;$('#bar').style.width=score+'%';let c=score<70?'warn':'good';$('#score').textContent=score+'%';$('#score').className=c;$('#active').textContent=active;$('#candidateState').textContent=candidate?'B / awaiting confirmation':'none';$('#candidateState').className=candidate?'warn':'';$('#confirm').textContent=candidate?'required before spatial move':'not needed';$('#confirm').className=candidate?'warn':'';$('#state').textContent=candidate?'B を候補として示しています。確定までラベルは A に残ります。':score<70?'A の品質低下を検知。自動移動せず代替候補を作ります。':`Anchor ${active} は安定しています。表示はその場に留まります。`}$('#drift').onclick=()=>{score=Math.max(44,score-34);note('quality','A confidence degraded; no automatic relocation');draw()};$('#candidate').onclick=()=>{if(score>=70){note('guard','stable anchor has no handoff need');return}candidate=true;note('candidate','B prepared; label remains on A pending confirmation');draw()};$('#handoff').onclick=()=>{if(!candidate){note('guard','candidate B is required');return}active='B';score=92;candidate=false;note('handoff','user-confirmed move A → B; old handle can be retired');draw()};$('#restore').onclick=()=>{score=98;candidate=false;note('quality','tracking confidence restored; candidate cleared');draw()};$('#reset').onclick=()=>{active='A';score=98;candidate=false;log=[];note('ready','quality, candidate, confirmation are separated');draw()};$('#reset').click()</script></html>
