<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Duplicate Guard Replayer</title><style>:root{color-scheme:dark;--bg:#080e1a;--ink:#e8f0ff;--muted:#9dacc7;--cyan:#58dce5;--amber:#ffc65c;--green:#7cf0a8;--red:#ff7f9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#213460,transparent 44%),var(--bg);color:var(--ink);font:15px system-ui}main{max-width:1000px;margin:auto;padding:30px 18px}h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:var(--muted);line-height:1.65}.panel{background:#111c30;border:1px solid #29435f;border-radius:16px;padding:16px;margin-top:15px}.controls{display:flex;gap:9px;flex-wrap:wrap}button,select{font:inherit;padding:9px 12px;color:var(--ink);background:#183653;border:1px solid #3b668f;border-radius:9px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:16px}.frame{min-height:142px;border:1px solid #2e4660;border-radius:10px;padding:8px;background:#0b1727;color:var(--muted)}.frame.now{border-color:var(--cyan);box-shadow:0 0 20px #2bc4d444}.dot{width:18px;height:18px;border-radius:50%;margin:10px 0;background:#4a5c72}.preview{background:var(--amber)}.commit{background:var(--green)}.hold{background:var(--amber);animation:blink 1s infinite}.block{background:var(--red)}@keyframes blink{50%{opacity:.25}}textarea{width:100%;min-height:90px;background:#091423;color:#c9dcfa;border:1px solid #2e5275;border-radius:9px;padding:10px;font:12px ui-monospace}#route{font-size:22px;color:var(--cyan);font-weight:bold}@media(max-width:650px){.timeline{grid-template-columns:repeat(4,1fr)}}</style><main><h1>Anchor <span style="color:var(--amber)">Duplicate Guard</span> Replayer</h1><p>本命試作が保存した receipt を読み、restore miss や pose loss のときに re-hit が二重配置を作らない route を8 frameで再生します。</p><section class="panel"><div class="controls"><select id="pattern"><option value="clean">clean materialization</option><option value="loss">tracking loss → hold</option><option value="rehit">restore miss → re-hit once</option></select><button id="load">本命の保存値を読む</button><button id="play">再生</button><button id="step">1 frame</button></div><p>Route: <span id="route">preview</span></p><div id="timeline" class="timeline"></div></section><section class="panel"><b>貼り付けた receipt（任意）</b><textarea id="json" placeholder="本命から export した JSON を貼り付けると、先頭 receipt を補助表示します"></textarea><p id="note">本命の localStorage または合成 receipt を使います。</p></section><script>
const patterns={clean:['hit','request','resolved','tracked','tracked','tracked','tracked','tracked'],loss:['hit','request','resolved','tracked','lost','lost','tracked','tracked'],rehit:['restore','miss','hold','rehit','request','resolved','tracked','tracked']};let i=0,timer;const $=s=>document.querySelector(s);function route(s){return s==='tracked'?'commit':s==='lost'||s==='hold'?'hold':s==='miss'?'block':s==='rehit'?'preview':'preview'}function draw(){let a=patterns[$('#pattern').value];$('#timeline').innerHTML=a.map((s,n)=>`<div class="frame ${n===i?'now':''}">F${n+1}<div class="dot ${route(s)}"></div><b>${s}</b><small style="display:block;margin-top:8px">${s==='rehit'?'guard: no second marker':route(s)}</small></div>`).join('');let s=a[Math.min(i,7)];$('#route').textContent=route(s)+(s==='rehit'?' · existing marker retained':'');}
function step(){i=(i+1)%8;draw()}$('#step').onclick=step;$('#pattern').onchange=()=>{i=0;draw()};$('#play').onclick=()=>{clearInterval(timer);i=0;draw();timer=setInterval(()=>{step();if(i===0)clearInterval(timer)},650)};$('#load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem('xr-hit-anchor-ledger')||'{}');$('#note').textContent=d.receipts?.length?`本命から ${d.receipts.length} receipt を読込み: ${d.receipts.at(-1).kind}`:'保存値なし。合成 receipt のまま再生します。'}catch{$('#note').textContent='保存値を読めませんでした。'}};$('#json').onchange=e=>{try{let d=JSON.parse(e.target.value);$('#note').textContent=`貼り付け receipt: ${d.receipts?.length||0} 件。re-hit は tracked receipt 前に1回だけ許可。`}catch{$('#note').textContent='JSON の形式を確認してください。'}};draw();</script></main></html>
