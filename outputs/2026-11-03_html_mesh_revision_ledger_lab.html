<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesh Revision Ledger Lab</title><style>:root{color-scheme:dark;--b:#07131a;--p:#0d2631;--l:#275667;--t:#e6f8ff;--m:#a3c0ca;--c:#67e8f9;--g:#8cf2b1;--a:#ffd36a;--r:#ff87a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#125e70,transparent 35%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:1080px;margin:auto;padding:26px 16px 46px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.65;color:var(--m)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.room{height:325px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#24596b,#071118 76%)}.floor{position:absolute;inset:42% -20% -45%;background:repeating-linear-gradient(90deg,#7ce8fa25 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,#7ce8fa25 0 2px,transparent 2px 40px);transform:perspective(450px) rotateX(63deg);transform-origin:top}.mesh{position:absolute;inset:18% 15% 20%;clip-path:polygon(6% 35%,25% 7%,49% 20%,75% 5%,95% 42%,80% 90%,49% 78%,17% 95%);background:repeating-linear-gradient(60deg,transparent 0 24px,#8cf2b155 25px 27px),repeating-linear-gradient(-35deg,transparent 0 29px,#8cf2b155 30px 32px),#8cf2b126;border:2px solid var(--g);transition:.35s}.mesh.revised{clip-path:polygon(3% 40%,20% 5%,46% 17%,72% 2%,98% 34%,84% 97%,58% 75%,30% 98%,8% 77%);border-color:var(--a);background-color:#ffd36b28}.mesh.drift{transform:translate(33px,-16px) rotate(3deg)}.mesh.lost{opacity:.18;border-color:var(--r);filter:grayscale(1)}button{font:inherit;color:var(--t);background:#143c4c;border:1px solid #407c8e;border-radius:9px;padding:9px 10px;cursor:pointer}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.row{margin:10px 0;padding:10px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}pre{white-space:pre-wrap;min-height:174px;max-height:300px;overflow:auto;margin:0;font:12px ui-monospace;color:#d5edf3}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Mesh Revision <span style="color:var(--c)">Ledger Lab</span></h1><p>自作の最小試作。環境メッシュの vertices / indices の改訂と、毎 frame 読む <code>meshSpace</code> pose を混同しないための状態台帳です。</p><div class="grid"><section class="card"><div class="room"><div class="floor"></div><div id="mesh" class="mesh"></div></div><div class="buttons"><button id="discover">1. mesh を検出</button><button id="revise">2. topology を改訂</button><button id="pose">3. pose のみ移動</button><button id="drop">4. tracking から除外</button></div><p id="status">mesh を検出して台帳へ追加してください。</p></section><aside class="card"><b>frame receipts</b><div class="row">detectedMeshes: <span id="seen">empty</span></div><div class="row">lastChangedTime: <span id="change">—</span></div><div class="row">meshSpace pose: <span id="poseOut">—</span></div><div class="row">geometry cache: <span id="geo">not allocated</span></div><div class="buttons"><button id="probe">WebXR probe</button><button id="reset">reset</button></div><p id="probeOut">対応状況は未確認です。</p></aside></div><section class="card" style="margin-top:15px"><b>revision ledger</b><pre id="log"></pre></section></main><script>const $=s=>document.querySelector(s);let known=0,rev=0,drift=0,lost=0,log=[];function note(k,v){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+k.padEnd(10)+v);$('#log').textContent=log.join('\n')}function set(id,t,c=''){let e=$(id);e.textContent=t;e.className=c}function draw(){let live=known&&!lost;$('#mesh').className='mesh '+(rev?'revised ':'')+(drift?'drift ':'')+(lost?'lost':'');set('#seen',live?'mesh-12 (tracked)':'empty',live?'g':'');set('#change',live?(rev?'geometry revision #2':'initial geometry'):'—',rev?'a':'g');set('#poseOut',live?(drift?'shifted; geometry cache intact':'sampled this frame'):'—',drift?'a':live?'g':'');set('#geo',live?(rev?'42 vertices / 54 triangles':'31 vertices / 38 triangles'):'not allocated',live?'g':'');$('#status').textContent=lost?'前 frame に存在した mesh が detectedMeshes から消えました。GPU/CPU cache を解放します。':!known?'mesh を検出して台帳へ追加してください。':rev?'vertices と indices を更新する revision。poseだけの移動とは別に再アップロードします。':drift?'meshSpace pose は変わりましたが geometry revision にはしません。':'meshSpace の pose は各 frame で取得します。'}$('#discover').onclick=()=>{if(lost){known=1;lost=rev=drift=0;note('discover','mesh-13 を新しい identity として追加')}else if(!known){known=1;note('discover','mesh-12: 31 vertices / 38 triangles を cache')}else note('guard','tracked mesh は identity を維持');draw()};$('#revise').onclick=()=>{if(!known||lost)return note('guard','tracked mesh が必要');rev=1;note('geometry','lastChangedTime 更新: vertex/index buffer を再構築');draw()};$('#pose').onclick=()=>{if(!known||lost)return note('guard','tracked mesh が必要');drift=!drift;note('pose','meshSpace pose を再取得。topology は変更なし');draw()};$('#drop').onclick=()=>{if(!known||lost)return note('guard','除外対象がない');lost=1;note('removed','detectedMeshes に無いため mesh-12 cache を破棄');draw()};$('#reset').onclick=()=>{known=rev=drift=lost=0;log=[];note('ready','discover → geometry / pose → removed を分離');draw()};$('#probe').onclick=async()=>{let xr=!!navigator.xr,ar=xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);$('#probeOut').textContent=`navigator.xr=${xr}; immersive-ar=${ar}。実装では requiredFeatures:['mesh-detection'] を要求し、XRFrame.detectedMeshes を前 frame の Map と比較します。`;note('probe',`navigator.xr=${xr}, immersive-ar=${ar}`)};$('#reset').click()</script></html>
