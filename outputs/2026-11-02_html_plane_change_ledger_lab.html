<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plane Change Ledger Lab</title><style>:root{color-scheme:dark;--b:#07121b;--p:#0c2331;--l:#285568;--i:#e6f8ff;--m:#9cb8c5;--c:#70e8fa;--g:#92f4b4;--a:#ffd36b;--r:#ff829b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#12627680,transparent 33%),var(--b);font:15px system-ui;color:var(--i)}main{max-width:1080px;margin:auto;padding:26px 17px 45px}h1{margin:0;font-size:clamp(26px,5vw,43px)}p{line-height:1.65;color:var(--m)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.card{border:1px solid var(--l);border-radius:16px;padding:15px;background:var(--p)}.room{height:322px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(150deg,#245269,#07111b 73%)}.floor{position:absolute;inset:38% -30% -40%;background:repeating-linear-gradient(90deg,#69dce527 0 2px,transparent 2px 42px),repeating-linear-gradient(0deg,#69dce527 0 2px,transparent 2px 42px);transform:perspective(450px) rotateX(63deg);transform-origin:top}.plane{position:absolute;left:19%;top:41%;width:63%;height:30%;border:2px solid var(--g);clip-path:polygon(3% 38%,25% 5%,81% 10%,98% 43%,79% 97%,25% 88%);background:#91f3b520;transform:skewY(-8deg);transition:.35s}.plane.changed{border-color:var(--a);background:#ffd36b28;clip-path:polygon(1% 41%,17% 0,69% 12%,99% 36%,86% 95%,39% 100%,9% 79%)}.plane.hidden{opacity:.22;border-color:var(--r);filter:grayscale(1)}.dot{position:absolute;left:53%;top:48%;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 25px var(--c);transition:.35s}.dot.drift{left:61%;top:43%;background:var(--a);box-shadow:0 0 25px var(--a)}button{font:inherit;color:var(--i);background:#14394c;border:1px solid #427a8d;border-radius:9px;padding:9px 10px;cursor:pointer}button:hover{border-color:var(--c)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.row{margin:10px 0;padding:10px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}pre{white-space:pre-wrap;margin:0;min-height:178px;max-height:280px;overflow:auto;font:12px ui-monospace;color:#c9e6ef}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Plane Change <span style="color:var(--c)">Ledger Lab</span></h1><p>自作の最小試作。平面ポリゴンの更新と、毎 frame 求め直す pose を別の receipt として扱います。実機では <code>plane-detection</code> を要求し、<code>XRFrame.detectedPlanes</code> を読みます。</p><div class="grid"><section class="card"><div class="room"><div class="floor"></div><div class="plane" id="plane"></div><div class="dot" id="dot"></div></div><div class="buttons"><button id="discover">1. plane を検出</button><button id="shape">2. polygon を更新</button><button id="pose">3. pose のみ移動</button><button id="drop">4. tracking から除外</button></div><p id="status">plane を検出して台帳に追加してください。</p></section><aside class="card"><b>frame receipts</b><div class="row">detectedPlanes: <span id="seen">empty</span></div><div class="row">lastChangedTime: <span id="changed">—</span></div><div class="row">pose / planeSpace: <span id="poseOut">—</span></div><div class="row">privacy detail: <span id="detail">not exposed</span></div><div class="buttons"><button id="probe">WebXR probe</button><button id="reset">reset</button></div><p id="probeOut">対応状況は未確認です。</p></aside></div><section class="card" style="margin-top:15px"><b>change ledger</b><pre id="log"></pre></section></main><script>const $=s=>document.querySelector(s);let known=false,changed=false,drift=false,removed=false,log=[];const now=()=>performance.now().toFixed(1)+'ms';function note(k,v){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+k.padEnd(11)+v);$('#log').textContent=log.join('\n')}function out(id,t,c=''){const e=$(id);e.textContent=t;e.className=c}function draw(){const live=known&&!removed;$('#plane').className='plane '+(changed?'changed ':'')+(removed?'hidden ':'');$('#dot').className='dot '+(drift?'drift ':'');out('#seen',live?'plane-07 (tracked)':'empty',live?'g':'');out('#changed',live?(changed?'polygon revised @ '+now():'initial geometry @ '+now()):'—',changed?'a':'g');out('#poseOut',live?(drift?'pose shifted; geometry unchanged':'pose sampled this frame'):'—',drift?'a':live?'g':'');out('#detail',live?(changed?'7 vertices / approximate boundary':'6 vertices / approximate boundary'):'not exposed',live?'g':'');$('#status').textContent=removed?'前 frame にあった plane が集合から消えました。台帳から削除します。':!known?'plane を検出して台帳に追加してください。':changed?'polygon 属性が変わった receipt。pose の変化とは別に再メッシュします。':drift?'pose は変わっても lastChangedTime の根拠にはしません。':'planeSpace の pose は各 frame で取得します。'}$('#discover').onclick=()=>{if(removed){known=true;removed=false;changed=drift=false;note('new plane','plane-08 を新規 identity として追加')}else if(!known){known=true;note('discover','plane-07: horizontal / 6 vertices を台帳へ')}else note('guard','既知の plane は identity を保って更新');draw()};$('#shape').onclick=()=>{if(!known||removed){note('guard','tracked plane が必要');return}changed=true;note('geometry','lastChangedTime 更新: polygon 6 → 7 vertices');draw()};$('#pose').onclick=()=>{if(!known||removed){note('guard','tracked plane が必要');return}drift=!drift;note('pose','planeSpace pose を再取得。polygon 更新とは別');draw()};$('#drop').onclick=()=>{if(!known||removed){note('guard','除外対象がない');return}removed=true;note('removed','detectedPlanes に無いため plane-07 を台帳から削除');draw()};$('#reset').onclick=()=>{known=changed=drift=removed=false;log=[];note('ready','discover → geometry / pose → removed を分離');draw()};$('#probe').onclick=async()=>{let xr=!!navigator.xr,ar=xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);$('#probeOut').textContent=`navigator.xr=${xr}; immersive-ar=${ar}。実装では requiredFeatures:['plane-detection'] を交渉し、未対応なら hit-test だけの導線に落とします。`;note('probe',`navigator.xr=${xr}, immersive-ar=${ar}`)};$('#reset').click()</script></html>
