<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust Floor Injection Replayer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111313;
      --panel: #1d2322;
      --panel-2: #252b2a;
      --line: #3b4543;
      --text: #f5f0e8;
      --muted: #bec6c1;
      --cyan: #69cbd2;
      --green: #8ed27c;
      --amber: #e5bc62;
      --red: #ee8278;
      --blue: #8fa9ef;
      --ink: #0c1010;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 10%, rgba(143, 169, 239, 0.15), transparent 30%),
        linear-gradient(138deg, rgba(105, 203, 210, 0.12), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1160px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .intro, .stage, section {
      background: rgba(29, 35, 34, 0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
    }

    .intro { padding: 24px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 55px);
      line-height: 1;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .stage {
      min-height: 346px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .lane {
      position: absolute;
      left: 18px;
      right: 18px;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 19, 19, 0.78);
      display: grid;
      grid-template-columns: 154px 1fr 130px;
      gap: 10px;
      align-items: center;
      padding: 0 12px;
    }

    .lane:nth-child(1) { top: 30px; }
    .lane:nth-child(2) { top: 98px; }
    .lane:nth-child(3) { top: 166px; }
    .lane:nth-child(4) { top: 234px; }

    .bar {
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
      position: relative;
      overflow: hidden;
    }

    .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(var(--clip, 70%));
      background: rgba(17, 19, 19, 0.78);
    }

    .lane strong { font-size: 13px; }
    .lane span { color: var(--muted); font-size: 13px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    select, input, button, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--cyan);
    }

    textarea {
      min-height: 188px;
      padding: 14px;
      line-height: 1.45;
      resize: vertical;
    }

    button {
      cursor: pointer;
      font-weight: 780;
      background: #28565a;
      border-color: #58aab0;
    }

    section {
      padding: 18px;
      margin-bottom: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      min-height: 138px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #161b1a;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .pill {
      width: fit-content;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 820;
      color: var(--ink);
      background: var(--cyan);
    }

    .pill.good { background: var(--green); }
    .pill.warn { background: var(--amber); }
    .pill.bad { background: var(--red); }
    .pill.info { background: var(--blue); }

    h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    pre {
      width: 100%;
      min-height: 172px;
      margin: 0;
      padding: 14px;
      white-space: pre-wrap;
      color: #d8f4f3;
      background: #111717;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
    }

    @media (max-width: 900px) {
      header, .controls, .cards { grid-template-columns: 1fr; }
      .stage { min-height: 438px; }
      .lane { grid-template-columns: 1fr; height: auto; min-height: 78px; align-items: start; padding: 10px; }
      .lane:nth-child(1) { top: 18px; }
      .lane:nth-child(2) { top: 116px; }
      .lane:nth-child(3) { top: 214px; }
      .lane:nth-child(4) { top: 312px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="intro">
        <h1>Trust Floor Injection Replayer</h1>
        <p>前段の session context JSON を読み、input / hit / anchor / layer の frame row に最低 trust floor を注入して route がどう変わるかを見る派生試作です。</p>
      </div>
      <div class="stage" aria-label="Trust floor rows">
        <div class="lane"><strong>input row</strong><div class="bar" id="bar-input"></div><span id="label-input">pending</span></div>
        <div class="lane"><strong>hit row</strong><div class="bar" id="bar-hit"></div><span id="label-hit">pending</span></div>
        <div class="lane"><strong>anchor row</strong><div class="bar" id="bar-anchor"></div><span id="label-anchor">pending</span></div>
        <div class="lane"><strong>layer row</strong><div class="bar" id="bar-layer"></div><span id="label-layer">pending</span></div>
      </div>
    </header>

    <div class="controls">
      <label>Policy
        <select id="policy">
          <option value="balanced">Balanced</option>
          <option value="strict">Strict</option>
          <option value="demo">Demo tolerant</option>
        </select>
      </label>
      <label>Frame age
        <input id="age" type="range" min="0" max="140" value="38">
      </label>
      <label>Sensor drift
        <input id="drift" type="range" min="0" max="100" value="22">
      </label>
      <label>Logger pressure
        <input id="pressure" type="range" min="0" max="100" value="46">
      </label>
      <label>Privacy risk
        <input id="privacy" type="range" min="0" max="100" value="24">
      </label>
    </div>

    <section>
      <h2>Context import</h2>
      <div class="controls">
        <button id="loadSeed">Load seed context</button>
        <button id="parseJson">Parse JSON</button>
        <button id="replay">Replay injection</button>
      </div>
      <textarea id="contextJson" spellcheck="false"></textarea>
    </section>

    <section>
      <h2>Injected routes</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2>Replay export</h2>
      <pre id="jsonOut"></pre>
    </section>
  </main>

  <script>
    const controls = {
      policy: document.getElementById("policy"),
      age: document.getElementById("age"),
      drift: document.getElementById("drift"),
      pressure: document.getElementById("pressure"),
      privacy: document.getElementById("privacy")
    };

    const seedContext = {
      type: "xr-session-context",
      date: "2026-09-22",
      sessionIntent: "anchor-replay",
      grantedRequiredPercent: 92,
      grantedOptionalPercent: 58,
      missingOptional: ["depth-sensing", "plane-detection"],
      probeConfidence: 74,
      privacyGrain: "coarse",
      expiresInMinutes: 50,
      contextScore: 73,
      route: "guarded logger",
      nextUse: "feed initial trust floor before input / hit / anchor frame rows"
    };

    let context = { ...seedContext };

    const baseRows = [
      { id: "input", label: "Input", confidence: 76, sensitivity: 0.72 },
      { id: "hit", label: "Hit test", confidence: 64, sensitivity: 0.86 },
      { id: "anchor", label: "Anchor", confidence: 69, sensitivity: 0.94 },
      { id: "layer", label: "Layer", confidence: 71, sensitivity: 0.66 }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function routeFor(score) {
      if (score >= 82) return "commit";
      if (score >= 67) return "guard";
      if (score >= 50) return "preview";
      return "drop";
    }

    function classFor(route) {
      if (route === "commit") return "good";
      if (route === "guard" || route === "preview") return "warn";
      return "bad";
    }

    function policyBias() {
      return { strict: -9, balanced: 0, demo: 8 }[controls.policy.value];
    }

    function floorFromContext() {
      const optionalPenalty = (context.missingOptional || []).length * 4;
      const privacyPenalty = context.privacyGrain === "precise" ? 9 : context.privacyGrain === "balanced" ? 4 : 0;
      return clamp(Math.round((context.contextScore || 55) - optionalPenalty - privacyPenalty + policyBias()), 20, 96);
    }

    function evaluateRows() {
      const floor = floorFromContext();
      const agePenalty = Number(controls.age.value) * 0.12;
      const driftPenalty = Number(controls.drift.value) * 0.18;
      const pressurePenalty = Number(controls.pressure.value) * 0.10;
      const privacyPenalty = Number(controls.privacy.value) * 0.08;
      return baseRows.map((row) => {
        const raw = row.confidence - (agePenalty + driftPenalty + pressurePenalty + privacyPenalty) * row.sensitivity;
        const injected = clamp(Math.round(raw * 0.58 + floor * 0.42), 0, 100);
        const route = routeFor(injected);
        return {
          ...row,
          trustFloor: floor,
          rawScore: Math.round(raw),
          injectedScore: injected,
          route,
          reason: `${context.sessionIntent || "unknown"} context ${context.route || "unrouted"} -> ${route}`
        };
      });
    }

    function render() {
      const rows = evaluateRows();
      rows.forEach((row) => {
        document.getElementById(`bar-${row.id}`).style.setProperty("--clip", `${row.injectedScore}%`);
        document.getElementById(`label-${row.id}`).textContent = `${row.injectedScore} / ${row.route}`;
      });
      document.getElementById("cards").innerHTML = rows.map((row) => `
        <article class="card">
          <span class="pill ${classFor(row.route)}">${row.injectedScore}</span>
          <h3>${row.label}</h3>
          <p>${row.reason}. raw ${row.rawScore}, floor ${row.trustFloor}.</p>
        </article>
      `).join("");
      document.getElementById("jsonOut").textContent = JSON.stringify({
        type: "trust-floor-injection-replay",
        date: "2026-09-22",
        policy: controls.policy.value,
        sourceContext: context,
        rows,
        nextUse: "send injected route into the first live logger frame before anchor commit"
      }, null, 2);
    }

    function loadSeed() {
      context = { ...seedContext };
      document.getElementById("contextJson").value = JSON.stringify(context, null, 2);
      render();
    }

    function parseJson() {
      try {
        context = JSON.parse(document.getElementById("contextJson").value);
      } catch (error) {
        context = { ...seedContext, route: "parse fallback", contextScore: 48, missingOptional: ["invalid-json"] };
      }
      render();
    }

    Object.values(controls).forEach((control) => control.addEventListener("input", render));
    document.getElementById("loadSeed").addEventListener("click", loadSeed);
    document.getElementById("parseJson").addEventListener("click", parseJson);
    document.getElementById("replay").addEventListener("click", render);
    loadSeed();
  </script>
</body>
</html>
