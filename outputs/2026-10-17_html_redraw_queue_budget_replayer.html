<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redraw Queue Budget Replayer</title><style>
:root{color-scheme:dark;--bg:#0b1018;--p:#132130;--line:#35536d;--t:#ecf5f7;--m:#a4b8c2;--a:#f2c96c;--g:#b6e879;--c:#64ddd2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#16445d,transparent 36%),var(--bg);color:var(--t);font:15px system-ui,sans-serif}main{width:min(1060px,calc(100% - 28px));margin:auto;padding:26px 0 46px}.top,.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.box{background:#132130e8;border:1px solid var(--line);border-radius:12px;padding:17px}h1{font-size:clamp(29px,5vw,48px);line-height:1;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}p{margin:0;line-height:1.65;color:var(--m)}button,select,textarea{font:inherit;color:var(--t);background:#1b3041;border:1px solid var(--line);border-radius:8px;min-height:42px;padding:0 10px}button{cursor:pointer;border-color:var(--c)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}textarea{width:100%;height:190px;padding:10px;line-height:1.4;resize:vertical}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.frame{min-height:108px;border:1px solid var(--line);border-radius:9px;padding:8px;background:#0a141e;color:var(--m)}.frame b{display:block;color:var(--t)}.go{border-color:var(--g);box-shadow:inset 0 0 16px #b6e87918}.wait{border-color:var(--a)}.answer{font-size:26px;color:var(--c);margin-top:10px}@media(max-width:720px){.top,.grid{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(4,1fr)}}
</style><main><div class="top"><section class="box"><h1>Redraw Queue<br>Budget Replayer</h1><p>本命が保存した layer row を読み、8 frame の更新圧で redraw をいつ許可するかを再生する派生試作です。静的 HUD を毎 frame 描き直さない一方、可読性に影響する更新を落とさないための budget 検証に使えます。</p><div class="tools"><button id="load">本命の最新 row を読む</button><select id="preset"><option value="pulse">HUD update pulse</option><option value="storm">media update storm</option><option value="quiet">mostly static</option></select><button id="play">1 frame 進める</button></div></section><section class="box"><h2>再生 verdict</h2><div id="answer" class="answer">row を読み込んでください</div><p id="note">読み込み後、キューの優先度とフレーム予算を掛け合わせます。</p></section></div><div class="grid"><section class="box"><h2>input row</h2><textarea id="input" spellcheck="false"></textarea></section><section class="box"><h2>8-frame budget</h2><div id="frames" class="timeline"></div></section></div></main><script>
const $=s=>document.querySelector(s);let idx=0,row=null;const waves={pulse:[9,1,0,8,1,0,7,1],storm:[5,7,9,8,7,9,6,8],quiet:[1,0,0,1,0,0,1,0]};
function parse(){try{row=JSON.parse($('#input').value);return true}catch(e){$('#answer').textContent='JSON を確認してください';return false}}
function draw(){const wave=waves[$('#preset').value],base=row?.queue?.[0]?.priority??0;$('#frames').innerHTML=wave.map((v,i)=>{const allow=base+v*5>=62;return `<div class="frame ${i===idx?(allow?'go':'wait'):''}"><b>F${i+1}</b>Δ ${v}<br>${i===idx?(allow?'redraw':'reuse'):'—'}</div>`}).join('');const v=wave[idx],allow=base+v*5>=62;$('#answer').textContent=allow?'REDRAW: prioritized layer':'REUSE: keep texture';$('#note').textContent=`F${idx+1} · top priority ${base} + update pressure ${v*5} ${allow?'≥':'<'} 62。次は実機の needsRedraw / redraw event をこの row に追加。`}
$('#load').onclick=()=>{const saved=localStorage.getItem('xr-layer-redraw-row');if(saved){$('#input').value=saved;parse();draw()}else $('#answer').textContent='先に本命で row を保存してください'};$('#preset').onchange=()=>{idx=0;draw()};$('#play').onclick=()=>{if(parse()){idx=(idx+1)%8;draw()}};$('#input').oninput=()=>{if(parse())draw()};
</script>
