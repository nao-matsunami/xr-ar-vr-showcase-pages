<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinch Grasp Intent Router</title><style>:root{color-scheme:dark;--b:#07111c;--p:#0d2330;--l:#2b5366;--t:#e7f7ff;--m:#a7bdc9;--c:#69e5ff;--g:#92f3bd;--a:#ffd579;--r:#ff8ba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,#343058,transparent 37%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:930px;margin:auto;padding:25px 16px 44px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.6;color:var(--m)}.grid{display:grid;grid-template-columns:1.25fr .85fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.stage{height:300px;position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#182845,#090e16)}.orb{position:absolute;width:92px;height:92px;border-radius:50%;left:calc(50% - 46px);top:calc(50% - 46px);border:2px solid var(--c);background:radial-gradient(circle at 35% 28%,#fff,var(--c) 18%,#245b78 58%,#08151d);box-shadow:0 0 38px #69e5ff55;transition:.3s}.arc{position:absolute;inset:16%;border:1px dashed #69e5ff55;border-radius:50%}.label{position:absolute;left:12px;bottom:11px;padding:6px 8px;border:1px solid var(--l);border-radius:8px;font:12px ui-monospace;background:#07111cbb}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--t);background:#143948;border:1px solid #3b788c;border-radius:9px;padding:9px 10px;cursor:pointer}.row{margin:9px 0;padding:9px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.pill{display:inline-block;margin:5px 4px 0 0;padding:4px 7px;border-radius:999px;border:1px solid var(--l)}pre{min-height:128px;margin:8px 0 0;white-space:pre-wrap;font:12px ui-monospace;color:#d3edf6}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Pinch / Grasp <span style="color:var(--c)">Intent Router</span></h1><p>自作の派生試作。ピンチが select と squeeze の両方に見える場面で、距離・対象・確認を receipt に残し、同じジェスチャーを二重発火させないルータです。</p><div class="grid"><section class="card"><div class="stage"><div class="arc"></div><div id="orb" class="orb"></div><div id="label" class="label">awaiting gesture</div></div><div class="buttons"><button data-g="far">far pinch → select</button><button data-g="near">near pinch → grasp</button><button data-g="ambiguous">ambiguous → ask</button><button data-g="release">release</button></div><p id="meaning">ジェスチャーを選んで意図の振り分けを確認してください。</p></section><aside class="card"><b>intent receipt</b><div class="row">target distance: <span id="distance">—</span></div><div class="row">route: <span id="route">awaiting</span></div><div class="row"><span class="pill">select <b id="s">0</b></span><span class="pill">grasp <b id="g">0</b></span><span class="pill">confirm <b id="c">0</b></span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset counts</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let counts={select:0,grasp:0,confirm:0},last={};const cfg={far:['1.42 m','select','good','遠方対象では pinching を primary select に一度だけ割り当てます。'],near:['0.08 m','grasp','good','近傍対象では同じ閉じ動作を grasp に割り当て、select は発火させません。'],ambiguous:['0.34 m','confirm','warn','距離と対象が競合します。二重発火ではなく、対象の強調と確認にルーティングします。'],release:['—','release','bad','解除を明示的に記録し、保持状態を終了します。']};function render(){for(let k in counts)$('#'+k[0]).textContent=counts[k];$('#distance').textContent=last.d||'—';let r=$('#route');r.textContent=last.r||'awaiting';r.className=last.k||'';$('#meaning').textContent=last.t||'ジェスチャーを選んで意図の振り分けを確認してください。';$('#label').textContent=last.r?last.r+' receipt: one route only':'awaiting gesture';$('#orb').style.transform=last.r==='grasp'?'scale(1.18)':last.r==='confirm'?'scale(.86)':last.r==='release'?'scale(.7)':'scale(1)';$('#orb').style.borderColor=last.k==='warn'?'var(--a)':last.k==='bad'?'var(--r)':'var(--c)'}function act(g){let[d,r,k,t]=cfg[g];last={d,r,k,t};if(r==='select')counts.select++;if(r==='grasp')counts.grasp++;if(r==='confirm')counts.confirm++;let line='['+new Date().toISOString().slice(11,19)+'] '+g+' → '+r;$('#log').textContent=line+'\n'+$('#log').textContent;render()}document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>act(b.dataset.g));$('#copy').onclick=async()=>{let x={distance:last.d||null,route:last.r||'awaiting',counts};try{await navigator.clipboard.writeText(JSON.stringify(x,null,2));$('#log').textContent='receipt copied\n'+$('#log').textContent}catch{$('#log').textContent=JSON.stringify(x)+'\n'+$('#log').textContent}};$('#reset').onclick=()=>{counts={select:0,grasp:0,confirm:0};last={};$('#log').textContent='counts reset';render()};render()</script></html>
