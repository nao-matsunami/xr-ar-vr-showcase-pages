<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracked Anchor Recovery Monitor</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #071113;
      --panel: rgba(11, 20, 23, 0.94);
      --line: rgba(221, 239, 236, 0.2);
      --text: #f3fffb;
      --muted: #9fb5b2;
      --cyan: #80e7ff;
      --green: #9df3bd;
      --amber: #ffd06a;
      --red: #ff768d;
      --ink: #071113;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #071113, #142125 58%, #090f14);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.6vw, 2.35rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 850px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .badge,
    .stage,
    .panel,
    .log {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    }

    .badge {
      min-width: 250px;
      padding: 12px 14px;
    }

    .badge b {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge span {
      display: block;
      margin-top: 5px;
      color: var(--cyan);
      font-weight: 760;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(330px, 0.65fr);
      gap: 14px;
    }

    .stage {
      position: relative;
      min-height: 620px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 620px;
      background: #071113;
      touch-action: none;
    }

    .hud {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      pointer-events: none;
    }

    .readout {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(243, 255, 251, 0.13);
      border-radius: 8px;
      background: rgba(3, 10, 12, 0.78);
    }

    .readout small {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .readout strong {
      display: block;
      margin-top: 4px;
      font-size: clamp(0.9rem, 1.7vw, 1.12rem);
      line-height: 1.16;
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .panel,
    .log {
      padding: 14px;
    }

    .panel h2,
    .log h2 {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 11px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    label output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    select,
    button {
      width: 100%;
      border: 1px solid rgba(243, 255, 251, 0.15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
    }

    select {
      padding: 10px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.primary {
      color: var(--ink);
      border-color: transparent;
      background: var(--cyan);
      font-weight: 760;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(128, 231, 255, 0.58);
    }

    .queue {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .queue-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      border: 1px solid rgba(243, 255, 251, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      font-size: 0.82rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
    }

    .dot.warn { background: var(--amber); }
    .dot.fail { background: var(--red); }

    pre {
      min-height: 174px;
      max-height: 240px;
      overflow: auto;
      margin: 0;
      white-space: pre-wrap;
      color: #d9fff2;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .badge {
        min-width: 0;
      }

      .stage {
        min-height: 540px;
      }

      canvas {
        height: 540px;
      }

      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100vw - 18px, 1180px);
        padding-top: 14px;
      }

      .button-grid,
      .hud {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Tracked Anchor Recovery Monitor</h1>
        <p class="subtitle">`XRFrame.trackedAnchors` の集合変化、unlocatable frame、persistent handle 復元失敗を、実機なしで追うための自作ミニ監視盤です。</p>
      </div>
      <div class="badge">
        <b>today's probe</b>
        <span id="headline">3 anchors / watching</span>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <canvas id="stage" width="900" height="620" aria-label="tracked anchor recovery monitor"></canvas>
        <div class="hud">
          <div class="readout"><small>trackedAnchors</small><strong id="tracked">3 / 3</strong></div>
          <div class="readout"><small>unlocatable frames</small><strong id="unlocatable">0</strong></div>
          <div class="readout"><small>restore failures</small><strong id="failures">0</strong></div>
          <div class="readout"><small>decision</small><strong id="decision">monitor</strong></div>
        </div>
      </div>

      <aside class="side">
        <div class="panel">
          <h2>Frame Controls</h2>
          <div class="control">
            <label for="jitter">pose drift cm <output id="jitterOut">8</output></label>
            <input id="jitter" type="range" min="0" max="40" value="8">
          </div>
          <div class="control">
            <label for="dropRate">unlocatable rate % <output id="dropOut">18</output></label>
            <input id="dropRate" type="range" min="0" max="80" value="18">
          </div>
          <div class="control">
            <label for="restoreBudget">restore budget <output id="budgetOut">2</output></label>
            <input id="restoreBudget" type="range" min="0" max="4" value="2">
          </div>
          <div class="control">
            <label for="scenario">scenario</label>
            <select id="scenario">
              <option value="normal">normal room scan</option>
              <option value="occluded">occluded anchor</option>
              <option value="lost">lost persistent map</option>
              <option value="moving">moving native entity</option>
            </select>
          </div>
          <div class="button-grid">
            <button class="primary" id="tick">advance frame</button>
            <button id="auto">auto run</button>
            <button id="restore">restore selected</button>
            <button id="delete">delete selected</button>
          </div>
        </div>

        <div class="panel">
          <h2>Recovery Queue</h2>
          <div class="queue" id="queue"></div>
        </div>

        <div class="log">
          <h2>Payload</h2>
          <pre id="payload"></pre>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const controls = {
      jitter: document.getElementById("jitter"),
      dropRate: document.getElementById("dropRate"),
      restoreBudget: document.getElementById("restoreBudget"),
      scenario: document.getElementById("scenario")
    };
    const out = {
      headline: document.getElementById("headline"),
      tracked: document.getElementById("tracked"),
      unlocatable: document.getElementById("unlocatable"),
      failures: document.getElementById("failures"),
      decision: document.getElementById("decision"),
      jitter: document.getElementById("jitterOut"),
      drop: document.getElementById("dropOut"),
      budget: document.getElementById("budgetOut"),
      queue: document.getElementById("queue"),
      payload: document.getElementById("payload")
    };

    const anchors = [
      { id: "A1", label: "door marker", x: 250, y: 240, dx: 0, dy: 0, tracked: true, locatable: true, deleted: false, persistent: "uuid-door-01", misses: 0, failures: 0, color: "#80e7ff" },
      { id: "B2", label: "desk panel", x: 500, y: 300, dx: 0, dy: 0, tracked: true, locatable: true, deleted: false, persistent: "uuid-desk-02", misses: 0, failures: 0, color: "#9df3bd" },
      { id: "C3", label: "moving prop", x: 660, y: 205, dx: 0, dy: 0, tracked: true, locatable: true, deleted: false, persistent: null, misses: 0, failures: 0, color: "#ffd06a" }
    ];

    const state = {
      frame: 0,
      selected: "B2",
      auto: false,
      failures: 0,
      queue: [],
      lastDecision: "monitor",
      pointer: { x: 500, y: 300 }
    };

    function number(value) {
      return Number.parseFloat(value);
    }

    function selectedAnchor() {
      return anchors.find((anchor) => anchor.id === state.selected) || anchors[0];
    }

    function scenarioBias(anchor) {
      const scenario = controls.scenario.value;
      if (scenario === "normal") return 0;
      if (scenario === "occluded" && anchor.id === "B2") return 30;
      if (scenario === "lost" && anchor.id === "A1") return 54;
      if (scenario === "moving" && anchor.id === "C3") return 22;
      return 0;
    }

    function enqueue(type, anchor, severity) {
      const existing = state.queue.find((item) => item.anchorId === anchor.id && item.type === type);
      if (existing) {
        existing.severity = Math.max(existing.severity, severity);
        existing.frame = state.frame;
        return;
      }
      state.queue.unshift({ type, anchorId: anchor.id, label: anchor.label, severity, frame: state.frame });
      state.queue = state.queue.slice(0, 5);
    }

    function advanceFrame() {
      state.frame += 1;
      const drift = number(controls.jitter.value);
      const drop = number(controls.dropRate.value);
      const scenario = controls.scenario.value;
      anchors.forEach((anchor, index) => {
        if (anchor.deleted) {
          anchor.tracked = false;
          anchor.locatable = false;
          return;
        }

        const phase = state.frame * 0.09 + index * 1.8;
        const bias = scenarioBias(anchor);
        anchor.dx = Math.cos(phase) * drift * 1.15 + (scenario === "moving" && anchor.id === "C3" ? Math.sin(phase * 0.7) * 26 : 0);
        anchor.dy = Math.sin(phase * 1.18) * drift * 0.8;
        const noise = 38 + Math.sin(phase * 1.7) * 36 + bias;
        anchor.locatable = noise > drop;
        anchor.tracked = scenario === "lost" && anchor.id === "A1" && state.frame > 4 ? false : true;

        if (!anchor.tracked) {
          enqueue("remove-from-set", anchor, 3);
        } else if (!anchor.locatable) {
          anchor.misses += 1;
          enqueue(anchor.misses > 2 ? "restore-or-rehit" : "hold-pose", anchor, anchor.misses > 2 ? 2 : 1);
        } else {
          anchor.misses = Math.max(0, anchor.misses - 1);
          if (Math.hypot(anchor.dx, anchor.dy) > 25) enqueue("drift-review", anchor, 2);
        }
      });
      state.lastDecision = decide();
      render();
    }

    function decide() {
      const critical = state.queue.find((item) => item.severity >= 3);
      if (critical) return `delete mesh for ${critical.anchorId}`;
      const restore = state.queue.find((item) => item.type === "restore-or-rehit");
      if (restore) return `restore queue ${restore.anchorId}`;
      const drift = state.queue.find((item) => item.type === "drift-review");
      if (drift) return `inspect drift ${drift.anchorId}`;
      return "monitor";
    }

    function restoreSelected() {
      const anchor = selectedAnchor();
      const budget = number(controls.restoreBudget.value);
      if (!anchor.persistent || budget <= 0 || controls.scenario.value === "lost") {
        anchor.failures += 1;
        state.failures += 1;
        enqueue("restore-failed", anchor, 3);
      } else {
        anchor.deleted = false;
        anchor.tracked = true;
        anchor.locatable = true;
        anchor.misses = 0;
        state.queue = state.queue.filter((item) => item.anchorId !== anchor.id);
      }
      state.lastDecision = decide();
      render();
    }

    function deleteSelected() {
      const anchor = selectedAnchor();
      anchor.deleted = true;
      anchor.tracked = false;
      anchor.locatable = false;
      enqueue("delete-called", anchor, 3);
      state.lastDecision = decide();
      render();
    }

    function drawGrid() {
      ctx.fillStyle = "#071113";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(243, 255, 251, 0.08)";
      ctx.lineWidth = 1;
      for (let x = 60; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 80);
        ctx.lineTo(x, canvas.height - 120);
        ctx.stroke();
      }
      for (let y = 100; y < canvas.height - 100; y += 48) {
        ctx.beginPath();
        ctx.moveTo(50, y);
        ctx.lineTo(canvas.width - 50, y);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(128, 231, 255, 0.1)";
      ctx.fillRect(72, 124, 210, 110);
      ctx.fillStyle = "rgba(157, 243, 189, 0.08)";
      ctx.fillRect(390, 248, 215, 110);
      ctx.fillStyle = "rgba(255, 208, 106, 0.08)";
      ctx.fillRect(602, 128, 130, 160);
    }

    function drawAnchor(anchor) {
      const x = anchor.x + anchor.dx;
      const y = anchor.y + anchor.dy;
      ctx.save();
      ctx.translate(x, y);
      const selected = anchor.id === state.selected;
      ctx.globalAlpha = anchor.deleted ? 0.3 : 1;
      ctx.strokeStyle = anchor.tracked ? anchor.color : "#ff768d";
      ctx.fillStyle = anchor.locatable && anchor.tracked ? anchor.color : "#ff768d";
      ctx.lineWidth = selected ? 5 : 3;
      ctx.beginPath();
      ctx.arc(0, 0, selected ? 30 : 24, 0, Math.PI * 2);
      ctx.stroke();
      if (!anchor.locatable || !anchor.tracked) {
        ctx.setLineDash([7, 7]);
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillRect(-4, -4, 8, 8);
      ctx.fillStyle = "#f3fffb";
      ctx.font = "700 15px Inter, sans-serif";
      ctx.fillText(anchor.id, 38, -8);
      ctx.fillStyle = "#9fb5b2";
      ctx.font = "12px Inter, sans-serif";
      const status = anchor.deleted ? "deleted" : !anchor.tracked ? "not in set" : !anchor.locatable ? "unlocatable" : "pose ok";
      ctx.fillText(status, 38, 11);
      ctx.restore();

      ctx.strokeStyle = "rgba(243, 255, 251, 0.16)";
      ctx.setLineDash([3, 6]);
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawTimeline() {
      const x = 72;
      const y = 438;
      const width = canvas.width - 144;
      ctx.fillStyle = "rgba(3, 10, 12, 0.7)";
      ctx.strokeStyle = "rgba(243, 255, 251, 0.13)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x, y, width, 82, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#9fb5b2";
      ctx.font = "12px Inter, sans-serif";
      ctx.fillText("frame updates: trackedAnchors -> getPose(anchorSpace) -> queue", x + 16, y + 24);
      state.queue.slice(0, 4).forEach((item, index) => {
        const px = x + 18 + index * 168;
        const py = y + 48;
        ctx.fillStyle = item.severity >= 3 ? "#ff768d" : item.severity === 2 ? "#ffd06a" : "#9df3bd";
        ctx.fillRect(px, py, 10, 10);
        ctx.fillStyle = "#f3fffb";
        ctx.font = "12px Inter, sans-serif";
        ctx.fillText(`${item.anchorId} ${item.type}`, px + 18, py + 10);
      });
    }

    function renderQueue() {
      out.queue.innerHTML = "";
      if (state.queue.length === 0) {
        const empty = document.createElement("div");
        empty.className = "queue-item";
        empty.innerHTML = '<span class="dot"></span><span>no recovery actions</span><span>ok</span>';
        out.queue.append(empty);
        return;
      }
      state.queue.forEach((item) => {
        const row = document.createElement("div");
        row.className = "queue-item";
        const cls = item.severity >= 3 ? "fail" : item.severity === 2 ? "warn" : "";
        row.innerHTML = `<span class="dot ${cls}"></span><span>${item.anchorId} ${item.type}<br>${item.label}</span><span>f${item.frame}</span>`;
        out.queue.append(row);
      });
    }

    function render() {
      drawGrid();
      anchors.forEach(drawAnchor);
      drawTimeline();

      const trackedCount = anchors.filter((anchor) => anchor.tracked && !anchor.deleted).length;
      const missCount = anchors.reduce((sum, anchor) => sum + anchor.misses, 0);
      out.headline.textContent = `${trackedCount} anchors / ${state.lastDecision}`;
      out.tracked.textContent = `${trackedCount} / ${anchors.length}`;
      out.unlocatable.textContent = String(missCount);
      out.failures.textContent = String(state.failures);
      out.decision.textContent = state.lastDecision;
      out.jitter.textContent = controls.jitter.value;
      out.drop.textContent = controls.dropRate.value;
      out.budget.textContent = controls.restoreBudget.value;
      renderQueue();

      const payload = {
        frame: state.frame,
        feature: "anchors",
        trackedAnchors: anchors.filter((anchor) => anchor.tracked && !anchor.deleted).map((anchor) => anchor.id),
        selectedAnchor: state.selected,
        anchorPoses: anchors.map((anchor) => ({
          id: anchor.id,
          locatable: anchor.locatable,
          deleted: anchor.deleted,
          persistentHandle: anchor.persistent,
          unlocatableFrames: anchor.misses,
          driftCm: Math.round(Math.hypot(anchor.dx, anchor.dy))
        })),
        recoveryQueue: state.queue,
        decision: state.lastDecision
      };
      out.payload.textContent = JSON.stringify(payload, null, 2);
    }

    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (canvas.width / rect.width);
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);
      let best = anchors[0];
      let bestDistance = Infinity;
      anchors.forEach((anchor) => {
        const distance = Math.hypot(x - (anchor.x + anchor.dx), y - (anchor.y + anchor.dy));
        if (distance < bestDistance) {
          best = anchor;
          bestDistance = distance;
        }
      });
      state.selected = best.id;
      render();
    });

    document.getElementById("tick").addEventListener("click", advanceFrame);
    document.getElementById("restore").addEventListener("click", restoreSelected);
    document.getElementById("delete").addEventListener("click", deleteSelected);
    document.getElementById("auto").addEventListener("click", () => {
      state.auto = !state.auto;
      document.getElementById("auto").textContent = state.auto ? "stop auto" : "auto run";
    });
    Object.values(controls).forEach((control) => control.addEventListener("input", render));

    setInterval(() => {
      if (state.auto) advanceFrame();
    }, 680);

    render();
  </script>
</body>
</html>
