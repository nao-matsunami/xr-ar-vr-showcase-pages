<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Row Foveation Replayer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111313;
      --panel: #192123;
      --panel2: #232c2e;
      --line: #465356;
      --text: #f4f1e8;
      --muted: #b1bfc1;
      --blue: #86d6ff;
      --green: #a8df8e;
      --gold: #e7bf70;
      --red: #ec7f76;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(145deg, rgba(134, 214, 255, 0.10), transparent 42%),
        linear-gradient(315deg, rgba(231, 191, 112, 0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 40px; }
    header { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 16px; margin-bottom: 16px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(25, 33, 35, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
    }
    .panel { padding: 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    code { color: var(--blue); }
    .stage { min-height: 420px; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 14, 15, 0.72); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 21px; overflow-wrap: anywhere; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      align-content: center;
      min-height: 260px;
      border: 1px solid rgba(244, 241, 232, 0.18);
      border-radius: 8px;
      padding: 12px;
      background: #12191a;
    }
    .tile {
      aspect-ratio: 1;
      border-radius: 5px;
      border: 1px solid rgba(244, 241, 232, 0.14);
      background: var(--tile);
      box-shadow: 0 0 18px color-mix(in srgb, var(--tile) 34%, transparent);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .tile:hover { transform: translateY(-2px); }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    select, input, button, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    input[type="range"] { padding: 0; accent-color: var(--blue); }
    button { cursor: pointer; font-weight: 800; background: var(--blue); color: #071012; border-color: transparent; }
    section { padding: 16px; margin-top: 16px; }
    textarea { width: 100%; min-height: 150px; padding: 12px; resize: vertical; line-height: 1.45; }
    .routes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .route { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 14, 15, 0.58); }
    .route strong { display: block; margin-bottom: 5px; }
    .route span { color: var(--muted); font-size: 13px; }
    @media (max-width: 820px) {
      header, .controls, .routes { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tiles { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Crop Row Foveation Replayer</h1>
        <p>1本目の crop row を読み込み、tile ごとに <code>full-rate</code> / <code>lower-rate</code> / <code>guard-band</code> / <code>fallback</code> を再判定します。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>Route</span><strong id="routeLabel">ready</strong></div>
          <div class="metric"><span>Full tiles</span><strong id="fullLabel">0</strong></div>
          <div class="metric"><span>Guard</span><strong id="guardLabel">0</strong></div>
          <div class="metric"><span>Policy</span><strong id="policyLabel">balanced</strong></div>
        </div>
        <div class="tiles" id="tiles"></div>
        <p id="hint">crop guard 内は full rate、端の risk が高い領域だけ foveation を強めます。</p>
      </div>
    </header>

    <div class="controls">
      <label>Policy
        <select id="policy">
          <option value="balanced">balanced</option>
          <option value="strict">strict</option>
          <option value="forgiving">forgiving</option>
        </select>
      </label>
      <label>Head motion
        <input id="motion" type="range" min="0" max="100" value="28">
      </label>
      <label>Preset
        <select id="preset">
          <option value="imported">imported / pasted</option>
          <option value="center">centered viewport</option>
          <option value="edge">edge crop</option>
          <option value="high">high foveation</option>
        </select>
      </label>
      <label>Action
        <button id="applyButton" type="button">replay crop</button>
      </label>
    </div>

    <section>
      <h2>Import Crop Row</h2>
      <textarea id="jsonIn" spellcheck="false"></textarea>
    </section>

    <section>
      <h2>Route Mix</h2>
      <div class="routes" id="routes"></div>
    </section>
  </main>

  <script>
    const els = {
      policy: document.querySelector("#policy"),
      motion: document.querySelector("#motion"),
      preset: document.querySelector("#preset"),
      applyButton: document.querySelector("#applyButton"),
      jsonIn: document.querySelector("#jsonIn"),
      tiles: document.querySelector("#tiles"),
      routes: document.querySelector("#routes"),
      routeLabel: document.querySelector("#routeLabel"),
      fullLabel: document.querySelector("#fullLabel"),
      guardLabel: document.querySelector("#guardLabel"),
      policyLabel: document.querySelector("#policyLabel"),
      hint: document.querySelector("#hint")
    };

    const presets = {
      center: { viewportPercent: { x: 10, y: 12, width: 78, height: 72 }, foveation: "low", guardPx: 12, visible: 92, route: "commit-viewport" },
      edge: { viewportPercent: { x: 24, y: 22, width: 82, height: 78 }, foveation: "medium", guardPx: 36, visible: 61, route: "expand-guard" },
      high: { viewportPercent: { x: 8, y: 10, width: 58, height: 54 }, foveation: "high", guardPx: 32, visible: 49, route: "foveation-hold" }
    };

    function currentRow() {
      if (els.preset.value !== "imported") return presets[els.preset.value];
      try {
        const parsed = JSON.parse(els.jsonIn.value);
        return Array.isArray(parsed) ? parsed[0] : parsed;
      } catch {
        return presets.edge;
      }
    }

    function thresholds() {
      return {
        strict: { full: 72, lower: 52, fallbackMotion: 68 },
        balanced: { full: 62, lower: 42, fallbackMotion: 82 },
        forgiving: { full: 50, lower: 30, fallbackMotion: 92 }
      }[els.policy.value];
    }

    function classify(score, row, limit, motion) {
      if (row.route === "projection-fallback" || motion > limit.fallbackMotion) return "fallback";
      if (score >= limit.full) return "full-rate";
      if (score >= limit.lower) return "lower-rate";
      return "guard-band";
    }

    function replay() {
      const row = currentRow();
      const vp = row.viewportPercent || presets.center.viewportPercent;
      const limit = thresholds();
      const motion = Number(els.motion.value);
      const foveationDebt = { none: 0, low: 6, medium: 14, high: 24 }[row.foveation || "low"] || 6;
      const counts = { "full-rate": 0, "lower-rate": 0, "guard-band": 0, fallback: 0 };
      const tiles = Array.from({ length: 50 }, (_, index) => {
        const col = index % 10;
        const line = Math.floor(index / 10);
        const x = col * 10 + 5;
        const y = line * 20 + 10;
        const inside = x >= vp.x && x <= vp.x + vp.width && y >= vp.y && y <= vp.y + vp.height;
        const edge = Math.min(Math.abs(x - vp.x), Math.abs(x - (vp.x + vp.width)), Math.abs(y - vp.y), Math.abs(y - (vp.y + vp.height)));
        const base = inside ? 80 : 28;
        const score = Math.max(0, Math.min(100, Math.round(base + edge * 0.8 - foveationDebt - motion * 0.18 - (row.guardPx || 0) * 0.25)));
        const route = classify(score, row, limit, motion);
        counts[route] += 1;
        return { score, route };
      });
      const dominant = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      els.routeLabel.textContent = dominant;
      els.fullLabel.textContent = counts["full-rate"];
      els.guardLabel.textContent = counts["guard-band"];
      els.policyLabel.textContent = els.policy.value;
      els.hint.textContent = dominant === "full-rate"
        ? "中心 viewport は full-rate で維持できます。"
        : dominant === "lower-rate"
          ? "端の tile だけ foveation を強めれば継続できます。"
          : dominant === "guard-band"
            ? "guard band を広げ、UI と reticle を内側へ寄せます。"
            : "head motion または crop risk が高く、projection fallback が安全です。";
      els.tiles.innerHTML = tiles.map((tile) => {
        const color = {
          "full-rate": "var(--green)",
          "lower-rate": "var(--blue)",
          "guard-band": "var(--gold)",
          fallback: "var(--red)"
        }[tile.route];
        return `<div class="tile" title="${tile.route} ${tile.score}" style="--tile:${color}"></div>`;
      }).join("");
      els.routes.innerHTML = Object.entries(counts).map(([route, count]) => `
        <div class="route"><strong>${route}</strong><span>${count} tiles</span></div>
      `).join("");
    }

    els.jsonIn.value = JSON.stringify(presets.edge, null, 2);
    [els.policy, els.motion, els.preset].forEach((el) => el.addEventListener("input", replay));
    els.applyButton.addEventListener("click", replay);
    replay();
  </script>
</body>
</html>
