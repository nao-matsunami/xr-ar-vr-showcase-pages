<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesh Confidence Window</title><style>:root{color-scheme:dark;--b:#07131a;--p:#0d2631;--l:#275667;--t:#e7f9ff;--m:#a3c0ca;--c:#67e8f9;--g:#8cf2b1;--a:#ffd36a;--r:#ff87a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#155e71,transparent 35%),var(--b);font:15px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:26px 16px 46px}h1{margin:0;font-size:clamp(27px,5vw,43px)}p{line-height:1.65;color:var(--m)}.grid{display:grid;grid-template-columns:1fr .9fr;gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.scene{height:300px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#24596b,#071118 76%)}.mesh{position:absolute;inset:14% 12%;clip-path:polygon(5% 38%,22% 5%,49% 21%,77% 4%,96% 41%,82% 93%,52% 76%,18% 94%);background:repeating-linear-gradient(58deg,transparent 0 23px,#8cf2b166 24px 26px),repeating-linear-gradient(-35deg,transparent 0 30px,#8cf2b166 31px 33px),#8cf2b126;border:2px solid var(--g);transition:.35s}.mesh.mid{filter:saturate(.7);clip-path:polygon(5% 40%,26% 9%,53% 20%,81% 9%,96% 43%,79% 88%,48% 76%,17% 89%)}.mesh.low{filter:grayscale(.7);clip-path:polygon(8% 42%,30% 12%,73% 12%,93% 45%,73% 85%,27% 84%);border-color:var(--a)}.mesh.block{opacity:.17;border-color:var(--r)}button{font:inherit;color:var(--t);background:#143c4c;border:1px solid #407c8e;border-radius:9px;padding:9px 10px;cursor:pointer}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.meter{height:14px;border-radius:99px;background:#061017;overflow:hidden;border:1px solid var(--l)}#bar{height:100%;width:82%;background:var(--g);transition:.35s}.row{margin:10px 0;padding:10px;border:1px solid var(--l);border-radius:10px;font:12px ui-monospace}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}pre{white-space:pre-wrap;margin:0;min-height:158px;font:12px ui-monospace;color:#d5edf3}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Mesh Confidence <span style="color:var(--c)">Window</span></h1><p>派生の自作試作。環境メッシュを信頼度に応じて「精密な衝突面」から「注意を促す領域」へ段階的に扱い、低品質時の自動 commit を止めます。</p><div class="grid"><section class="card"><div class="scene"><div id="mesh" class="mesh"></div></div><div class="buttons"><button data-q="high">high: place</button><button data-q="mid">mid: preview</button><button data-q="low">low: block</button><button id="commit">commit label</button></div><p id="state">high quality: precise surface candidate を利用できます。</p></section><aside class="card"><b>placement contract</b><div class="row">mesh confidence: <span id="score">82%</span><div class="meter"><div id="bar"></div></div></div><div class="row">allowed action: <span id="action" class="good">place + commit</span></div><div class="row">label receipt: <span id="receipt">not committed</span></div><div class="buttons"><button id="export">copy decision</button><button id="reset">reset</button></div><pre id="log"></pre></aside></div></main><script>const $=s=>document.querySelector(s);let q='high',committed=false,log=[];const config={high:[82,'place + commit','good','precise surface candidate'],mid:[54,'preview only','warn','boundary is approximate; require confirmation'],low:[19,'block placement','bad','do not treat mesh as a placement surface']};function note(v){log.unshift('['+new Date().toISOString().slice(11,19)+'] '+v);$('#log').textContent=log.join('\n')}function draw(){let [n,a,c,msg]=config[q];$('#mesh').className='mesh '+(q==='mid'?'mid':q==='low'?'low block':'');$('#score').textContent=n+'%';$('#bar').style.width=n+'%';$('#bar').style.background=q==='high'?'var(--g)':q==='mid'?'var(--a)':'var(--r)';let x=$('#action');x.textContent=a;x.className=c;$('#state').textContent=msg;$('#receipt').textContent=committed?'label committed from '+q+' window':'not committed'}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q=b.dataset.q;committed=false;note('quality → '+q+'; '+config[q][1]);draw()});$('#commit').onclick=()=>{if(q==='low'){note('blocked: low quality mesh cannot commit');return}committed=true;note('commit: label receipt from '+q+' confidence window');draw()};$('#export').onclick=async()=>{let t=JSON.stringify({confidence:config[q][0],action:config[q][1],committed},null,2);try{await navigator.clipboard.writeText(t);note('decision copied')}catch{note('clipboard unavailable: '+t.replace(/\n/g,' '))}};$('#reset').onclick=()=>{q='high';committed=false;log=[];note('ready: choose a confidence window');draw()};$('#reset').click()</script></html>
