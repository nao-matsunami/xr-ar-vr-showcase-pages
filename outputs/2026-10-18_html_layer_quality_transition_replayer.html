<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layer Quality Transition Replayer</title><style>
:root{color-scheme:dark;--bg:#08111b;--p:#102234;--line:#31536e;--ink:#eaf5f9;--mut:#9db4c3;--cyan:#66dfdb;--lime:#bce97c;--amber:#f5c66b;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17445b,transparent 42%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{width:min(1080px,calc(100% - 28px));margin:auto;padding:26px 0 48px}.hero,.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.box{background:#102234e8;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 12px 30px #0006}h1{font-size:clamp(28px,5vw,47px);line-height:1;margin:0 0 11px}h2{font-size:17px;margin:0 0 10px}p{margin:0;color:var(--mut);line-height:1.65}button,select,textarea{margin-top:12px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#142d40;color:var(--ink);font:inherit;padding:8px 10px}button{cursor:pointer;border-color:var(--cyan);background:#14545d}textarea{width:100%;height:150px;resize:vertical}.frames{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.frame{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#091722}.keep{border-color:var(--lime)}.degrade{border-color:var(--amber)}.redraw{border-color:var(--cyan)}.destroy{border-color:var(--red)}.rows{display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:10px;padding:11px;background:#091722}.route{font-size:27px;color:var(--cyan);margin:8px 0}@media(max-width:720px){.hero,.grid{grid-template-columns:1fr}.frames{grid-template-columns:repeat(4,1fr)}}
</style><main><div class="hero"><section class="box"><h1>Layer Quality<br>Transition Replayer</h1><p>本命が保存した lifecycle row を読む派生試作です。8 frame の GPU 圧を再生し、同じ layer がいつ keep / degrade / redraw / destroy に変わるかを確認します。</p></section><section class="box"><h2>Replay route</h2><div id="route" class="route">—</div><p id="reason">保存済み row を読んでからパターンを選びます。</p><select id="pattern"><option value="pulse">HUD pulse</option><option value="thermal">thermal pressure</option><option value="recovery">recovery ramp</option></select><button id="load">localStorage から読む</button></section></div><div class="grid"><section class="box"><h2>Input row</h2><textarea id="input" spellcheck="false"></textarea><button id="replay">貼り付けた row を再生</button></section><section class="box"><h2>Transition notes</h2><div id="notes" class="rows"></div></section></div><section class="box"><h2>8-frame lifecycle</h2><div id="frames" class="frames"></div></section></main><script>
const $=s=>document.querySelector(s);let row={ledger:[{name:'pin HUD',importance:96,contentPressure:8},{name:'spatial note',importance:68,contentPressure:4},{name:'media panorama',importance:34,contentPressure:2}]};const patterns={pulse:[1,2,7,4,2,8,3,1],thermal:[3,5,7,9,10,9,7,5],recovery:[9,8,7,6,5,4,3,2]};function route(item,load){const score=(item.importance||50)*.65+(item.contentPressure||0)*4-load*6;if(load>=9&&item.importance<55)return'destroy';if(load>=7&&score<60)return'degrade';if((item.contentPressure||0)>=5&&load<9)return'redraw';return'keep'}function replay(){const p=patterns[$('#pattern').value],top=[...row.ledger].sort((a,b)=>(b.importance||0)-(a.importance||0));const frames=p.map((load,i)=>{const routes=top.map(x=>route(x,load));return{frame:i+1,load,routes}});$('#frames').innerHTML=frames.map(x=>`<div class="frame ${x.routes[0]}"><b>F${x.frame}</b><br><small>load ${x.load}</small><br><small>${x.routes.join(' / ')}</small></div>`).join('');const totals=frames.flatMap(x=>x.routes).reduce((a,x)=>(a[x]=(a[x]||0)+1,a),{});$('#route').textContent=Object.entries(totals).map(([k,v])=>`${v} ${k}`).join(' · ');$('#reason').textContent='Route order: pin HUD / spatial note / media panorama. Critical frames shed the least important layer before the readable HUD.';$('#notes').innerHTML=top.map(x=>`<div class="row"><b>${x.name}</b><br><small>importance ${x.importance||'—'} · baseline pressure ${x.contentPressure||0} · next: use actual redraw and GPU timing samples.</small></div>`).join('')}function load(){const raw=localStorage.getItem('xr-layer-quality-lifecycle-row');if(raw){row=JSON.parse(raw);$('#input').value=JSON.stringify(row,null,2)}replay()}$('#load').onclick=load;$('#replay').onclick=()=>{try{row=JSON.parse($('#input').value);replay()}catch{alert('JSON row を確認してください')}};$('#pattern').onchange=replay;$('#input').value=JSON.stringify(row,null,2);replay();
</script>
