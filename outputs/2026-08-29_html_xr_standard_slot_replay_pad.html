<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XR Standard Slot Replay Pad</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121311;
      --panel: rgba(22, 24, 20, 0.94);
      --line: rgba(226, 202, 128, 0.27);
      --text: #fffcec;
      --muted: #c9bea2;
      --gold: #e2ca80;
      --green: #9fdc8a;
      --cyan: #8bd5dd;
      --red: #ff8c91;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(130deg, rgba(226, 202, 128, 0.14), transparent 30%),
        linear-gradient(235deg, rgba(139, 213, 221, 0.13), transparent 34%),
        linear-gradient(180deg, #121311, #1f211a 60%, #0d0f0c);
    }

    main {
      width: min(1160px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.42rem, 2.6vw, 2.18rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 825px;
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }

    .badge, .stage, .panel, .metric, .slot, .event {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.26);
    }

    .badge {
      min-width: 242px;
      padding: 12px 14px;
    }

    small, label span, .metric small, .slot small, .event small {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      color: var(--gold);
      font-size: 1.08rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
    }

    .stage {
      min-height: 640px;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255, 252, 236, 0.12);
      border-radius: 8px;
      background: rgba(8, 9, 7, 0.46);
    }

    button, select, input {
      min-height: 38px;
      border: 1px solid rgba(255, 252, 236, 0.18);
      border-radius: 8px;
      background: rgba(255, 252, 236, 0.08);
      color: var(--text);
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 0 14px;
      font-weight: 760;
    }

    button:hover { border-color: rgba(226, 202, 128, 0.75); }
    select, input { width: 100%; padding: 0 10px; }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(300px, 1.05fr);
      gap: 12px;
      min-height: 440px;
    }

    .slots, .timeline {
      display: grid;
      gap: 9px;
      align-content: start;
    }

    .slot, .event {
      padding: 11px;
      background: rgba(8, 9, 7, 0.48);
      box-shadow: none;
    }

    .slot {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 80px;
      gap: 10px;
      align-items: center;
    }

    .slot.hot {
      border-color: rgba(159, 220, 138, 0.8);
      background: rgba(159, 220, 138, 0.15);
    }

    .slot.placeholder {
      border-color: rgba(255, 140, 145, 0.58);
      background: rgba(255, 140, 145, 0.11);
    }

    .slot b, .event b {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .slot p, .event p {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.42;
    }

    .pill {
      display: inline-grid;
      place-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(226, 202, 128, 0.14);
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 760;
      text-align: center;
    }

    .event.active {
      border-color: rgba(139, 213, 221, 0.75);
      background: rgba(139, 213, 221, 0.13);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      padding: 10px;
      min-width: 0;
      background: rgba(8, 9, 7, 0.52);
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel {
      padding: 14px;
      display: grid;
      gap: 13px;
      align-content: start;
    }

    label { display: grid; gap: 6px; }

    .check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .check input { width: 18px; min-height: 18px; }

    @media (max-width: 900px) {
      header, .layout, .board, .metrics {
        grid-template-columns: 1fr;
      }
      .stage { min-height: auto; }
      .badge { min-width: 0; }
      .slot { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>XR Standard Slot Replay Pad</h1>
        <p class="subtitle">`xr-standard` mapping の button / axes slot をリプレイし、trigger / squeeze / touchpad / thumbstick から semantic action を作る派生試作。実 controller がなくても placeholder と deadzone の影響を確認できます。</p>
      </div>
      <div class="badge">
        <small>action route</small>
        <strong id="verdict">idle</strong>
      </div>
    </header>

    <div class="layout">
      <section class="stage">
        <div class="toolbar">
          <button id="stepBtn">Step frame</button>
          <button id="playBtn">Auto replay</button>
          <button id="resetBtn">Reset</button>
        </div>

        <div class="board">
          <div class="slots" id="slots"></div>
          <div class="timeline" id="timeline"></div>
        </div>

        <div class="metrics">
          <div class="metric"><small>frame</small><strong id="frame">0</strong></div>
          <div class="metric"><small>primary action</small><strong id="primary">none</strong></div>
          <div class="metric"><small>deadzone</small><strong id="deadzoneMetric">0.18</strong></div>
          <div class="metric"><small>placeholder hits</small><strong id="placeholderHits">0</strong></div>
        </div>
      </section>

      <aside class="panel">
        <label>
          <span>controller shape</span>
          <select id="shape">
            <option value="full">trigger + squeeze + thumbstick</option>
            <option value="trigger">trigger only</option>
            <option value="touchpad">trigger + touchpad</option>
            <option value="unknown">non xr-standard fallback</option>
          </select>
        </label>
        <label>
          <span>scenario</span>
          <select id="scenario">
            <option value="selectMove">select then move</option>
            <option value="grabTurn">grab then turn</option>
            <option value="touchDrift">touchpad drift</option>
          </select>
        </label>
        <label>
          <span>axis deadzone</span>
          <input id="deadzone" type="range" min="0" max="40" value="18">
        </label>
        <label class="check">
          <input id="strictMapping" type="checkbox" checked>
          <span>`mapping === "xr-standard"` 以外は semantic action を制限する</span>
        </label>
        <label class="check">
          <input id="holdSqueeze" type="checkbox">
          <span>squeeze を hold 状態として維持する</span>
        </label>
      </aside>
    </div>
  </main>

  <script>
    const slots = [
      { type: "button", index: 0, key: "trigger", label: "Primary trigger", action: "select" },
      { type: "button", index: 1, key: "squeeze", label: "Primary squeeze", action: "grab" },
      { type: "button", index: 2, key: "touchpad", label: "Primary touchpad", action: "cursor press" },
      { type: "button", index: 3, key: "thumbstick", label: "Primary thumbstick", action: "move mode" },
      { type: "axis", index: 0, key: "touchpadX", label: "Touchpad X", action: "cursor x" },
      { type: "axis", index: 1, key: "touchpadY", label: "Touchpad Y", action: "cursor y" },
      { type: "axis", index: 2, key: "thumbstickX", label: "Thumbstick X", action: "turn" },
      { type: "axis", index: 3, key: "thumbstickY", label: "Thumbstick Y", action: "move" }
    ];

    const shapes = {
      full: new Set(["trigger", "squeeze", "thumbstick", "thumbstickX", "thumbstickY"]),
      trigger: new Set(["trigger"]),
      touchpad: new Set(["trigger", "touchpad", "touchpadX", "touchpadY"]),
      unknown: new Set(["trigger", "thumbstickX", "thumbstickY"])
    };

    const frames = {
      selectMove: [
        { trigger: 0.1, squeeze: 0, thumbstickX: 0, thumbstickY: 0 },
        { trigger: 0.92, squeeze: 0, thumbstickX: 0.08, thumbstickY: 0.2 },
        { trigger: 0.72, squeeze: 0, thumbstickX: 0.34, thumbstickY: -0.66 },
        { trigger: 0.08, squeeze: 0, thumbstickX: 0, thumbstickY: 0 }
      ],
      grabTurn: [
        { trigger: 0, squeeze: 0.18, thumbstickX: 0, thumbstickY: 0 },
        { trigger: 0, squeeze: 0.88, thumbstickX: 0.74, thumbstickY: 0.08 },
        { trigger: 0.4, squeeze: 0.96, thumbstickX: -0.58, thumbstickY: 0.12 },
        { trigger: 0, squeeze: 0.22, thumbstickX: 0, thumbstickY: 0 }
      ],
      touchDrift: [
        { trigger: 0, touchpad: 0.2, touchpadX: 0.11, touchpadY: -0.08 },
        { trigger: 0, touchpad: 0.76, touchpadX: 0.48, touchpadY: -0.44 },
        { trigger: 0.66, touchpad: 0.7, touchpadX: -0.28, touchpadY: 0.5 },
        { trigger: 0, touchpad: 0.1, touchpadX: 0.02, touchpadY: 0.01 }
      ]
    };

    let frameIndex = 0;
    let timer = null;
    let history = [];
    const el = (id) => document.getElementById(id);

    function currentFrame() {
      const sequence = frames[el("scenario").value];
      return sequence[frameIndex % sequence.length];
    }

    function getValue(slot, frame, supported) {
      if (!supported.has(slot.key)) return { value: 0, placeholder: true };
      return { value: Number(frame[slot.key] || 0), placeholder: false };
    }

    function classify(frame, supported) {
      const deadzone = Number(el("deadzone").value) / 100;
      const strict = el("strictMapping").checked;
      const isStandard = el("shape").value !== "unknown";
      if (strict && !isStandard) return { primary: "visual-only fallback", route: "mapping blocked" };
      const trigger = getValue(slots[0], frame, supported).value;
      const squeeze = el("holdSqueeze").checked ? Math.max(0.72, getValue(slots[1], frame, supported).value) : getValue(slots[1], frame, supported).value;
      const tx = getValue(slots[6], frame, supported).value;
      const ty = getValue(slots[7], frame, supported).value;
      const px = getValue(slots[4], frame, supported).value;
      const py = getValue(slots[5], frame, supported).value;
      if (squeeze > 0.62) return { primary: "grab / hold", route: Math.abs(tx) > deadzone ? "grab + turn" : "grab" };
      if (trigger > 0.58) return { primary: "select", route: Math.abs(ty) > deadzone ? "select + move" : "select" };
      if (Math.abs(tx) > deadzone || Math.abs(ty) > deadzone) return { primary: "move", route: "thumbstick locomotion" };
      if (Math.abs(px) > deadzone || Math.abs(py) > deadzone) return { primary: "cursor nudge", route: "touchpad cursor" };
      return { primary: "none", route: "idle" };
    }

    function render() {
      const supported = shapes[el("shape").value];
      const frame = currentFrame();
      const decision = classify(frame, supported);
      let placeholderHits = 0;
      el("slots").innerHTML = slots.map((slot) => {
        const state = getValue(slot, frame, supported);
        if (state.placeholder) placeholderHits += 1;
        const hot = !state.placeholder && Math.abs(state.value) > Number(el("deadzone").value) / 100;
        const cls = state.placeholder ? "placeholder" : hot ? "hot" : "";
        return `<div class="slot ${cls}"><span class="pill">${slot.type === "button" ? "buttons" : "axes"}[${slot.index}]</span><div><small>${slot.label}</small><b>${state.placeholder ? "placeholder" : state.value.toFixed(2)}</b><p>${state.placeholder ? "reserved slot preserved" : slot.action}</p></div><span class="pill">${hot ? "hot" : state.placeholder ? "empty" : "low"}</span></div>`;
      }).join("");

      history.unshift({ frame: frameIndex, decision });
      history = history.slice(0, 7);
      el("timeline").innerHTML = history.map((item, index) => `<div class="event ${index === 0 ? "active" : ""}"><small>frame ${item.frame}</small><b>${item.decision.route}</b><p>primary: ${item.decision.primary}</p></div>`).join("");
      el("frame").textContent = String(frameIndex);
      el("primary").textContent = decision.primary;
      el("deadzoneMetric").textContent = (Number(el("deadzone").value) / 100).toFixed(2);
      el("placeholderHits").textContent = String(placeholderHits);
      el("verdict").textContent = decision.route;
    }

    function step() {
      frameIndex += 1;
      render();
    }

    el("stepBtn").addEventListener("click", step);
    el("playBtn").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        el("playBtn").textContent = "Auto replay";
        return;
      }
      timer = setInterval(step, 850);
      el("playBtn").textContent = "Stop replay";
    });
    el("resetBtn").addEventListener("click", () => {
      frameIndex = 0;
      history = [];
      render();
    });
    ["shape", "scenario", "deadzone", "strictMapping", "holdSqueeze"].forEach((id) => {
      el(id).addEventListener("input", render);
    });

    render();
  </script>
</body>
</html>
