<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Layer Control Fallback Deck</title>
  <link rel="stylesheet" href="../data/future-sample-theme.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: rgba(13, 16, 24, 0.9);
      --line: rgba(236, 241, 255, 0.15);
      --text: #f4f6ff;
      --muted: #adb4c8;
      --cyan: #79daf2;
      --green: #99df8e;
      --amber: #f2c46d;
      --red: #ff8178;
      --ink: #071017;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(150deg, #090b10 0%, #131b28 54%, #221711 100%);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 2.36rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .badge,
    .stage,
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    }

    .badge {
      min-width: 248px;
      padding: 12px 14px;
    }

    .badge small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge strong {
      display: block;
      margin-top: 5px;
      color: var(--cyan);
      font-size: 1.04rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
    }

    .stage {
      overflow: hidden;
      min-height: 620px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 620px;
      background: #081018;
      cursor: pointer;
      touch-action: none;
    }

    .side {
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .panel {
      padding: 14px;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 11px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    select,
    input,
    button {
      width: 100%;
      border: 1px solid rgba(244, 246, 255, 0.15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
    }

    select,
    input { padding: 10px; }

    button {
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.primary {
      color: var(--ink);
      border-color: transparent;
      background: var(--cyan);
      font-weight: 760;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .routes {
      display: grid;
      gap: 8px;
    }

    .route {
      padding: 9px;
      border: 1px solid rgba(244, 246, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
    }

    .route b {
      display: block;
      font-size: 0.86rem;
    }

    .route span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .route.is-active {
      border-color: rgba(121, 218, 242, 0.7);
      background: rgba(121, 218, 242, 0.13);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 0.76rem;
    }

    .chip.is-hot {
      color: var(--ink);
      background: var(--cyan);
      font-weight: 760;
    }

    @media (max-width: 880px) {
      header,
      .layout { display: grid; grid-template-columns: 1fr; }
      .badge { min-width: 0; }
      canvas { height: 520px; }
      .stage { min-height: 520px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Media Layer Control Fallback Deck</h1>
        <p>XRMediaBinding の equirect / cylinder media layer を想定し、動画の準備状態、再生制御、decoder 負荷、fallback を1枚の操作デッキで確認します。</p>
      </div>
      <div class="badge">
        <small>Playback route</small>
        <strong id="routeRead">Equirect media layer</strong>
      </div>
    </header>

    <section class="layout">
      <div class="stage">
        <canvas id="stage" width="820" height="620"></canvas>
      </div>

      <aside class="side">
        <section class="panel">
          <h2>Media knobs</h2>
          <div class="control">
            <label for="shape">Layer shape <span id="shapeValue">equirect</span></label>
            <select id="shape">
              <option value="equirect">360 equirect video</option>
              <option value="cylinder">Curved cylinder screen</option>
              <option value="quad">Flat quad monitor</option>
            </select>
          </div>
          <div class="control">
            <label for="xr">XR support <span id="xrValue">media layers</span></label>
            <select id="xr">
              <option value="media">XRMediaBinding available</option>
              <option value="webgl">XRWebGLBinding only</option>
              <option value="canvas">No layers, canvas fallback</option>
            </select>
          </div>
          <div class="control">
            <label for="ready">Video readiness <span id="readyValue">82%</span></label>
            <input id="ready" type="range" min="0" max="100" value="82">
          </div>
          <div class="control">
            <label for="decoder">Decoder pressure <span id="decoderValue">34%</span></label>
            <input id="decoder" type="range" min="0" max="100" value="34">
          </div>
          <div class="button-grid">
            <button id="rewindButton" type="button">-10s</button>
            <button class="primary" id="playButton" type="button">Play</button>
            <button id="forwardButton" type="button">+10s</button>
          </div>
        </section>

        <section class="panel">
          <h2>Routes</h2>
          <div class="routes" id="routes"></div>
          <div class="chips" id="chips"></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const controls = {
      shape: document.getElementById("shape"),
      xr: document.getElementById("xr"),
      ready: document.getElementById("ready"),
      decoder: document.getElementById("decoder")
    };
    const routeRead = document.getElementById("routeRead");
    let playing = false;
    let time = 42;
    let lastTick = performance.now();

    function pct(n) {
      return `${Math.round(n)}%`;
    }

    function state() {
      const shape = controls.shape.value;
      const xr = controls.xr.value;
      const ready = Number(controls.ready.value);
      const decoder = Number(controls.decoder.value);
      let route = "Canvas video fallback";
      let verdict = "wait for user gesture";
      if (xr === "media" && ready > 55 && decoder < 76) {
        route = shape === "equirect" ? "Equirect media layer" : shape === "cylinder" ? "Cylinder media layer" : "Quad media layer";
        verdict = "direct media compositor path";
      } else if (xr !== "canvas" && ready > 35) {
        route = "Projection layer texture";
        verdict = "copy video frame into WebGL";
      } else if (ready <= 35) {
        route = "Poster frame and controls";
        verdict = "show loading reason";
      }
      const health = Math.max(0, Math.min(100, ready - decoder * 0.55 + (xr === "media" ? 24 : 4)));
      return { shape, xr, ready, decoder, route, verdict, health };
    }

    function drawDeck(s) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grd.addColorStop(0, "#081018");
      grd.addColorStop(0.62, "#14202d");
      grd.addColorStop(1, "#21170f");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(244,246,255,.08)";
      for (let x = 42; x < canvas.width; x += 62) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      const centerX = canvas.width / 2;
      const centerY = 270;
      ctx.fillStyle = "rgba(121,218,242,.14)";
      ctx.strokeStyle = s.route.includes("media") ? "#79daf2" : s.route.includes("Projection") ? "#f2c46d" : "#ff8178";
      ctx.lineWidth = 3;
      if (s.shape === "equirect") {
        ctx.beginPath();
        ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.08)";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 88, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.shape === "cylinder") {
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, 210, 78, 0, Math.PI * 0.08, Math.PI * 0.92);
        ctx.stroke();
        ctx.lineTo(centerX - 170, centerY + 94);
        ctx.ellipse(centerX, centerY + 94, 170, 50, 0, Math.PI * 0.92, Math.PI * 0.08, true);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.roundRect(centerX - 190, centerY - 105, 380, 210, 8);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = "#f4f6ff";
      ctx.font = "800 22px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(s.route, centerX, centerY + 10);
      ctx.fillStyle = "rgba(244,246,255,.7)";
      ctx.font = "14px Inter, sans-serif";
      ctx.fillText(s.verdict, centerX, centerY + 38);
      ctx.textAlign = "start";

      const timelineX = 70;
      const timelineY = 512;
      const timelineW = canvas.width - 140;
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.roundRect(timelineX, timelineY, timelineW, 12, 8);
      ctx.fill();
      ctx.fillStyle = s.health > 70 ? "#99df8e" : s.health > 42 ? "#f2c46d" : "#ff8178";
      ctx.roundRect(timelineX, timelineY, timelineW * (time / 120), 12, 8);
      ctx.fill();
      ctx.fillStyle = "#f4f6ff";
      ctx.font = "700 13px Inter, sans-serif";
      ctx.fillText(`media time ${Math.round(time)}s / 120s`, timelineX, timelineY - 16);

      const chips = [
        [`ready ${pct(s.ready)}`, s.ready > 55],
        [`decoder ${pct(s.decoder)}`, s.decoder < 76],
        [s.xr, s.xr === "media"],
        [playing ? "playing" : "paused", playing]
      ];
      chips.forEach(([label, hot], index) => {
        const x = 64 + index * 160;
        ctx.fillStyle = hot ? "#79daf2" : "rgba(255,255,255,.08)";
        ctx.roundRect(x, 96, 136, 38, 8);
        ctx.fill();
        ctx.fillStyle = hot ? "#071017" : "#f4f6ff";
        ctx.font = "700 13px Inter, sans-serif";
        ctx.fillText(label, x + 14, 120);
      });
    }

    function updateRoutes(s) {
      document.getElementById("shapeValue").textContent = s.shape;
      document.getElementById("xrValue").textContent = s.xr === "media" ? "media layers" : s.xr;
      document.getElementById("readyValue").textContent = pct(s.ready);
      document.getElementById("decoderValue").textContent = pct(s.decoder);
      routeRead.textContent = s.route;
      const routes = [
        ["XRMediaBinding", "createEquirectLayer / createCylinderLayer when video is ready"],
        ["XRWebGLBinding", "copy video frame into projection or quad texture"],
        ["Canvas fallback", "show controls, poster, and reason text outside XR"]
      ];
      document.getElementById("routes").innerHTML = routes.map(([title, detail]) => {
        const active = s.route.includes(title.replace("XR", "").replace("Binding", "").trim()) || (title === "Canvas fallback" && s.route.includes("Canvas"));
        return `<div class="route ${active ? "is-active" : ""}"><b>${title}</b><span>${detail}</span></div>`;
      }).join("");
      const chips = [s.verdict, `health ${pct(s.health)}`, s.shape, playing ? "play request pending" : "paused control"];
      document.getElementById("chips").innerHTML = chips.map((chip, index) => `<span class="chip ${index === 0 ? "is-hot" : ""}">${chip}</span>`).join("");
    }

    function tick(now) {
      const elapsed = Math.min(0.05, (now - lastTick) / 1000);
      lastTick = now;
      if (playing) time = (time + elapsed * 10) % 120;
      const s = state();
      updateRoutes(s);
      drawDeck(s);
      requestAnimationFrame(tick);
    }

    Object.values(controls).forEach((control) => control.addEventListener("input", () => {
      const s = state();
      updateRoutes(s);
      drawDeck(s);
    }));
    document.getElementById("playButton").addEventListener("click", () => {
      playing = !playing;
      document.getElementById("playButton").textContent = playing ? "Pause" : "Play";
    });
    document.getElementById("rewindButton").addEventListener("click", () => {
      time = Math.max(0, time - 10);
    });
    document.getElementById("forwardButton").addEventListener("click", () => {
      time = Math.min(120, time + 10);
    });
    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();
      time = Math.max(0, Math.min(120, ((event.clientX - rect.left) / rect.width) * 120));
    });

    CanvasRenderingContext2D.prototype.roundRect ??= function roundRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      this.beginPath();
      this.moveTo(x + radius, y);
      this.arcTo(x + w, y, x + w, y + h, radius);
      this.arcTo(x + w, y + h, x, y + h, radius);
      this.arcTo(x, y + h, x, y, radius);
      this.arcTo(x, y, x + w, y, radius);
      this.closePath();
    };

    requestAnimationFrame(tick);
  </script>
</body>
</html>
