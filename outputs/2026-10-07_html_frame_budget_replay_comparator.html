<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Budget Replay Comparator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111416;
      --panel: #1b2327;
      --panel2: #26343a;
      --line: #607078;
      --text: #f7f1e9;
      --muted: #cbd0cc;
      --blue: #79bff0;
      --green: #9fdb86;
      --gold: #e8c46e;
      --red: #ef8179;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(145deg, rgba(121, 191, 240, 0.13), transparent 38%),
        linear-gradient(315deg, rgba(159, 219, 134, 0.1), transparent 56%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 35, 39, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 10, 12, 0.62); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 8px; min-height: 348px; align-content: center; }
    .frame {
      display: grid;
      grid-template-columns: 88px 1fr 110px;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: rgba(8, 10, 12, 0.55);
      color: var(--muted);
    }
    .track { height: 16px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); }
    .fill { height: 100%; width: 0; transition: width 0.18s ease; }
    .ok { background: var(--green); }
    .watch { background: var(--gold); }
    .fail { background: var(--red); }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    input[type="range"] { padding: 0; accent-color: var(--blue); }
    textarea { width: 100%; min-height: 180px; padding: 12px; resize: vertical; line-height: 1.45; }
    .queue { display: grid; gap: 8px; }
    .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 10, 12, 0.62); color: var(--muted); }
    @media (max-width: 900px) {
      header, .controls, .metrics, .frame { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Frame Budget Replay Comparator</h1>
        <p>本命サンプルの governor row を受け取った後の派生試作です。予測した route と、その後の 5 フレームの synthetic outcome を比較し、予測ミス、過剰な品質低下、reset が遅れた箇所を拾います。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>policy</span><strong id="policyMetric">-</strong></div>
          <div class="metric"><span>matched</span><strong id="matchedMetric">0</strong></div>
          <div class="metric"><span>late reset</span><strong id="lateMetric">0</strong></div>
          <div class="metric"><span>score</span><strong id="scoreMetric">0%</strong></div>
        </div>
        <div id="timeline" class="timeline" aria-label="frame budget replay timeline"></div>
      </div>
    </header>

    <div class="controls">
      <label>Seed route
        <select id="routeSelect">
          <option value="balanced-projection-layer">balanced-projection-layer</option>
          <option value="raise-foveation-keep-warp">raise-foveation-keep-warp</option>
          <option value="drop-peripheral-redraw">drop-peripheral-redraw</option>
          <option value="reduce-foveation-and-hold-warp">reduce-foveation-and-hold-warp</option>
          <option value="full-render-safety-frame">full-render-safety-frame</option>
        </select>
      </label>
      <label>Jitter rise
        <input id="jitterRange" type="range" min="0" max="100" value="34">
      </label>
      <label>GPU dip
        <input id="gpuDipRange" type="range" min="0" max="100" value="42">
      </label>
      <label>Depth delay
        <input id="depthDelayRange" type="range" min="0" max="100" value="38">
      </label>
      <label>Warp miss
        <input id="warpRange" type="range" min="0" max="100" value="44">
      </label>
    </div>

    <section>
      <h2>Replay findings</h2>
      <div id="queue" class="queue"></div>
    </section>

    <section>
      <h2>Export replay</h2>
      <textarea id="rowBox" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function classify(frameMs, qualityLoss, warpMiss, depthDelay) {
      if (frameMs > 20.5 || warpMiss > 0.82) return "full-render-safety-frame";
      if (frameMs > 18.3 || qualityLoss > 0.62) return "drop-peripheral-redraw";
      if (depthDelay > 0.7 || warpMiss > 0.58) return "reduce-foveation-and-hold-warp";
      if (frameMs < 15.4 && qualityLoss < 0.38) return "raise-foveation-keep-warp";
      return "balanced-projection-layer";
    }

    function compute() {
      const seedRoute = $("routeSelect").value;
      const jitterRise = Number($("jitterRange").value) / 100;
      const gpuDip = Number($("gpuDipRange").value) / 100;
      const depthDelay = Number($("depthDelayRange").value) / 100;
      const warpMiss = Number($("warpRange").value) / 100;
      const frames = Array.from({ length: 5 }, (_, index) => {
        const pulse = Math.sin((index + 1) * 1.22) * 0.08;
        const frameMs = clamp(15.2 + gpuDip * 4.8 + warpMiss * 2.2 + index * 0.42 + pulse * 6, 12, 24);
        const qualityLoss = clamp(jitterRise * 0.38 + depthDelay * 0.27 + warpMiss * 0.25 + index * 0.04 - gpuDip * 0.08, 0, 1);
        const route = classify(frameMs, qualityLoss, warpMiss + index * 0.04, depthDelay);
        const match = route === seedRoute || (seedRoute === "balanced-projection-layer" && route === "raise-foveation-keep-warp");
        const lateReset = route === "full-render-safety-frame" && index > 1 && seedRoute !== "full-render-safety-frame";
        return {
          index,
          frameMs: Number(frameMs.toFixed(2)),
          qualityLoss: Number(qualityLoss.toFixed(3)),
          route,
          match,
          lateReset
        };
      });
      const matched = frames.filter((frame) => frame.match).length;
      const lateReset = frames.filter((frame) => frame.lateReset).length;
      const score = clamp((matched / frames.length) - lateReset * 0.13 - frames.filter((frame) => frame.frameMs > 20).length * 0.08, 0, 1);
      return {
        type: "frame-budget-replay-comparator-row",
        date: "2026-10-07",
        seedRoute,
        jitterRise: Number(jitterRise.toFixed(2)),
        gpuDip: Number(gpuDip.toFixed(2)),
        depthDelay: Number(depthDelay.toFixed(2)),
        warpMiss: Number(warpMiss.toFixed(2)),
        matched,
        lateReset,
        score: Number(score.toFixed(3)),
        frames,
        next: "Import real headset frame rows from IndexedDB and compare governor decisions against observed frame time and route changes."
      };
    }

    function render() {
      const row = compute();
      $("policyMetric").textContent = row.seedRoute;
      $("matchedMetric").textContent = `${row.matched}/5`;
      $("lateMetric").textContent = row.lateReset;
      $("scoreMetric").textContent = `${Math.round(row.score * 100)}%`;
      $("timeline").innerHTML = row.frames.map((frame) => {
        const cls = frame.lateReset ? "fail" : frame.match ? "ok" : "watch";
        const width = clamp(100 - frame.qualityLoss * 72 - Math.max(0, frame.frameMs - 16.7) * 4, 6, 100);
        return `
          <div class="frame">
            <strong>f${frame.index}</strong>
            <div class="track"><div class="fill ${cls}" style="width:${width}%"></div></div>
            <span>${frame.frameMs} ms<br>${frame.route}</span>
          </div>
        `;
      }).join("");
      const findings = [];
      row.frames.forEach((frame) => {
        if (frame.lateReset) findings.push(`f${frame.index}: reset が遅い。次回は ${frame.route} を 1 frame 早く出す。`);
        else if (!frame.match) findings.push(`f${frame.index}: seed ${row.seedRoute} と観測 route ${frame.route} がずれた。`);
      });
      $("queue").innerHTML = findings.map((item) => `<div class="row">${item}</div>`).join("") || '<div class="row">予測 route と replay outcome は許容範囲です。</div>';
      $("rowBox").value = JSON.stringify(row, null, 2);
    }

    document.querySelectorAll("input, select").forEach((el) => el.addEventListener("input", render));
    render();
  </script>
</body>
</html>
