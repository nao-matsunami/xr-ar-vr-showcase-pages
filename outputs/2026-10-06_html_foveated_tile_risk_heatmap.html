<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foveated Tile Risk Heatmap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101315;
      --panel: #1a2225;
      --panel2: #253137;
      --line: #5b666c;
      --text: #f6f0e8;
      --muted: #c9cbc6;
      --blue: #7dbbef;
      --green: #9edb83;
      --gold: #e6bf66;
      --red: #ef817c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(140deg, rgba(125, 187, 239, 0.13), transparent 38%),
        linear-gradient(315deg, rgba(158, 219, 131, 0.10), transparent 56%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    header { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; margin-bottom: 14px; }
    .panel, .stage, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(26, 34, 37, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }
    .panel, section { padding: 18px; }
    .stage { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 10, 12, 0.62); }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      min-height: 342px;
    }
    .tile {
      min-height: 64px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px;
      color: #071014;
      font-size: 11px;
      font-weight: 700;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .tile.keep { background: var(--green); }
    .tile.blur { background: var(--blue); }
    .tile.redraw { background: var(--gold); }
    .tile.reset { background: var(--red); color: #1d0708; }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      min-width: 0;
    }
    input[type="range"] { padding: 0; accent-color: var(--blue); }
    textarea { width: 100%; min-height: 180px; padding: 12px; resize: vertical; line-height: 1.45; }
    .queue { display: grid; gap: 8px; }
    .row { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: rgba(8, 10, 12, 0.62); color: var(--muted); }
    @media (max-width: 900px) {
      header, .controls, .metrics { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="panel">
        <h1>Foveated Tile Risk Heatmap</h1>
        <p>本命サンプルの row を受け取った後を想定し、viewport を 8x4 tile に分けます。gaze center、周辺 foveation、Space Warp miss、depth stale から、tile ごとに retain / blur / redraw / full render を選びます。</p>
      </div>
      <div class="stage">
        <div class="metrics">
          <div class="metric"><span>retain</span><strong id="retainMetric">0</strong></div>
          <div class="metric"><span>blur</span><strong id="blurMetric">0</strong></div>
          <div class="metric"><span>redraw</span><strong id="redrawMetric">0</strong></div>
          <div class="metric"><span>reset</span><strong id="resetMetric">0</strong></div>
        </div>
        <div id="grid" class="grid" aria-label="foveated tile risk heatmap"></div>
      </div>
    </header>

    <div class="controls">
      <label>Gaze X
        <input id="xRange" type="range" min="0" max="100" value="52">
      </label>
      <label>Gaze Y
        <input id="yRange" type="range" min="0" max="100" value="48">
      </label>
      <label>Foveation
        <input id="foveationRange" type="range" min="0" max="100" value="56">
      </label>
      <label>Warp miss
        <input id="missRange" type="range" min="0" max="110" value="38">
      </label>
      <label>Depth stale
        <input id="depthRange" type="range" min="0" max="150" value="48">
      </label>
    </div>

    <section>
      <h2>Tile decisions</h2>
      <div id="queue" class="queue"></div>
    </section>

    <section>
      <h2>Export row</h2>
      <textarea id="rowBox" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const cols = 8;
    const rows = 4;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function classify(risk) {
      if (risk > 76) return "reset";
      if (risk > 54) return "redraw";
      if (risk > 30) return "blur";
      return "keep";
    }

    function compute() {
      const gazeX = Number($("xRange").value) / 100;
      const gazeY = Number($("yRange").value) / 100;
      const fixedFoveation = Number($("foveationRange").value) / 100;
      const warpMissPx = Number($("missRange").value);
      const depthStaleMs = Number($("depthRange").value);
      const tiles = [];
      const counts = { keep: 0, blur: 0, redraw: 0, reset: 0 };
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < cols; x += 1) {
          const cx = (x + 0.5) / cols;
          const cy = (y + 0.5) / rows;
          const distance = Math.hypot(cx - gazeX, (cy - gazeY) * 1.2);
          const foveationRisk = clamp((distance - 0.12) * 105 * fixedFoveation, 0, 72);
          const warpRisk = clamp(warpMissPx * (0.24 + distance * 0.42), 0, 62);
          const depthRisk = clamp(depthStaleMs * (0.12 + distance * 0.18), 0, 54);
          const risk = clamp(foveationRisk + warpRisk + depthRisk, 0, 100);
          const route = classify(risk);
          counts[route] += 1;
          tiles.push({
            id: `t${y}-${x}`,
            x,
            y,
            distance: Number(distance.toFixed(3)),
            risk: Number(risk.toFixed(1)),
            route
          });
        }
      }
      return {
        type: "foveated-tile-risk-heatmap-row",
        date: "2026-10-06",
        gazeX: Number(gazeX.toFixed(2)),
        gazeY: Number(gazeY.toFixed(2)),
        fixedFoveation: Number(fixedFoveation.toFixed(2)),
        warpMissPx,
        depthStaleMs,
        counts,
        tiles,
        next: "Import the budget mixer row directly, then store tile routes as an overlay QA trace for headset sessions."
      };
    }

    function render() {
      const row = compute();
      $("retainMetric").textContent = row.counts.keep;
      $("blurMetric").textContent = row.counts.blur;
      $("redrawMetric").textContent = row.counts.redraw;
      $("resetMetric").textContent = row.counts.reset;
      $("grid").innerHTML = row.tiles.map((tile) => `
        <div class="tile ${tile.route}" title="${tile.id} risk ${tile.risk}">
          <span>${tile.route}<br>${tile.risk}</span>
        </div>
      `).join("");
      $("queue").innerHTML = row.tiles
        .filter((tile) => tile.route !== "keep")
        .slice(0, 10)
        .map((tile) => `<div class="row">${tile.id}: ${tile.route} / risk ${tile.risk} / distance ${tile.distance}</div>`)
        .join("") || '<div class="row">All tiles can retain the projected layer.</div>';
      $("rowBox").value = JSON.stringify(row, null, 2);
    }

    document.querySelectorAll("input").forEach((el) => el.addEventListener("input", render));
    render();
  </script>
</body>
</html>
