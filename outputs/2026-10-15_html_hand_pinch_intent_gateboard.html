<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Pinch Intent Gateboard</title><style>
:root{color-scheme:dark;--bg:#101619;--p:#1b282b;--p2:#26383b;--l:#748d90;--t:#f4f1e8;--m:#c5d1d1;--c:#83d9d1;--g:#a9e39a;--y:#f0cc73;--r:#ef837e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 14% 5%,#194249,transparent 36%),var(--bg);color:var(--t);font:15px system-ui,sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:25px 0 42px}header,.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;margin-bottom:14px}.box{background:#1b282be8;border:1px solid var(--l);border-radius:10px;padding:17px;box-shadow:0 15px 35px #0005}h1{font-size:clamp(30px,5vw,50px);line-height:1;margin:0 0 12px}h2{font-size:18px;margin:0 0 11px}p,.hint{color:var(--m);line-height:1.65;margin:0}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}button,select,input,textarea{min-height:42px;border:1px solid var(--l);border-radius:8px;background:var(--p2);color:var(--t);padding:0 11px;font:inherit}button{background:#23515a;border-color:var(--c);cursor:pointer}label{display:grid;gap:4px;color:var(--m);font-size:12px}input[type=range]{padding:0;accent-color:var(--c)}.metrics,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric,.card,.row{border:1px solid var(--l);border-radius:8px;background:#07101280;padding:10px}.metric span,.card small{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.metric b{font-size:17px}.cards{grid-template-columns:repeat(3,1fr)}.card b{display:block;font-size:14px}.bar{height:10px;border:1px solid var(--l);border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--g);transition:.18s}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;margin-top:8px;background:var(--g);color:#07110e}.warn{background:var(--y)}.bad{background:var(--r)}textarea{width:100%;min-height:242px;padding:11px;resize:vertical;line-height:1.45}.rows{display:grid;gap:8px}.row{color:var(--m);overflow-wrap:anywhere}@media(max-width:850px){header,.grid,.toolbar,.metrics,.cards{grid-template-columns:1fr}}
</style></head><body><main><header><div class="box"><h1>Hand Pinch Intent Gateboard</h1><p>手の index-tip / thumb-tip の距離、関節追跡、速度、target ray、入力の競合をまとめ、通常のピンチを「確定」「プレビュー」「待機」に振り分ける自作試作です。システム予約の palm pinch は明示的に通しません。</p></div><div class="box"><div class="metrics"><div class="metric"><span>intent</span><b id="intent">—</b></div><div class="metric"><span>confidence</span><b id="confidence">—</b></div><div class="metric"><span>route</span><b id="route">—</b></div><div class="metric"><span>hold reason</span><b id="hold">—</b></div></div></div></header><div class="toolbar"><select id="preset"><option value="steady">steady pinch</option><option value="jitter">jittery pinch</option><option value="system">system palm pinch</option><option value="lost">joint loss</option><option value="controller">controller takeover</option></select><label>tip distance (mm)<input id="distance" type="range" min="4" max="52" value="12"></label><label>joint tracking %<input id="tracking" type="range" min="0" max="100" value="96"></label><label>motion stability %<input id="stability" type="range" min="0" max="100" value="91"></label><button id="copy">Copy intent row</button></div><div class="grid"><section class="box"><h2>Joint & gesture gates</h2><div id="cards" class="cards"></div></section><section class="box"><h2>Intent row</h2><textarea id="out" spellcheck="false"></textarea></section></div><section class="box"><h2>Decision ledger</h2><div id="ledger" class="rows"></div></section></main><script>
const presets={steady:{d:12,t:96,s:91,system:false,controller:false},jitter:{d:18,t:78,s:42,system:false,controller:false},system:{d:8,t:94,s:90,system:true,controller:false},lost:{d:15,t:38,s:65,system:false,controller:false},controller:{d:11,t:97,s:94,system:false,controller:true}};
const $=s=>document.querySelector(s), els={preset:$('#preset'),d:$('#distance'),t:$('#tracking'),s:$('#stability'),out:$('#out'),cards:$('#cards'),intent:$('#intent'),confidence:$('#confidence'),route:$('#route'),hold:$('#hold'),ledger:$('#ledger')};
function state(){const p=presets[els.preset.value],d=+els.d.value,t=+els.t.value,s=+els.s.value;const pinch=Math.max(0,Math.min(100,100-(d-6)*2.2));const geometry=Math.round((t*.55+s*.25+pinch*.2));let intent='preview',route='reticle-preview',hold='pinch-not-closed';if(p.system){intent='blocked';route='system-reserved';hold='palm-pinch-reserved'}else if(p.controller){intent='hold';route='controller-primary';hold='controller-active'}else if(t<55){intent='hold';route='joint-reacquire';hold='joint-tracking-low'}else if(d<=18&&s>=70&&geometry>=78){intent='commit';route='select-event';hold='none'}else if(d<=26&&geometry>=58){intent='preview';route='hover-reticle';hold=s<70?'motion-jitter':'confirm-distance'}else{intent='hold';route='hand-idle';hold='pinch-open'};return{date:'2026-10-15',sample:'hand-pinch-intent-gateboard',profile:els.preset.value,tipDistanceMm:d,jointTracking:t,motionStability:s,pinchScore:Math.round(pinch),gesture: p.system?'palm-pinch':'regular-pinch',controllerActive:p.controller,confidence:geometry,intent,route,hold,next:'log XRInputSource.hand joints and select event timestamps'} }
function render(){const r=state(), gates=[['index / thumb gap',r.pinchScore,`≤ 18mm で閉じ判定`],['joint tracking',r.jointTracking,'25 joints の pose availability'],['motion stability',r.motionStability,'短い window の tip velocity'],['gesture ownership',r.gesture==='palm-pinch'?0:r.controllerActive?35:100,r.gesture==='palm-pinch'?'system gesture is reserved':r.controllerActive?'controller owns primary':'regular pinch is app candidate'],['target route',r.confidence,r.route],['commit confidence',r.confidence,`${r.intent} / ${r.hold}`]];els.cards.innerHTML=gates.map(([n,v,x])=>`<div class="card"><b>${n}</b><small>${x}</small><div class="bar"><div class="fill ${v<45?'bad':v<75?'warn':''}" style="width:${v}%"></div></div><span class="pill ${r.intent==='blocked'?'bad':r.intent!=='commit'?'warn':''}">${Math.round(v)}%</span></div>`).join('');els.out.value=JSON.stringify(r,null,2);els.intent.textContent=r.intent;els.confidence.textContent=r.confidence+'%';els.route.textContent=r.route;els.hold.textContent=r.hold;els.ledger.innerHTML=[`gesture=${r.gesture} · ${r.tipDistanceMm}mm · joints ${r.jointTracking}%`,`intent=${r.intent} → ${r.route}; hold=${r.hold}`,r.intent==='commit'?'通常ピンチだけを select candidate として確定。':'確定せず preview / reacquire / controller route へ縮退。'].map(x=>`<div class="row">${x}</div>`).join('')}
els.preset.onchange=()=>{const p=presets[els.preset.value];els.d.value=p.d;els.t.value=p.t;els.s.value=p.s;render()};[els.d,els.t,els.s].forEach(x=>x.oninput=render);$('#copy').onclick=()=>navigator.clipboard?.writeText(els.out.value);render();
</script></body></html>
