<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bounded Space Reset Lab</title><style>:root{color-scheme:dark;--bg:#07111d;--card:#102339;--line:#315878;--text:#e7f6ff;--muted:#a7c0d0;--cyan:#73ddff;--mint:#82edbe;--amber:#ffd074;--red:#ff899c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#1a4762,transparent 35%),var(--bg);font:15px system-ui;color:var(--text)}main{max-width:1050px;margin:auto;padding:25px 16px 48px}h1{margin:0;font-size:clamp(28px,5vw,43px)}p{line-height:1.6;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.card{background:#102339dd;border:1px solid var(--line);border-radius:16px;padding:15px}.stage{height:340px;position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 52% 57%,#285b70,#07101c 66%)}.gridline{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 28px,#70dfff12 29px 30px),repeating-linear-gradient(90deg,transparent 0 28px,#70dfff12 29px 30px)}.bounds{position:absolute;left:19%;top:14%;width:61%;height:67%;border:3px solid var(--mint);border-radius:24px 37px 26px 34px;box-shadow:inset 0 0 36px #82edbe18;transition:.35s}.bounds.reset{border-color:var(--amber);transform:rotate(-5deg) scale(.84);opacity:.82}.bounds.lost{border-color:var(--red);border-style:dashed;opacity:.35}.viewer{position:absolute;left:50%;top:54%;width:19px;height:19px;border-radius:50%;background:var(--cyan);box-shadow:0 0 24px var(--cyan);transform:translate(-50%,-50%)}.viewer:after{content:'viewer';position:absolute;top:25px;left:-8px;font:11px ui-monospace;color:var(--cyan)}.cue{position:absolute;right:13%;top:17%;padding:8px 10px;border:1px solid var(--mint);border-radius:8px;font:12px ui-monospace;color:var(--mint);background:#07131ee8;transition:.25s}.cue.warn{border-color:var(--amber);color:var(--amber)}.cue.stop{border-color:var(--red);color:var(--red)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;color:var(--text);background:#16405a;border:1px solid #4382a1;border-radius:9px;padding:9px 10px;cursor:pointer}button:hover{border-color:var(--cyan)}.row{margin:9px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace}.state{font-weight:700}.ok{color:var(--mint)}.warn{color:var(--amber)}.stop{color:var(--red)}pre{min-height:138px;white-space:pre-wrap;color:#d1efff;font:12px ui-monospace}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>Bounded Space <span style="color:var(--cyan)">Reset</span> Lab</h1><p>自作の最小試作。安全境界を表示するだけでなく、参照空間の不連続時に移動・表示・再確認を分けて切り替えます。</p><div class="grid"><section class="card"><div class="stage"><div class="gridline"></div><div id="bounds" class="bounds"></div><div class="viewer"></div><div id="cue" class="cue">safe perimeter / live</div></div><div class="buttons"><button data-m="live">境界: live</button><button data-m="reset">参照空間 reset</button><button data-m="missing">境界なし</button><button id="probe">WebXR probe</button></div><p id="meaning">状態を選ぶと、移動の扱いと安全 cue が receipt に記録されます。</p></section><aside class="card"><b>boundary receipt</b><div class="row">reference space: <span id="space">awaiting</span></div><div class="row">locomotion: <span id="move">—</span></div><div class="row">comfort cue: <span id="comfort">—</span></div><div class="buttons"><button id="copy">copy receipt</button><button id="reset">reset</button></div><pre id="log"></pre><p>実機では <code>requestReferenceSpace('bounded-floor')</code> を試し、<code>reset</code> と <code>boundsGeometry</code> の変化を個別に扱います。</p></aside></div></main><script>const $=s=>document.querySelector(s);let mode='live',history=[];const rules={live:{space:'bounded-floor / current',move:'allow inside perimeter',comfort:'quiet edge cue',cls:'ok',cue:'safe perimeter / live',text:'現在の境界。利用者は境界内の移動を続けられ、端だけを静かに示します。'},reset:{space:'reset / reconcile',move:'pause + reconfirm',comfort:'amber recalibration cue',cls:'warn',cue:'boundary changed / pause',text:'原点または環境との対応が不連続になった状態。古い境界に基づく移動を一度止め、新しい範囲を再確認します。'},missing:{space:'fallback local-floor',move:'stationary only',comfort:'no perimeter; restrict',cls:'stop',cue:'no boundary / stationary',text:'境界を受け取れない状態。境界があるように装わず、定点体験へ縮退します。'}};function note(x){history.unshift('['+new Date().toISOString().slice(11,19)+'] '+x);$('#log').textContent=history.join('\n')}function render(){let r=rules[mode],b=$('#bounds'),c=$('#cue');b.className='bounds '+(mode==='reset'?'reset':mode==='missing'?'lost':'');c.className='cue '+(mode==='reset'?'warn':mode==='missing'?'stop':'');c.textContent=r.cue;for(let [id,v] of Object.entries({space:r.space,move:r.move,comfort:r.comfort})){let e=$('#'+id);e.textContent=v;e.className='state '+r.cls}$('#meaning').textContent=r.text;note(r.space+' → '+r.move)}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});$('#probe').onclick=async()=>{let x='WebXR unavailable';try{x=navigator.xr?'immersive-vr: '+await navigator.xr.isSessionSupported('immersive-vr'):'WebXR unavailable'}catch(e){x='probe error: '+e.name}note(x)};$('#copy').onclick=async()=>{let r=rules[mode],x=JSON.stringify({referenceSpace:r.space,locomotion:r.move,comfortCue:r.comfort},null,2);try{await navigator.clipboard.writeText(x);note('receipt copied')}catch{note(x)}};$('#reset').onclick=()=>{mode='live';history=[];render()};$('#reset').click()</script></html>
